  st.forEach(s=>Object.entries(s.q||{}).forEach(([id,x])=>{ const a=agg[id]||{ok:0,n:0}; agg[id]={ok:a.ok+(x.ok||0), n:a.n+(x.n||0)}; }));
  ss.forEach(s=>(s.perguntas||[]).forEach(p=>{ if(!p.id) return; const a=agg[p.id]||{ok:0,n:0}; agg[p.id]={ok:a.ok+(p.acertos||0), n:a.n+(p.jogadores||0)}; }));
  const worst=Object.entries(agg).filter(([id,x])=>x.n>=2&&BANK.some(q=>q.id===id)).map(([id,x])=>({q:BANK.find(q=>q.id===id), x, err:1-x.ok/x.n})).filter(o=>o.err>0).sort((a,b)=>b.err-a.err||b.x.n-a.x.n).slice(0,10);
  h+='<div class="card"><h2>Perguntas que a equipe mais erra</h2>';
  if(!worst.length) h+='<p class="empty">Ainda não há respostas suficientes. Cada pergunta precisa ter sido respondida pelo menos 2 vezes.</p>';
  else h+='<ol class="worst">'+worst.map(o=>{ const w=(where(o.q)||{}).path; return '<li><div class="wbar"><i style="width:'+Math.round(o.err*100)+'%"></i></div><div><span class="chip">'+o.q.m+'</span> <b>'+Math.round(o.err*100)+'% de erro</b> <small>('+(o.x.n-o.x.ok)+' de '+o.x.n+' respostas)</small><p>'+esc(o.q.p)+'</p><small>Certa: '+esc(o.q.t==="vf"?(o.q.a?"Verdadeiro":"Falso"):o.q.o[0])+(w?' · 📍 '+esc(w):'')+'</small></div></li>'; }).join("")+'</ol>';
  h+='</div><div class="card"><h2>Sessões ao vivo</h2>';
  if(!ss.length) h+='<p class="empty">Nenhuma sessão ao vivo concluída ainda.</p>';
  else h+='<ul class="sessions">'+ss.slice(0,20).map(s=>{ const pl=(s.jogadores||[]); return '<li><details><summary><b>'+(s.criadoEm?new Date(s.criadoEm).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"")+'</b> · '+pl.length+' participantes · '+(s.total||0)+' perguntas · '+esc((s.modulos||[]).join(", "))+(pl[0]?' · 🏆 '+esc(pl[0].nome):'')+'</summary>'+
      '<div style="overflow-x:auto"><table class="table"><thead><tr><th>#</th><th>Participante</th><th>Acertos</th><th>Pontos</th></tr></thead><tbody>'+pl.map((p,i)=>'<tr><td>'+(i+1)+'º</td><td>'+esc(p.nome)+'</td><td>'+(p.ok||0)+'</td><td>'+(p.pts||0)+'</td></tr>').join("")+'</tbody></table></div>'+
      '<ol class="sq">'+(s.perguntas||[]).map(p=>'<li>'+esc(p.p||"")+' <b>'+(p.jogadores?Math.round((p.acertos||0)/p.jogadores*100):0)+'% acertaram</b></li>').join("")+'</ol></details></li>'; }).join("")+'</ul>';
  return h+'</div></section>';
}

/* ================= Ao vivo ================= */
const LIVE={role:null};
/* ---- Diagnóstico de conexão do ao vivo ---- */
let CAPS_READY=false, LTEST="";
function roomErr(e){
  const c=(e&&e.code)||"";
  const m={not_granted:"sua conta não tem acesso à sala ao vivo. Entre com a sua conta Google e tente de novo.",
    "permission-denied":"sua conta não tem permissão para esta ação. Entre com a sua conta Google aprovada.",
    not_permitted:"as salas ao vivo não estão liberadas para a sua conta neste link. Peça a quem compartilhou para te adicionar diretamente.",
    limit_reached:"há salas demais abertas neste aparelho. Feche outras abas do jogo e tente de novo.",
    upstream_error:"o servidor não respondeu a tempo. Confira a internet e tente de novo.",
    unavailable:"sem conexão com o servidor. Confira a internet e tente de novo."};
  return (m[c]||"não foi possível conectar")+(c?" (código: "+c+")":"");
}
function liveStatus(){
  if(!FB_CONFIG) return {ok:false, msg:"O jogo ainda não foi ligado ao Firebase (falta o arquivo config.js)."};
  if(!CAPS_READY) return {ok:null, msg:"Verificando a conexão…"};
  if(!myId) return {ok:false, msg:"Entre com a sua conta Google (botão no topo) para usar o ao vivo."};
  if(!room) return {ok:false, msg:"A sala ao vivo não carregou. Recarregue a página."};
  if(!db) return {ok:false, msg:"O banco do jogo não carregou. Recarregue a página."};
  return {ok:true, msg:"Pronto para o ao vivo: você entrou como "+((AUTH.profile||{}).nome||"")+"."};
}
function liveStatusHTML(){
  const s=liveStatus();
  return '<div class="lstatus '+(s.ok===true?'good':s.ok===false?'bad':'wait')+'" id="lv-status"><span>'+(s.ok===true?'✅':s.ok===false?'⚠️':'⏳')+' '+esc(s.msg)+'</span>'+
    (s.ok!==null?'<button class="linkbtn" data-act="live-test">Testar conexão</button>':'')+(LTEST?'<small>'+esc(LTEST)+'</small>':'')+'</div>';
}
async function liveTest(){
  const s=liveStatus(); if(!room){ LTEST="Teste: "+s.msg; render(); return; }
  LTEST="Testando…"; render();
  let r; try{ r=await room.join("teste-"+Date.now().toString(36)); }catch(e){ LTEST="Teste falhou: "+roomErr(e); render(); return; }
  try{ await r.presence({teste:true}); }catch(e){}
  let ok=false; for(let i=0;i<20&&!ok;i++){ await new Promise(x=>setTimeout(x,200)); try{ ok=r.connected(); }catch(e){} }
  try{ await r.leave(); }catch(e){}
  LTEST=ok?"Teste concluído: a sala ao vivo conecta normalmente neste aparelho.":"Teste: a sala abriu, mas a conexão não confirmou em 4 segundos. Confira a internet (redes corporativas às vezes bloqueiam) e tente de novo.";
  render();
}
function liveSetupHTML(){
  const ready=!!(window.claude&&window.claude.use);
  let h=liveStatusHTML()+'<div class="live-split">';
  h+='<div class="live-box"><h2>Entrar numa sala</h2><p class="mode-desc" style="margin:0 0 12px">Para quem vai responder pelo celular.</p>'+
    '<div class="field"><label for="lcode" style="font-weight:600">Código da sala</label><input type="text" id="lcode" inputmode="numeric" maxlength="4" placeholder="0000" value="'+esc(H.code)+'" class="codein"></div>'+
    '<div class="field"><label for="lnome" style="font-weight:600">Seu nome</label><input type="text" id="lnome" maxlength="24" placeholder="Como vai aparecer no telão" value="'+esc(AUTH.user?firstName(H.nome):H.nome)+'"></div>'+
    '<button class="go" data-act="live-join">Entrar na sala</button><p class="hint err">'+esc(H.lhint)+'</p></div>';
  h+='<div class="live-box"><h2>Comandar no telão</h2>';
  if(!ready||!myId) h+='<p class="empty">Entre com a conta Google do gestor para criar uma sala.</p>';
  else if(!canEdit) h+='<p class="empty">Só o gestor cria a sala no telão. Para participar, use “Entrar numa sala”.</p>';
  else h+=modsField()+catField()+'<div class="field"><span>Quantidade de perguntas</span>'+optBtns("ln",[5,10,15,20],H.ln,v=>v,v=>v>poolSize())+'</div>'+
    '<div class="field"><span>Tempo por pergunta</span>'+optBtns("lt",[20,30,45],H.lt,v=>v+" s")+'</div>'+
    '<button class="go alt" data-act="live-create">Criar sala no telão</button>';
  return h+'</div></div>';
}
function lkey(p){ return p.by||p.peer; }
function livePlayers(){ if(!LIVE.r) return []; return LIVE.r.peers().filter(p=>!p.sameTab&&p.presence&&p.presence.sala===LIVE.code&&typeof p.presence.nome==="string"&&p.presence.nome.trim()); }
const HOST_KEY="agrix-live-host", PLAYER_KEY="agrix-live-player";
function saveHost(){ if(LIVE.role!=="host"||LIVE.fase==="fim"||LIVE.fase==="encerrada") return; try{ store(HOST_KEY, JSON.stringify({code:LIVE.code, ids:LIVE.list.map(q=>q.id), idx:LIVE.idx, fase:LIVE.fase, limite:LIVE.limite, scores:LIVE.scores, names:LIVE.names, hist:LIVE.hist, mods:LIVE.mods, ts:Date.now()})); }catch(e){} }
function savedSession(key){ const s=loadJSON(key,null); return s&&s.code&&Date.now()-(s.ts||0)<3*3600*1000?s:null; }
function clearSaved(key){ try{ localStorage.removeItem(key); }catch(e){} }
function startPulse(){ clearInterval(LIVE.hb); LIVE.hb=setInterval(()=>{ if(LIVE.role==="host"&&LIVE.lastDoc&&!["fim","encerrada"].includes(LIVE.fase)) writeLive(LIVE.lastDoc,true); },45000); }
function writeLive(data, pulse){ if(!pulse){ LIVE.lastDoc=data; saveHost(); } const doc=Object.assign({codigo:LIVE.code, atualizadoEm:new Date().toISOString(), pulso:Date.now()}, data); LIVE.wq=(LIVE.wq||Promise.resolve()).then(()=>db.collection("live").doc(LIVE.code).set(doc)).catch(()=>{ toast('<b>Falha ao enviar para os celulares</b><span>Verifique a conexão.</span>'); }); return LIVE.wq; }
async function liveCreate(){
  if(!db||!room||!canEdit){ H.lhint="Não foi possível criar a sala nesta tela."; render(); return; }
  let code=""; for(let t=0;t<5;t++){ code=String(1000+rnd(9000)); try{ const s=await db.collection("live").doc(code).get(); if(!s.exists||["fim","encerrada"].includes((s.data()||{}).fase)) break; }catch(e){ break; } }
  let r; try{ r=await room.join("sala-"+code); }catch(e){ H.lhint="Não foi possível abrir a sala: "+roomErr(e); render(); return; }
  const pk=pickQuestions(H.ln, H.mods, new Set());
  Object.assign(LIVE,{role:"host", code, r, list:pk.list, idx:-1, fase:"lobby", limite:H.lt, scores:{}, names:{}, known:new Set(), hist:[], q:null, enter:false, mods:H.mods.slice()});
  r.presence({host:true}).catch(()=>{});
  LIVE.unsub=r.onPeers(()=>liveHostPeers());
  try{ LIVE.unconn=r.onConnection(on=>{ const el=$("#lv-conn"); if(el){ el.textContent=on?"● Conectado":"● Reconectando…"; el.className="conn "+(on?"on":"off"); } }); }catch(e){}
  await writeLive({fase:"lobby", total:pk.list.length, limite:H.lt}); startPulse();
  S.screen="live-host"; LINE="Sala "+code+" aberta! Entrem pelo celular."; render(); musicStart(0);
  say("Sala aberta! Entrem pelo celular com o código "+code.split("").join(" ")+".");
}
async function liveResume(){
  const s=savedSession(HOST_KEY); if(!s||!db||!room||!canEdit){ clearSaved(HOST_KEY); render(); return; }
  let d=null; try{ const snap=await db.collection("live").doc(s.code).get(); d=snap.exists?snap.data():null; }catch(e){}
  if(!d||["fim","encerrada"].includes(d.fase)){ clearSaved(HOST_KEY); toast('<b>Essa sala já foi encerrada</b><span>Crie uma sala nova.</span>'); render(); return; }
  let r; try{ r=await room.join("sala-"+s.code); }catch(e){ H.lhint="Não foi possível reabrir a sala: "+roomErr(e); render(); return; }
  const list=s.ids.map(id=>BANK.find(q=>q.id===id)).filter(Boolean);
  Object.assign(LIVE,{role:"host", code:s.code, r, list, idx:s.idx, fase:s.idx<0?"lobby":"placar", limite:s.limite, scores:s.scores||{}, names:s.names||{}, known:new Set(Object.keys(s.names||{})), hist:s.hist||[], q:null, enter:false, mods:s.mods||H.mods.slice()});
  if(s.fase==="pergunta"&&LIVE.idx>=0){ LIVE.idx--; } // a pergunta interrompida volta a ser feita
  LIVE.fase=LIVE.idx<0?"lobby":"placar";
  r.presence({host:true}).catch(()=>{});
  LIVE.unsub=r.onPeers(()=>liveHostPeers());
  try{ LIVE.unconn=r.onConnection(on=>{ const el=$("#lv-conn"); if(el){ el.textContent=on?"● Conectado":"● Reconectando…"; el.className="conn "+(on?"on":"off"); } }); }catch(e){}
  if(LIVE.fase==="lobby") await writeLive({fase:"lobby", total:list.length, limite:LIVE.limite});
  else await writeLive({fase:"placar", idx:Math.max(0,LIVE.idx), total:list.length, placar:livePlacar().slice(0,200)});
  startPulse(); S.screen="live-host"; render(); musicStart(0);
  say("Sala "+s.code+" reaberta! Quem saiu, é só entrar de novo com o mesmo código.");
}
function liveHostPeers(){
  const pl=livePlayers();
  pl.forEach(p=>{ const k=lkey(p); LIVE.names[k]=String(p.presence.nome).slice(0,24); if(!LIVE.known.has(k)){ LIVE.known.add(k); if(LIVE.fase==="lobby"){ sfx.pop(); } } });
  if(LIVE.fase==="lobby"){ const box=$("#lv-players"); if(box) box.innerHTML=lobbyChips(pl); const c=$("#lv-count"); if(c) c.textContent=pl.length; const b=$("#lv-start"); if(b) b.disabled=!pl.length; }
  if(LIVE.fase==="pergunta") liveTick();
}
function lobbyChips(pl){ return pl.length?pl.map((p,i)=>'<span class="pchip" style="--c:'+COLORS[i%COLORS.length]+'">'+esc(String(p.presence.nome).slice(0,24))+'</span>').join(""):'<span class="empty" style="border:none;padding:0">Esperando os participantes entrarem…</span>'; }
function liveNext(){
  LIVE.idx++; if(LIVE.idx>=LIVE.list.length){ liveEnd(); return; }
  const q=prep(LIVE.list[LIVE.idx]); LIVE.q=q; LIVE.fase="pergunta"; LIVE.t0=Date.now(); LIVE.enter=true; LIVE.lastTick=-1;
  writeLive({fase:"pergunta", idx:LIVE.idx, total:LIVE.list.length, limite:LIVE.limite, q:{p:q.src.p, opts:q.opts, t:q.src.t, m:q.src.m, d:q.src.d}});
  render(); musicStart(q.src.d); sfx.whoosh();
  say("Pergunta "+(LIVE.idx+1)+" de "+LIVE.list.length+"!");
  clearInterval(LIVE.timer); LIVE.timer=setInterval(liveTick,250);
}
function liveAnswered(){ return livePlayers().filter(p=>{ const r=p.presence.resp; return r&&r.i===LIVE.idx&&typeof r.a==="number"; }); }
function liveTick(){
  if(LIVE.fase!=="pergunta") return;
  const left=Math.max(0, LIVE.limite-(Date.now()-LIVE.t0)/1000), pl=livePlayers(), na=liveAnswered().length;
  const tb=$("#lv-timer"); if(tb){ tb.querySelector("b").textContent=Math.ceil(left); tb.querySelector(".fill").style.width=(left/LIVE.limite*100)+"%"; tb.classList.toggle("low",left<=5); }
  const ac=$("#lv-ans"); if(ac) ac.textContent=na+" de "+pl.length+" responderam";
  const sec=Math.ceil(left); if(sec<=5&&sec>0&&sec!==LIVE.lastTick){ LIVE.lastTick=sec; sfx.tick(); }
  if(left<=0||(pl.length>0&&na>=pl.length)) liveReveal();
}
function livePlacar(){ return Object.keys(LIVE.scores).map(k=>({k, nome:LIVE.names[k]||"Participante", pts:LIVE.scores[k].pts, ok:LIVE.scores[k].ok, ganho:(LIVE.scores[k].last||{}).ganho||0, acertou:!!(LIVE.scores[k].last||{}).ok})).sort((a,b)=>b.pts-a.pts||b.ok-a.ok); }
function liveReveal(){
  clearInterval(LIVE.timer); musicStop(); LIVE.fase="revelar";
  const q=LIVE.q, c=q.c, dist=q.opts.map(()=>0), pl=livePlayers(); let acertos=0, resp=0;
  pl.forEach(p=>{ const k=lkey(p); LIVE.names[k]=String(p.presence.nome).slice(0,24); if(!LIVE.scores[k]) LIVE.scores[k]={pts:0,ok:0,streak:0}; });
  Object.keys(LIVE.scores).forEach(k=>{ LIVE.scores[k].last={ok:false,ganho:0}; });
  pl.forEach(p=>{ const k=lkey(p), sc=LIVE.scores[k], r=p.presence.resp;
    if(r&&r.i===LIVE.idx&&typeof r.a==="number"&&r.a>=0&&r.a<dist.length){ resp++; dist[r.a]++;
      if(r.a===c){ acertos++; const frac=Math.min(1,Math.max(0,(+r.ms||0)/(LIVE.limite*1000))); let g=Math.round(500+500*(1-frac)); sc.streak++; if(sc.streak>=3) g+=100; sc.ok++; sc.pts+=g; sc.last={ok:true,ganho:g}; }
      else sc.streak=0; } else sc.streak=0; });
  LIVE.dist=dist; LIVE.hist.push({id:q.src.id, p:q.src.p, acertos, respostas:resp, jogadores:pl.length});
  const placar=livePlacar();
  writeLive({fase:"revelar", idx:LIVE.idx, total:LIVE.list.length, c, dist, e:q.src.e, w:(where(q.src)||{}).n||"", wm:q.src.m, q:{p:q.src.p, opts:q.opts, t:q.src.t, m:q.src.m, d:q.src.d}, placar:placar.slice(0,200)});
  render(); sfx.roll(1.2);
  setTimeout(()=>{ if(acertos>0){ sfx.right(); burstFrom($(".kopt.right"),60); } else sfx.wrong();
    const pctA=pl.length?Math.round(acertos/pl.length*100):0;
    say("A resposta certa é "+(q.src.t==="vf"?q.opts[c]:"a letra "+LET[c])+"! "+pctA+"% acertaram."); },1200);
}
function liveScoreboard(){ LIVE.fase="placar"; const placar=livePlacar(); writeLive({fase:"placar", idx:LIVE.idx, total:LIVE.list.length, placar:placar.slice(0,200)}); render(); sfx.whoosh(); if(placar[0]) say(placar[0].nome+" está na liderança!"); }
function liveEnd(){
  clearInterval(LIVE.timer); clearInterval(LIVE.hb); musicStop(); LIVE.fase="fim"; const placar=livePlacar(); clearSaved(HOST_KEY);
  writeLive({fase:"fim", total:LIVE.list.length, placar:placar.slice(0,200)});
  db.collection("sessoes").doc(LIVE.code+"-"+Date.now().toString(36)).set({criadoEm:new Date().toISOString(), codigo:LIVE.code, modulos:LIVE.mods, total:LIVE.list.length, jogadores:placar.slice(0,200).map(p=>({nome:p.nome, pts:p.pts, ok:p.ok})), perguntas:LIVE.hist}).catch(()=>{});
  render(); sfx.million(); confetti(220);
  say(placar[0]?"E o grande campeão é "+placar[0].nome+"!":"Fim de jogo!");
}
async function liveClose(){
  clearInterval(LIVE.timer); clearInterval(LIVE.hb); musicStop(); hush();
  if(LIVE.role==="host") clearSaved(HOST_KEY); if(LIVE.role==="player") clearSaved(PLAYER_KEY);
  if(LIVE.role==="host"&&LIVE.fase!=="fim") await writeLive({fase:"encerrada"});
  try{ if(LIVE.unsub) LIVE.unsub(); if(LIVE.unconn) LIVE.unconn(); if(LIVE.dbUnsub) LIVE.dbUnsub(); clearInterval(LIVE.ptimer); if(LIVE.r) await LIVE.r.leave(); }catch(e){}
  for(const k of Object.keys(LIVE)) delete LIVE[k]; LIVE.role=null;
  S.screen="inicio"; render();
}

  let snap; try{ snap=await db.collection("live").doc(code).get(); }catch(e){ H.lhint="Não foi possível verificar a sala: "+roomErr(e); render(); return; }
  const d=snap.exists?(snap.data()||{}):null;
  const stale=d&&(d.pulso?Date.now()-d.pulso>6*60000:Date.now()-Date.parse(d.atualizadoEm||0)>30*60000);
  if(d&&stale&&!["fim","encerrada"].includes(d.fase)){ H.lhint="A sala "+code+" não está ativa: o telão fechou ou recarregou. Peça para quem está no telão tocar em “Retomar a sala” ou criar uma sala nova."; render(); return; }
  if(!d||["fim","encerrada"].includes(d.fase)){ H.lhint="Sala "+code+" não encontrada ou já encerrada. Confira o código no telão."; render(); return; }
  let r; try{ r=await room.join("sala-"+code); }catch(e){ H.lhint="Não foi possível entrar na sala: "+roomErr(e); render(); return; }
  H.lhint="";
  Object.assign(LIVE,{role:"player", code, r, nome:nome.slice(0,24), state:null, my:null});
  store(PLAYER_KEY, JSON.stringify({code, nome:nome.slice(0,24), ts:Date.now()}));
  try{ await r.presence({nome:nome.slice(0,24), sala:code, resp:null}); }catch(e){ H.lhint="Entrou, mas não conseguiu se anunciar na sala: "+roomErr(e); try{ await r.leave(); }catch(x){} render(); return; }
  LIVE.joinedAt=Date.now(); LIVE.lastPulse=Date.now()-60000; LIVE.pulseVal=d.pulso;
  setTimeout(()=>{ if(S.screen==="live-player"&&LIVE.state&&LIVE.state.fase==="lobby") render(); },6500);
  S.screen="live-player";
  LIVE.dbUnsub=db.collection("live").doc(code).onSnapshot(s=>{ const dd=s.exists?s.data():null; if(dd) livePlayerUpdate(dd); }, ()=>{ toast('<b>Conexão com a sala perdida</b><span>Recarregue e entre de novo.</span>'); });
  livePlayerUpdate(d);
}
function hostSeen(){ return !!LIVE.lastPulse&&Date.now()-LIVE.lastPulse<120000; }
function myPeer(){ try{ const me=LIVE.r.peers().find(p=>p.sameTab); return me?me.peer:null; }catch(e){ return null; } }
function myEntry(pl){ if(!pl) return null; const mp=myPeer(); const i=pl.findIndex(x=>(myId&&x.k===myId)||(mp&&x.k===mp)); return i<0?null:Object.assign({pos:i+1}, pl[i]); }
function livePlayerUpdate(d){
  const prev=LIVE.state;
  const strip=x=>{ if(!x) return ""; const c=Object.assign({},x); delete c.pulso; delete c.atualizadoEm; return JSON.stringify(c); };
  if(d.pulso!==LIVE.pulseVal){ LIVE.pulseVal=d.pulso; LIVE.lastPulse=Date.now(); }
  if(prev&&strip(prev)===strip(d)){ LIVE.state=d; if(d.fase==="lobby"&&S.screen==="live-player") render(); return; } // só o pulso do telão mudou
  LIVE.state=d;
  if(d.fase==="pergunta"&&(!prev||prev.fase!=="pergunta"||prev.idx!==d.idx)){
    LIVE.shownAt=Date.now(); LIVE.my=null; sfx.whoosh(); if(navigator.vibrate) try{ navigator.vibrate(80); }catch(e){}
    clearInterval(LIVE.ptimer); LIVE.ptimer=setInterval(()=>{ const el=$("#pl-left"); if(!el||!LIVE.state||LIVE.state.fase!=="pergunta"){ return; } const left=Math.max(0,Math.ceil(LIVE.state.limite-(Date.now()-LIVE.shownAt)/1000)); el.textContent=left+"s"; if(left<=0&&LIVE.my==null){ clearInterval(LIVE.ptimer); render(); } },250);
  }
  if(d.fase==="revelar"&&prev&&prev.fase==="pergunta"){ const ok=LIVE.my!=null&&LIVE.my===d.c; if(ok){ sfx.right(); setTimeout(()=>confetti(60),200); } else sfx.wrong(); }
  if(d.fase==="fim"&&(!prev||prev.fase!=="fim")){ const me=myEntry(d.placar); sfx.end(); if(me&&me.pos<=3) confetti(160); }
  if(d.fase==="encerrada"){ toast('<b>A sala foi encerrada</b><span>Obrigado por jogar!</span>'); liveClose(); return; }
  render();
}
function livePlayerAnswer(a){
  const d=LIVE.state; if(!d||d.fase!=="pergunta"||LIVE.my!=null) return;
  const ms=Date.now()-LIVE.shownAt; if(ms>d.limite*1000+500) return;
  LIVE.my=a; LIVE.r.presence({resp:{i:d.idx, a, ms}}).catch(()=>{}); sfx.click(); if(navigator.vibrate) try{ navigator.vibrate(30); }catch(e){}
  render();
}
function livePlayerHTML(){
  const d=LIVE.state||{}, me=myEntry(d.placar);
  let h='<section class="phone"><div class="ph-top"><span>Sala <b>'+esc(LIVE.code)+'</b></span><span class="ph-name">'+esc(LIVE.nome)+'</span>'+(me?'<span><b>'+me.pts+'</b> pts</span>':'')+'</div>';
  const dead=!hostSeen()&&Date.now()-(LIVE.joinedAt||Date.now())>130000&&!["fim","encerrada"].includes(d.fase);
  if(dead) h+='<div class="lstatus bad"><span>⚠️ O telão parou de responder. Se ele recarregou, peça para tocar em “Retomar a sala”. Você continua na sala.</span></div>';
  if(d.fase==="lobby"){ const hostOn=hostSeen(), late=Date.now()-(LIVE.joinedAt||Date.now())>6000;
    h+='<div class="ph-wait"><div class="pulse-dot"></div><h2>Você está na sala!</h2><p>'+(hostOn?'✅ Telão conectado. Seu nome já aparece lá. Aguarde o apresentador começar.':late?'⚠️ Ainda não encontrei o telão nesta sala. Confira o código e se o telão continua com a sala aberta. Se continuar assim, toque em Sair e entre de novo.':'Procurando o telão…')+'</p>'+(!hostOn&&late?'<button class="btn ghost" data-act="live-leave">Sair da sala</button>':'')+'</div>'; }
  else if(d.fase==="pergunta"){
    const q=d.q||{}, left=Math.max(0,Math.ceil(d.limite-(Date.now()-(LIVE.shownAt||Date.now()))/1000));
    h+='<div class="ph-q"><div class="qmeta"><span class="chip">'+esc(q.m||"")+'</span><span class="chip">Pergunta '+(d.idx+1)+' de '+d.total+'</span><span class="chip" id="pl-left">'+left+'s</span></div><p>'+esc(q.p||"")+'</p></div>';
    if(LIVE.my!=null) h+='<div class="ph-wait"><div class="pulse-dot"></div><h2>Resposta enviada!</h2><p>Você escolheu <b>'+esc((q.opts||[])[LIVE.my]||"")+'</b>. Aguarde a revelação no telão.</p></div>';
    else if(left<=0) h+='<div class="ph-wait"><h2>Tempo esgotado</h2><p>Aguarde a revelação no telão.</p></div>';
    else h+='<div class="pad'+((q.opts||[]).length===2?' two':'')+'">'+(q.opts||[]).map((o,i)=>'<button class="padb" style="--k:'+KCOL[i]+'" data-act="live-ans" data-i="'+i+'"><span class="ksh">'+KSHAPE[i]+'</span><span>'+esc(o)+'</span></button>').join("")+'</div>';
  } else if(d.fase==="revelar"){
    const ok=LIVE.my!=null&&LIVE.my===d.c, q=d.q||{};
    h+='<div class="ph-res '+(ok?'ok':'bad')+'"><div class="big">'+(ok?'✓':'✗')+'</div><h2>'+(ok?'Acertou!':LIVE.my==null?'Sem resposta':'Errou')+'</h2>'+(ok&&me?'<p class="gain">+'+me.ganho+' pontos</p>':'')+'<p>Certa: <b>'+esc((q.opts||[])[d.c]||"")+'</b></p>'+(me?'<p>Você está em <b>'+me.pos+'º lugar</b></p>':'')+'</div><p class="ph-exp">'+esc(d.e||"")+'</p>'+shotHTML(d.w?scrByName(d.wm,d.w):null,true);
  } else if(d.fase==="placar") h+='<div class="ph-wait"><h2>'+(me?me.pos+'º lugar':'Placar no telão')+'</h2><p>'+(me?me.pts+' pontos, '+me.ok+' acerto'+(me.ok===1?'':'s')+'.':'')+' Próxima pergunta já já!</p></div>';
  else if(d.fase==="fim") h+='<div class="ph-res ok"><div class="big">'+(me&&me.pos<=3?['🥇','🥈','🥉'][me.pos-1]:'🎉')+'</div><h2>'+(me?me.pos+'º lugar':'Fim de jogo')+'</h2>'+(me?'<p><b>'+me.pts+'</b> pontos · '+me.ok+' acertos</p>':'')+'<p>Obrigado por jogar!</p><button class="btn" data-act="live-leave">Sair da sala</button></div>';
  return h+'</section>';
}

      confirmBox("Zerar o histórico?", "As perguntas destes módulos voltam a contar como inéditas"+(H.mode==="grupo"?" para o grupo neste aparelho.":" para "+H.nome+"."), "Sim, zerar", "Cancelar", ()=>{ clearSeen(); render(); }); return; }

    if(act==="live-resume"){ liveResume(); return; }
    if(act==="live-forget"){ clearSaved(HOST_KEY); clearSaved(PLAYER_KEY); render(); return; }
    if(act==="live-rejoin"){ const ps=savedSession(PLAYER_KEY); if(ps){ H.mode="aovivo"; H.code=ps.code; H.nome=ps.nome; render(); const c=$("#lcode"), n=$("#lnome"); if(c) c.value=ps.code; if(n) n.value=ps.nome; liveJoin(); } return; }
    if(act==="live-create"){ liveCreate(); return; }
    if(act==="start"){
      if(H.mode==="grupo"){ H.players=H.players.map((p,i)=>p.trim()||("Jogador "+(i+1))); savePlayers(); if(H.per*H.players.length>poolSize()){ H.hint="Perguntas demais para tantos jogadores. Escolha menos perguntas por jogador."; render(); return; } }
      else { H.nome=AUTH.user?((AUTH.profile||{}).nome||H.nome):(($("#nome")||{}).value||"").trim(); if(!H.nome){ H.hint="Digite seu nome para aparecer no ranking."; render(); const n=$("#nome"); if(n) n.focus(); return; } store("agrix-nome",H.nome);
        if(H.mode==="revanche"&&!erradasPool().length){ H.hint="Você não tem perguntas erradas nestes módulos. Jogue o Show ou o Treino primeiro."; render(); return; } }
      H.hint=""; newGame(); return;
    }
    return;
  }
  if(act==="live-close"||act==="live-leave"){ if(LIVE.role==="host"&&LIVE.fase!=="fim") confirmBox("Encerrar a sala?","Os celulares serão desconectados e o jogo termina.","Sim, encerrar","Continuar",()=>liveClose()); else liveClose(); return; }
  if(act==="live-start"||act==="live-next"){ liveNext(); return; }

  if(act==="gorev"){ H.mode="revanche"; store("agrix-mode","revanche"); newGame(); return; }
  if(act==="cert"){ certificate(); return; }
  if(S.screen!=="jogo"||!G) return;
  const q=G.q;

      setTimeout(()=>document.querySelectorAll(".pcard").forEach(x=>x.classList.add("open")),700);

      const msg=v===0?"Você tirou o Rei: nenhuma alternativa foi eliminada.":"Você tirou "+names[v]+": "+v+" alternativa"+(v>1?"s erradas eliminadas":" errada eliminada")+".";
      $("#card-msg").textContent=msg; say(v===0?"Ih, o Rei! Nenhuma eliminada.":"Saiu "+names[v]+"! "+v+" a menos.");
      const ok=document.createElement("button"); ok.className="btn"; ok.textContent="Voltar à pergunta"; ok.onclick=()=>{close(); render();}; $(".dialog").appendChild(ok); ok.focus();

      ()=>setTimeout(()=>{ document.querySelectorAll(".bar i").forEach((el,k)=>setTimeout(()=>el.style.height=el.dataset.h+"%", k*150)); sfx.applause(null,1,.4); },500));
    render(); return;
  }
  if(act==="univ"){
    u.univ=true; G.anyHelp=true; const opts=alive(), pOk=[0,.88,.75,.62][q.src.d];
    const who=[["Júlia","Almoxarifado","#81ceee"],["Pedro","Fiscal","#f2c14e"],["Rafa","Comercial","#7ee2a4"]];

    const items=who.map(([n,s,c],k)=>{ const others=opts.filter(i=>i!==q.c); const right=Math.random()<pOk||!others.length; const pick=right?q.c:others[rnd(others.length)]; const conf=right?sure[rnd(2)]:sure[2+rnd(2)];
      return '<li style="--d:'+(k*900)+'ms"><span class="av" style="background:'+c+'">'+n[0]+'</span><div><span>'+n+' · '+s+'</span><em class="think">pensando…</em><b class="said">'+esc(conf+lab(pick))+'.</b></div></li>'; }).join("");
    say("Vamos ouvir os universitários!");
    infoBox("Universitários", '<ul class="voices">'+items+'</ul>'); render(); return;
  }
});

  if(e.target.id==="lcode"){ e.target.value=e.target.value.replace(/\D/g,"").slice(0,4); H.code=e.target.value; }
  if(e.target.dataset&&e.target.dataset.pl!==undefined){ H.players[+e.target.dataset.pl]=e.target.value; savePlayers(); }
  if(H.hint){ H.hint=""; const h=$("#hint"); if(h){ h.textContent=""; h.className="hint"; } }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && $("#layer").innerHTML && !$(".pcard:not(:disabled)")){ close(); if(S.screen==="jogo") render(); return; }
  if(S.screen==="live-host"&&(e.key===" "||e.key==="Enter")&&!$("#layer").innerHTML&&e.target===document.body){ e.preventDefault();
    if(LIVE.fase==="lobby"&&livePlayers().length) liveNext(); else if(LIVE.fase==="pergunta") liveReveal(); else if(LIVE.fase==="revelar") liveScoreboard(); else if(LIVE.fase==="placar") liveNext(); }
});
$("#btn-painel").onclick=()=>{ sfx.click(); if(S.screen==="jogo"&&G) confirmBox("Abrir o painel?","A partida atual será encerrada.","Sim, abrir","Continuar jogando",()=>{ stopTimer(); musicStop(); G=null; loadPanel(); }); else if(LIVE.role) confirmBox("Abrir o painel?","A sala ao vivo será encerrada.","Sim, abrir","Continuar",()=>liveClose().then(loadPanel)); else loadPanel(); };
window.addEventListener("resize", ()=>{ const c=$("#fx"); if(c&&!FX.raf){ c.width=innerWidth; c.height=innerHeight; } });

render();
})();
</script>
</body>
</html>
