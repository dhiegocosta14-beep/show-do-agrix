 {d:3,m:"Compras",t:"mc",p:"No Pedido de Compra, quando a coluna Quantidade Entregue é atualizada?",o:["Conforme as notas fiscais de compra vão sendo lançadas","Quando o pedido é aprovado","Quando o pedido é salvo","Só no fim do mês"],e:"Quantidade Entregue acompanha o saldo do pedido e muda a cada nota fiscal."},
 {d:3,m:"Compras",t:"mc",p:"No Importador XML, o que faz o botão Replicar Depósito?",o:["Copia o depósito e as informações para todos os itens da aba Itens Xml","Cria um novo depósito","Transfere o estoque entre depósitos","Duplica a nota fiscal"],e:"Assim não é preciso escolher o depósito item por item."},
 {d:3,m:"Compras",t:"mc",p:"No Monitor NotaFiscal Compra, o que mostra o botão Ver eventos?",o:["O histórico da NF-e: cartas de correção, cancelamentos, protocolo e downloads do XML","As parcelas a pagar da nota","Os fornecedores que receberam cotação","Os itens da nota no estoque"],e:"Ver eventos lista as ocorrências ligadas àquela NF-e."},

 // ---- Vendas (ampliação) ----
 {d:1,m:"Vendas",t:"mc",p:"Qual tela registra a intenção ou compromisso de venda antes do faturamento?",o:["Pedido de Venda","Nota Fiscal de Venda","Faturamento Recorrente","Tabela de Preço de Vendas"],e:"O Pedido de Venda formaliza o compromisso comercial antes da Nota Fiscal."},
 {d:1,m:"Vendas",t:"mc",p:"Quem costuma usar a tela Aprovação de Pedido de Venda?",o:["Gestores, gerentes comerciais ou supervisores","Motoristas","Fornecedores","Os próprios clientes"],e:"É o painel onde quem tem alçada libera os pedidos antes do faturamento ou da expedição."},
 {d:1,m:"Vendas",t:"vf",p:"No Pedido de Venda, um usuário com aprovador autorizado pode aprovar o pedido sem abrir a tela Aprovação de Pedido de Venda.",a:true,e:"O manual traz essa observação no Pedido de Venda."},
 {d:1,m:"Vendas",t:"mc",p:"Quais status controlam o ciclo da Nota Fiscal de Venda?",o:["Aberto, Autorizado e Cancelado","Novo, Pago e Arquivado","Rascunho, Enviado e Lido","Pendente, Bloqueado e Liberado"],e:"O campo Status / Status Emissão controla o ciclo da nota."},
 {d:1,m:"Vendas",t:"mc",p:"Para que serve a Tabela de Preço de Vendas?",o:["Criar valores fixos de cobrança para um cliente ou parceiro","Registrar o pedido do cliente","Emitir a nota fiscal","Acompanhar cobranças mensais"],e:"Geralmente é usada quando um parceiro paga um valor diferente dos demais clientes."},
 {d:2,m:"Vendas",t:"mc",p:"No Pedido de Venda, para que serve a Condição de Recebimento?",o:["Calcular automaticamente as datas de vencimento das parcelas","Definir se o pagamento é Pix ou boleto","Escolher o vendedor","Aplicar desconto no pedido"],e:"Pode ser dia fixo ou soma a partir da emissão, e vem do cadastro do cliente quando configurada."},
 {d:2,m:"Vendas",t:"mc",p:"No Pedido de Venda, se o cliente tem tabela de preço configurada, quais itens aparecem no Cód. Item?",o:["Só os itens da tabela de preço","Todos os itens do sistema","Só os itens com estoque","Só os itens do tipo Serviço"],e:"Com tabela configurada, só os itens dela ficam disponíveis, e o Valor Unitário vem automático."},
 {d:2,m:"Vendas",t:"mc",p:"O que é o campo P.C. Cliente no Pedido de Venda?",o:["O número do Pedido de Compra do cliente (PO), para constar na NF-e","O preço de custo do cliente","O prazo combinado com o cliente","O código postal do cliente"],e:"P.C. Cliente é o número de ordem de compra fornecido pelo comprador."},
 {d:2,m:"Vendas",t:"mc",p:"Na venda de um serviço, qual depósito deve ser informado?",o:["Um depósito de envio direto, que “não controla estoque”","O depósito principal da filial","Qualquer depósito com saldo","Nenhum, o campo fica vazio"],e:"Venda de serviço não baixa estoque, por isso usa depósito que não controla estoque."},
 {d:2,m:"Vendas",t:"mc",p:"Na Nota Fiscal de Venda, o que é a coluna Qtd. Rest?",o:["O saldo restante quando a quantidade entregue é diferente da do pedido","A quantidade devolvida pelo cliente","O estoque que sobra no depósito","A quantidade de parcelas restantes"],e:"Qtd. Rest é automática e mostra o que ainda falta entregar do pedido."},
 {d:2,m:"Vendas",t:"mc",p:"Quais filtros são usados para carregar a Tabela de Preço de Vendas?",o:["Data, Tipo (Produto, Serviço ou Todos) e Grupo Item","Cliente, Vendedor e Filial","Safra, Cultura e Variedade","Moeda, Cotação e Parcelas"],e:"Depois de preencher o cabeçalho, clica-se em “Carregar” para preencher a grid."},
 {d:2,m:"Vendas",t:"mc",p:"Na Aprovação de Pedido de Venda, o que acontece com o status ao clicar em Aprovar?",o:["Passa de Aberto/Pendente para Aprovado","Passa de Aprovado para Faturado","Passa de Aberto para Cancelado","Não muda até emitir a nota"],e:"O botão Aprovar efetiva a liberação dos pedidos selecionados."},
 {d:3,m:"Vendas",t:"mc",p:"No rodapé do Pedido de Venda, o que é o Valor Final do Pedido?",o:["O Valor Total já com os descontos aplicados","O Valor Total antes dos descontos","Só o valor dos impostos","O valor da primeira parcela"],e:"Valor Total é a soma bruta; Valor Final é esse total menos os descontos em % ou em R$."},
 {d:3,m:"Vendas",t:"vf",p:"Na Nota Fiscal de Venda, só é possível autorizar e encerrar a nota se o usuário tiver um aprovador autorizado.",a:true,e:"Essa observação aparece no fim da seção da Nota Fiscal de Venda."},
 {d:3,m:"Vendas",t:"mc",p:"Na Tabela de Preço de Vendas, qual cuidado o manual pede com os campos Tipo e Grupo de Item?",o:["Os dois devem ter o mesmo objetivo para as informações carregarem","O Tipo deve ficar sempre em “Todos”","O Grupo de Item deve ficar em branco","Os dois só valem para serviços"],e:"Se Tipo e Grupo de Item não combinam, a grid não carrega as informações."},
 {d:3,m:"Vendas",t:"mc",p:"No Faturamento Recorrente, o que acontece ao deixar o campo Cliente em branco?",o:["A tela monitora todos os clientes","A tela não carrega nada","O sistema usa o último cliente","As notas são emitidas sem cliente"],e:"Com o cliente em branco, a recorrência é acompanhada para todos."},
 {d:3,m:"Vendas",t:"mc",p:"No Faturamento Recorrente, para que servem as Opções de Câmbio?",o:["Definir a regra de atualização monetária para contratos em moeda estrangeira","Trocar a moeda do sistema","Converter a nota para dólar","Escolher o banco do boleto"],e:"As opções são Moeda P.V., Moeda Sistema (BRL), Cot. Hoje e Cot. Digit."},
 {d:3,m:"Vendas",t:"mc",p:"Qual é o reflexo da Nota Fiscal de Venda na Contabilidade?",o:["Lançamento contábil automático, quando a base e os parâmetros estão configurados","Nenhum, a contabilidade é sempre manual","Gera um novo plano de contas","Bloqueia o período contábil"],e:"O lançamento é automático desde que os parâmetros necessários estejam configurados."},
 // ---- Pecuária (Guia de Processos AgriX) ----
 {d:1,m:"Pecuária",t:"mc",scr:"Contrato de Comissão",p:"Qual tela formaliza os acordos de repasse de comissão para corretores e parceiros na compra de boi?",o:["Contrato de Comissão","Negociação de Compra Animal","GTA Compra","Contrato de Venda Animal"],e:"O Contrato de Comissão (Pecuária > Contratos) projeta os repasses de comissão aos corretores e parceiros na negociação de compra de boi. Quem faz é o escritório."},
 {d:2,m:"Pecuária",t:"vf",scr:"Contrato de Comissão",p:"O Contrato de Comissão já pode ser usado na Oportunidade de Compra assim que é salvo, mesmo sem aprovação.",a:false,e:"O Contrato de Comissão só fica disponível para a Oportunidade de Compra depois de aprovado. O último passo é “Salvar e aprovar”."},
 {d:2,m:"Pecuária",t:"mc",scr:"Contrato de Comissão",p:"No Contrato de Comissão, qual tipo de contrato é informado na compra de animais?",o:["Compra de Bois","Venda Animal","Boitel","Transferência de Gado"],e:"O passo 3 é informar o tipo de contrato: Compra de Bois. Antes disso vêm filial, rota, pagamento, corretor e data de vigência."},
 {d:2,m:"Pecuária",t:"mc",scr:"Contrato de Comissão",p:"O que é informado na aba Geral do Contrato de Comissão?",o:["Raça, categoria, quantidade e valores (alvo) para o corretor","Placa do caminhão e número da GTA","Peso bruto, tara e peso líquido","Curral e lote de destino"],e:"Na aba Geral entram raça, categoria, quantidade e os valores alvo para o corretor. Depois é só salvar e aprovar."},
 {d:1,m:"Pecuária",t:"mc",p:"Quem faz o Contrato de Comissão, a Oportunidade de Compra e a Negociação de Compra Animal?",o:["Escritório","Fazenda","Corretor, pelo aplicativo","Motorista do caminhão"],e:"As etapas comerciais da compra são feitas pelo escritório. A fazenda e o corretor entram no Mapa de Pesagem, e a fazenda cuida da recepção e do manejo."},
 {d:1,m:"Pecuária",t:"mc",scr:"Registro de Oportunidade de Compra de Animal",p:"Qual é o objetivo do Registro de Oportunidade de Compra?",o:["Formalizar a intenção de compra antes de ela se concretizar, com as condições comerciais e logísticas","Registrar a chegada física dos animais ao confinamento","Gerar a Ordem de Compra no SAP","Dar baixa nos animais mortos"],e:"A Oportunidade de Compra registra a intenção de compra antes de ela se concretizar, reunindo condições comerciais e logísticas. Fica em Pecuária > Contratos."},
 {d:2,m:"Pecuária",t:"mc",scr:"Registro de Oportunidade de Compra de Animal",p:"Qual contrato é vinculado no Registro de Oportunidade de Compra?",o:["Contrato de Comissão","Contrato de Venda Animal","Contrato Boitel","Nenhum, o vínculo é opcional"],e:"O passo 3 da Oportunidade é vincular o Contrato de Comissão, depois de preencher filial, rota, pagamento, corretor e data da negociação."},
 {d:3,m:"Pecuária",t:"vf",scr:"Registro de Oportunidade de Compra de Animal",p:"Na Oportunidade de Compra, o Contrato de Comissão só é liberado depois de informar o corretor e as datas.",a:true,e:"O guia destaca: o Contrato de Comissão só libera após corretor e datas. Por isso a ordem dos passos importa."},
 {d:2,m:"Pecuária",t:"mc",scr:"Registro de Oportunidade de Compra de Animal",p:"A qual rebanho a Oportunidade de Compra deve ser vinculada?",o:["Rebanho – Comercial","Rebanho – Reprodução","Rebanho – Maternidade","Rebanho – Boitel"],e:"O ponto de atenção do guia é vincular a Oportunidade ao Rebanho – Comercial."},
 {d:2,m:"Pecuária",t:"mc",scr:"Registro de Oportunidade de Compra de Animal",p:"O que é preenchido na aba Itens da Oportunidade de Compra?",o:["Raça, quantidade e valores","GTA, curral e lote","Score de 1 a 5 por curral","Vacinas e protocolo sanitário"],e:"Na aba Itens entram raça, quantidade e valores. Depois é salvar e aprovar."},
 {d:1,m:"Pecuária",t:"mc",scr:"Mapa de Pesagem",p:"O Mapa de Pesagem fica vinculado a qual registro?",o:["Oportunidade de Compra","Contrato de Venda Animal","Lote de Recepção","Score de Fezes"],e:"A pesagem é vinculada à Oportunidade de Compra. O Mapa de Pesagem é feito no aplicativo mobile pela fazenda ou pelo corretor."},
 {d:2,m:"Pecuária",t:"vf",scr:"Mapa de Pesagem",p:"Ao final do Mapa de Pesagem é possível salvar e gerar um PDF.",a:true,e:"Os passos são: informações gerais e oportunidade, dados da pesagem e do embarque, lançamentos de pesagem, pesos e valores, e por fim salvar e gerar PDF."},
 {d:1,m:"Pecuária",t:"mc",scr:"Mapa de Pesagem",p:"Quem faz o Mapa de Pesagem?",o:["Fazenda/Corretor","Escritório","Diretoria","Transportadora"],e:"O Mapa de Pesagem é registrado no aplicativo mobile pela fazenda ou pelo corretor, acompanhando a pesagem até a consolidação dos pesos."},
 {d:2,m:"Pecuária",t:"mc",scr:"Negociação de Compra Animal",p:"Qual é a etapa mais completa da compra, que reúne em abas os dados comerciais, financeiros, logísticos e documentais?",o:["Negociação de Compra Animal","Registro de Oportunidade de Compra","Contrato de Comissão","GTA Compra"],e:"A Negociação de Compra Animal (Pecuária > Contratos) é a etapa mais completa: oportunidade e fornecedor, filial de destino e financeiro, transportadoras e comissionado, criação de lotes e relação de GTA."},
 {d:3,m:"Pecuária",t:"mc",scr:"Negociação de Compra Animal",p:"O que acontece depois que a Negociação de Compra Animal é aprovada no AgriX?",o:["O sistema gera uma OC (Ordem de Compra) no SAP","O sistema emite a GTA automaticamente","Os animais entram no Lote Finalidade","O Contrato de Venda é criado"],e:"Após a aprovação no AgriX, o sistema gera uma OC no SAP, que segue a alçada de aprovação no SAP."},
 {d:3,m:"Pecuária",t:"mc",scr:"Negociação de Compra Animal",p:"Na aba Criação de Lotes da Negociação de Compra, o que o sistema traz do lote escolhido?",o:["A Descrição e o GMD do lote","O peso bruto e a tara","O score de fezes do lote","A cotação PTAX do dia"],e:"Ao escolher o lote na aba Criação de Lotes, o sistema traz a Descrição e o GMD (ganho médio diário) do lote."},
 {d:3,m:"Pecuária",t:"mc",scr:"Negociação de Compra Animal",p:"Na Negociação de Compra Animal, quais dados são preenchidos depois de conferir a oportunidade e o fornecedor?",o:["Filial de destino, financeiro, transportadoras e comissionado","Score de fezes e leitura de cocho","Protocolo sanitário e vacinas","Cotação da moeda e formato decimal"],e:"A sequência é: conferir oportunidade e fornecedor; filial de destino e financeiro; transportadoras e comissionado; criação de lotes; relação de GTA e resumo."},
 {d:2,m:"Pecuária",t:"vf",scr:"Lote de Recepção",p:"O Lote de Recepção precisa existir antes da Negociação de Compra.",a:true,e:"O Lote de Recepção é o lote pecuário que vai receber os animais comprados. Ele precisa existir antes, porque é vinculado na Negociação de Compra."},
 {d:1,m:"Pecuária",t:"mc",scr:"Lote de Recepção",p:"Qual é o campo principal preenchido no cadastro do Lote de Recepção?",o:["A Descrição do lote","O número da GTA","O peso líquido","O nome do corretor"],e:"Em Pecuária > Cadastros Básicos > Lote de Recepção, preenche-se a Descrição do lote, salva-se e depois ele é vinculado na Negociação de Compra."},
 {d:1,m:"Pecuária",t:"mc",scr:"GTA Compra",p:"O que é a GTA?",o:["Guia de Trânsito Animal, documento obrigatório que formaliza o transporte dos animais","Guia Tributária Agropecuária","Gestão do Trato Animal","Grupo de Tratamento Alimentar"],e:"GTA é a Guia de Trânsito Animal, documento obrigatório para o transporte dos animais adquiridos. Fica em Pecuária > Cadastros Básicos > GTA Compra."},
 {d:2,m:"Pecuária",t:"mc",scr:"GTA Compra",p:"Qual informação a GTA de Compra traz e que se mantém até o contrato de venda?",o:["A categoria do animal","O peso de cada animal","O valor da comissão","O curral de destino"],e:"O sistema traz a categoria do animal na GTA, e essa categoria se mantém consistente até o Contrato de Venda."},
 {d:2,m:"Pecuária",t:"mc",scr:"GTA Compra",p:"O que precisa estar salvo antes de cadastrar a GTA de Compra?",o:["A Oportunidade de Compra","O Contrato de Venda Animal","O Manejo de Saída","O Score de Fezes"],e:"O primeiro passo da GTA de Compra é salvar a Oportunidade de Compra. Depois cadastra-se a GTA, e o sistema traz a categoria do animal."},
 {d:1,m:"Pecuária",t:"mc",scr:"Desembarque de Animais",p:"O Desembarque de Animais confirma a chegada física dos animais vinculando-a a qual documento?",o:["GTA de Compra","Contrato de Venda Animal","Nota fiscal de venda","Mapa de Pesagem"],e:"O Desembarque (no aplicativo mobile) confirma a chegada ao confinamento, vinculado à GTA de Compra, com curral e lote."},
 {d:2,m:"Pecuária",t:"mc",scr:"Desembarque de Animais",p:"Quais quantidades são informadas no Desembarque de Animais?",o:["Vivos, mortos e faltantes","Machos, fêmeas e bezerros","Vacinados e não vacinados","Brinco, chip e SISBOV"],e:"No Desembarque informam-se as quantidades de vivos, mortos e faltantes, além da condição dos animais, sinistros e colaboradores."},
 {d:2,m:"Pecuária",t:"vf",scr:"Desembarque de Animais",p:"O Desembarque de Animais ajuda a controlar as perdas logo na chegada ao confinamento.",a:true,e:"Esse é o ponto de atenção do guia: o Desembarque controla perdas logo na chegada, registrando mortos, faltantes e sinistros."},
 {d:2,m:"Pecuária",t:"mc",scr:"Entrada de Gado Individual",p:"Na Entrada de Gado Individual, quais formas de identificação do animal podem ser usadas?",o:["Brinco, Chip ou SISBOV","Somente brinco","Somente o nome do animal","A placa do caminhão"],e:"A identificação pode ser por Brinco, Chip ou SISBOV. Os passos incluem dados gerais, lotes pré-selecionados, insumos veterinários e inserir os animais individualmente."},
 {d:1,m:"Pecuária",t:"mc",scr:"Recepção Caminhão Balança",p:"Como é calculado o peso líquido na Recepção Caminhão Balança?",o:["Peso bruto − tara","Peso bruto + tara","Tara − peso bruto","Peso bruto ÷ quantidade de animais"],e:"Peso líquido = peso bruto − tara. A pesagem é registrada com transporte, nota fiscal e GTA."},
 {d:3,m:"Pecuária",t:"mc",scr:"Recepção Caminhão Balança",p:"Em qual sistema a Recepção Caminhão Balança é feita primeiro?",o:["No GATEC, e depois replicada manualmente no AgriX","No SAP, com integração automática","Somente no aplicativo mobile","Em planilha, importada depois"],e:"O processo deve ser feito no sistema GATEC. Após a conclusão no GATEC, ele é replicado manualmente no AgriX (Pecuária > Apontamentos > Recepção Caminhão Balança)."},
 {d:1,m:"Pecuária",t:"mc",scr:"Recepção Caminhão Balança",p:"Qual é o primeiro passo na tela Recepção Caminhão Balança?",o:["Clicar em Modo Inserir","Preencher a relação de GTA","Pesar a tara","Aprovar o contrato"],e:"Primeiro clica-se em Modo Inserir. Depois: tipo de recepção, fazenda e status; transporte, nota fiscal, km e horários; pesagem; relação GTA e salvar."},
 {d:2,m:"Pecuária",t:"mc",scr:"Manejo Individual de Animais em Lote",p:"Além de registrar a identificação SISBOV, qual movimentação o Manejo Individual de Animais em Lote faz?",o:["Do Lote Recepção para o Lote Finalidade","Do Lote Finalidade para o Lote Recepção","Do confinamento para o frigorífico","Do curral para a maternidade"],e:"O Manejo Individual registra a identificação SISBOV dos animais e faz a movimentação do Lote Recepção para o Lote Finalidade."},
 {d:1,m:"Pecuária",t:"mc",scr:"Vacinação Individual",p:"Onde a Vacinação Individual está disponível?",o:["No aplicativo mobile e na Web","Somente na Web","Somente no SAP","Somente no GATEC"],e:"A Vacinação Individual está disponível no aplicativo mobile e na Web."},
 {d:2,m:"Pecuária",t:"mc",scr:"Vacinação Individual",p:"Na Vacinação Individual, além dos animais e dos insumos veterinários, o que é registrado?",o:["Protocolo sanitário, colaboradores e horários","Peso bruto e tara","Valor da comissão do corretor","Cotação do dólar"],e:"Os passos são: dados gerais, insumos veterinários, animais e protocolo sanitário, colaboradores e horários, e salvar o registro."},
 {d:1,m:"Pecuária",t:"mc",scr:"Registro de Nascimento",p:"Para que serve o Registro de Nascimento?",o:["Lançar os animais nascidos na propriedade, incluindo-os no rebanho e no lote","Registrar a compra de bezerros","Cadastrar uma nova raça","Dar baixa em animais mortos"],e:"O Registro de Nascimento lança os animais nascidos na propriedade e os inclui no rebanho e no lote."},
 {d:1,m:"Pecuária",t:"mc",scr:"Score de Fezes",p:"O que o Score de Fezes avalia?",o:["A consistência das fezes por curral, um indicador da saúde digestiva do lote","A quantidade de ração no cocho","A qualidade da água do bebedouro","O peso médio do lote"],e:"O Score de Fezes avalia a consistência das fezes por curral, indicando a saúde digestiva do lote."},
 {d:2,m:"Pecuária",t:"mc",scr:"Score de Fezes",p:"Qual escala é usada para classificar as amostras no Score de Fezes?",o:["Score 1 a 5","Nota 0 a 10","Baixo, médio e alto","A, B e C"],e:"As amostras são classificadas de Score 1 a 5, e o aplicativo mostra o escore predominante do curral."},
 {d:2,m:"Pecuária",t:"mc",scr:"Limpeza de Bebedouro",p:"Quais status de curral aparecem na Limpeza de Bebedouro?",o:["Limpo, Limpar Hoje, Atrasado ou Pendente","Aberto, Encerrado ou Cancelado","Liberado ou Bloqueado","Vivo, Morto ou Faltante"],e:"Os currais aparecem como Limpo, Limpar Hoje, Atrasado ou Pendente, e o usuário marca os que foram limpos."},
 {d:1,m:"Pecuária",t:"vf",scr:"Limpeza de Bebedouro",p:"A Limpeza de Bebedouro registra a limpeza dos bebedouros de cada curral para controlar a qualidade da água.",a:true,e:"Esse é o objetivo da tela: registrar a limpeza por curral, com insumos e equipamentos usados, controlando a qualidade da água."},
 {d:2,m:"Pecuária",t:"mc",scr:"Registro de Morte Animal",p:"Quais são os modos do Registro de Morte Animal?",o:["Manual ou Scanner","Web ou SAP","Individual ou Lote Recepção","Rápido ou Completo"],e:"O Registro de Morte Animal pode ser feito no modo Manual (por listas) ou Scanner (leitura direta), informando motivo e destino."},
 {d:3,m:"Pecuária",t:"vf",scr:"Registro de Morte Animal",p:"No Registro de Morte Animal, ao alternar entre os modos Manual e Scanner, os dados já preenchidos são mantidos.",a:false,e:"Atenção: os dados são limpos ao alternar os modos. Escolha o modo antes de começar a preencher."},
 {d:2,m:"Pecuária",t:"vf",scr:"Registro de Morte Animal",p:"No Registro de Morte Animal, anexar um comprovante é obrigatório.",a:false,e:"Anexar o comprovante (pela câmera ou galeria) é opcional. Motivo e destino da morte são as informações principais."},
 {d:1,m:"Pecuária",t:"mc",scr:"Leitura de Cocho",p:"O que a Leitura de Cocho avalia?",o:["O consumo de ração em cada curral, para ajustar o trato","A limpeza do bebedouro","A consistência das fezes","O peso dos animais na balança"],e:"A Leitura de Cocho avalia diariamente o consumo de ração em cada curral para ajustar o trato. Informa-se apontamento, turno, curral e a leitura."},
 {d:2,m:"Pecuária",t:"mc",scr:"Consulta e Habilitação de Lotes para Vendas",p:"Qual é o primeiro passo da venda de animais?",o:["Consulta e Habilitação de Lotes para Vendas","Manejo de Saída (Embarque)","Contrato de Venda Animal","Emissão da GTA de venda"],e:"A venda começa na Consulta e Habilitação de Lotes (Pecuária > Apontamentos), que localiza os lotes aptos e os habilita para o Contrato de Venda."},
 {d:2,m:"Pecuária",t:"mc",scr:"Consulta e Habilitação de Lotes para Vendas",p:"Na Consulta e Habilitação de Lotes, o que deve ser marcado para o lote poder entrar no Contrato de Venda?",o:["Libera","Bloqueia","Encerrado","Aprovado SAP"],e:"Depois de carregar os lotes, marca-se “Libera” e salva. Só lotes habilitados entram no Contrato de Venda."},
 {d:2,m:"Pecuária",t:"vf",scr:"Consulta e Habilitação de Lotes para Vendas",p:"Qualquer lote pode entrar no Contrato de Venda, mesmo sem ser habilitado.",a:false,e:"Só lotes habilitados na Consulta e Habilitação de Lotes para Vendas entram no Contrato de Venda."},
 {d:2,m:"Pecuária",t:"mc",scr:"Contrato de Venda Animal",p:"Em qual aba do Contrato de Venda Animal os lotes são vinculados?",o:["Aba Lote","Aba Geral","Aba Anexos","Aba Validações"],e:"Na aba Geral entram valores e quantidades; na aba Lote os lotes são vinculados. Depois vêm validações, categoria e anexos."},
 {d:2,m:"Pecuária",t:"vf",scr:"Contrato de Venda Animal",p:"O Contrato de Venda deve ser salvo antes do embarque.",a:true,e:"O Contrato de Venda é a base do embarque. Ele precisa estar salvo antes do Manejo de Saída."},
 {d:2,m:"Pecuária",t:"mc",scr:"Manejo de Saída (Embarque)",p:"No Manejo de Saída (Embarque), cada animal lido é vinculado a quê?",o:["Ao contrato, ao caminhão e à GTA","Ao corretor e à comissão","Ao lote de recepção e ao curral","Ao protocolo sanitário"],e:"No embarque, cada animal é lido e vinculado ao Contrato de Venda, ao caminhão e à GTA."},
 {d:3,m:"Pecuária",t:"mc",scr:"Manejo de Saída (Embarque)",p:"Como os animais devem ser inseridos no Manejo de Saída?",o:["Individualmente, lendo o chip ou o brinco de cada animal antes de salvar","Pela quantidade total do lote","Importando uma planilha","Pelo peso médio do caminhão"],e:"O guia orienta inserir cada animal individualmente (chip ou brinco) antes de salvar o registro."},
 {d:3,m:"Pecuária",t:"mc",p:"Qual é a ordem das etapas do processo pecuário no guia?",o:["Compra → Recepção → Manejo → Venda","Recepção → Compra → Venda → Manejo","Manejo → Compra → Recepção → Venda","Compra → Venda → Recepção → Manejo"],e:"O guia segue o fluxo Compra, Recepção, Manejo (com Nutrição) e Venda, além dos temas de Gestão."},
 {d:3,m:"Pecuária",t:"mc",p:"Na sequência numerada do guia, qual é a ordem das primeiras etapas da compra?",o:["Contrato de Comissão → Oportunidade de Compra → Mapa de Pesagem → Negociação de Compra","Negociação de Compra → Contrato de Comissão → Oportunidade → Mapa de Pesagem","Mapa de Pesagem → Negociação → Oportunidade → Contrato de Comissão","Oportunidade → Negociação → Contrato de Comissão → Mapa de Pesagem"],e:"A compra começa no Contrato de Comissão (1), segue para a Oportunidade de Compra (2), o Mapa de Pesagem (3) e a Negociação de Compra Animal (4)."},
 // ---- Cadastros Básicos (Agrícola) ----
 {d:1,m:"Cadastros",t:"mc",p:"Qual é o endereço para acessar a Plataforma AgriX no computador?",o:["https://app.agrix.com.br/","https://agrix.com.br/login","https://portal.agrix.app/","https://www.agrix.net/"],e:"No desktop, acessa-se https://app.agrix.com.br/ e informa-se Licença, Login e Senha."},
 {d:1,m:"Cadastros",t:"mc",p:"Quais informações são pedidas para entrar na Plataforma AgriX?",o:["Licença, Login e Senha","Apenas o e-mail","CPF e senha","Código da fazenda e PIN"],e:"O acesso pede Licença, Login e Senha. Não compartilhe esses dados com outras pessoas."},
 {d:1,m:"Cadastros",t:"mc",p:"Como devem ser registradas as descrições dos cadastros, segundo as boas práticas?",o:["Com letras maiúsculas, sem caracteres especiais","Com letras minúsculas e acentos","Do jeito que cada usuário preferir","Somente com números"],e:"A boa prática é registrar as descrições em maiúsculas, sem caracteres especiais. A exceção é a Unidade de Medida, que segue a necessidade."},
 {d:2,m:"Cadastros",t:"vf",p:"A regra de usar maiúsculas sem caracteres especiais vale para todos os cadastros, inclusive Unidade de Medida.",a:false,e:"A Unidade de Medida é a exceção: nela, use conforme a necessidade (por exemplo, abreviações como kg ou L)."},
 {d:2,m:"Cadastros",t:"vf",p:"Depois que um cadastro foi validado, é recomendado evitar ajustes nas descrições e nos códigos editáveis.",a:true,e:"Alterar descrições ou códigos depois de validados pode comprometer as informações que dependem do cadastro principal."},
 {d:1,m:"Cadastros",t:"mc",p:"Por que é importante sair da plataforma sempre pelo botão “Sair”?",o:["Para que o ambiente não fique bloqueado","Para salvar os cadastros automaticamente","Para gerar um backup","Para limpar o cache do navegador"],e:"Desconectar pelo botão Sair evita que o ambiente fique bloqueado."},
 {d:2,m:"Cadastros",t:"mc",p:"Como é recomendado montar o código no cadastro de Equipamentos?",o:["Letras conforme o tipo (equipamento, veículo, maquinário) seguidas de número de 001 a 999","Somente números sequenciais","A placa do veículo","O nome do operador"],e:"A regra de negócio recomenda iniciar o código com as letras do tipo de equipamento, veículo ou maquinário, numerando de 001 a 999."},
 {d:1,m:"Cadastros",t:"mc",scr:"Usuários Autorizados",p:"Em qual tela são montados os grupos de aprovação dos processos de Compra, Venda e Apontamentos Agrícolas?",o:["Usuários Autorizados","Funções","Parâmetros do Usuário","Moedas"],e:"Em Configurações > Usuários Autorizados vinculam-se os usuários e montam-se os grupos de aprovação dos processos."},
 {d:1,m:"Cadastros",t:"mc",scr:"Funções",p:"Qual tela define os acessos ao Menu Principal e às funcionalidades de cada usuário?",o:["Funções","Usuários Autorizados","Aprovador Autorizado","Parâmetros de Integração"],e:"Em Configurações > Funções define-se o que cada função pode ver, criar e atualizar no menu."},
 {d:1,m:"Cadastros",t:"mc",scr:"Parâmetros do Usuário",p:"O que é configurado em Parâmetros do Usuário?",o:["Idioma e formato decimal","ERP e aplicativo fiscal","Moedas de compra e venda","Grupos de aprovação"],e:"Parâmetros do Usuário guarda o idioma e a forma decimal (por exemplo, Brasil 9.999,99)."},
 {d:2,m:"Cadastros",t:"mc",scr:"Parâmetros de Integração",p:"Para que serve a tela Parâmetros de Integração?",o:["Vincular o ERP e o aplicativo Fiscal/Contábil","Definir o idioma do usuário","Cadastrar as balanças","Cadastrar as moedas"],e:"Em Configurações > Parâmetros de Integração vincula-se o ERP e o aplicativo Fiscal/Contábil."},
 {d:2,m:"Cadastros",t:"mc",scr:"Aprovador Autorizado",p:"No Aprovador Autorizado, o que é informado depois do nome da Classe de Aprovação?",o:["Os apontamentos e os usuários aprovadores (grupo de usuários)","A cotação da moeda","O idioma do usuário","O depósito de cada fazenda"],e:"Passos: Adicionar, informar o nome da Classe de Aprovação, inserir os apontamentos e os usuários aprovadores, e salvar. Vale para pedidos, contratos e apontamentos."},
 {d:2,m:"Cadastros",t:"vf",scr:"Tabela de Taxas e Índices",p:"A Tabela de Taxas e Índices é preenchida automaticamente com a PTAX do dia ao acessar o sistema; o preenchimento manual só é preciso quando não houve acesso na data desejada.",a:true,e:"O sistema preenche a cotação diária automaticamente. Manualmente, informa-se a data, a moeda e a cotação apenas quando necessário."},
 {d:1,m:"Cadastros",t:"mc",scr:"Moedas",p:"Para que serve a tela Moedas, em Configurações?",o:["Definir quais moedas serão usadas nos processos de Compra e Venda","Registrar a cotação diária","Converter notas fiscais","Definir o formato decimal"],e:"Em Moedas definem-se as moedas usadas em Compra e Venda. A cotação diária fica na Tabela de Taxas e Índices."},
 {d:1,m:"Cadastros",t:"mc",scr:"Unidade Administrativa",p:"O que é a Unidade Administrativa?",o:["A sede ou escritório regional que gerencia várias fazendas, num nível acima da fazenda","Um talhão de produção","Um depósito transitório","Um tipo de propriedade arrendada"],e:"A Unidade Administrativa consolida pedidos, almoxarifados, baixas e aplicações de várias fazendas. Fica acima do nível de fazenda."},
 {d:1,m:"Cadastros",t:"mc",scr:"Tipos de Propriedades",p:"Quais são exemplos de Tipos de Propriedades?",o:["Própria, arrendada ou parceria","Soja, milho ou algodão","Arenoso, médio ou argiloso","Aérea, mecanizada ou costal"],e:"Tipos de Propriedades: própria, arrendada, parceria etc. O Identificador é preenchido automaticamente ao salvar."},
 {d:2,m:"Cadastros",t:"vf",scr:"Fazendas",p:"No cadastro de Fazendas, o Arrendador só deve ser informado quando a área for arrendada.",a:true,e:"Informe o Arrendador apenas para área arrendada. Caso contrário, deixe em branco."},
 {d:2,m:"Cadastros",t:"mc",scr:"Fazendas",p:"Em qual aba do cadastro de Fazendas são informadas as culturas e a área destinada a cada uma?",o:["Ocupações","Proprietários","Depósitos","Representante Legal"],e:"Na aba Ocupações informam-se as culturas estabelecidas ou previstas na fazenda e a área de cada uma."},
 {d:2,m:"Cadastros",t:"mc",scr:"Fazendas",p:"Na aba Depósitos da Fazenda, o que se informa além de selecionar o depósito?",o:["Se ele é transitório e se será usado no módulo Pecuária","A cotação da moeda","O responsável técnico","A safra e a cultura"],e:"Na aba Depósitos escolhe-se o depósito usado nas baixas de estoque, se é transitório e se será usado no módulo Pecuária."},
 {d:2,m:"Cadastros",t:"mc",scr:"Proprietário",p:"No Cadastro de Proprietários, o que define se será pedido CPF ou CNPJ?",o:["O Tipo de Pessoa (Física ou Jurídica)","O município","O tipo de propriedade","A área em hectares"],e:"O Tipo de Pessoa define o documento: CPF para Pessoa Física e CNPJ para Pessoa Jurídica."},
 {d:1,m:"Cadastros",t:"mc",scr:"Setores",p:"O que é o cadastro de Setores?",o:["Um agrupamento de talhões, como Setor Sul ou Setor Norte","A divisão da empresa em departamentos","A lista de setores de compras","O cadastro de currais"],e:"Setores agrupam talhões por características. Informa-se a descrição, a área total e a fazenda."},
 {d:2,m:"Cadastros",t:"mc",scr:"Garantias e Informações Ambientais",p:"Quais informações são registradas em Garantias e Informações Ambientais?",o:["Hipoteca, penhor safra, licenças ambientais, outorgas e procurações","Cotação de moedas","Dose por cultura dos insumos","Turnos de trabalho"],e:"A tela guarda as informações ambientais e de garantia da fazenda: hipoteca, penhor safra, licenças, outorgas e controle de procurações."},
 {d:2,m:"Cadastros",t:"mc",scr:"Balanças",p:"Quais tipos de comunicação da balança o manual cita?",o:["Porta COM, Bluetooth e rede TCP/IP","Somente USB","Wi-Fi e 4G","Somente por e-mail"],e:"A integração da balança pode ser via porta COM, Bluetooth ou rede TCP/IP, conforme os dados do fabricante."},
 {d:2,m:"Cadastros",t:"vf",scr:"Balanças",p:"A comunicação da balança é configurada com apoio da equipe de suporte AgriX, seguindo o manual da balança.",a:true,e:"Os dados são inseridos conforme o manual da balança, e a comunicação é feita com apoio do suporte AgriX."},
 {d:1,m:"Cadastros",t:"mc",scr:"Cultura",p:"No cadastro de Cultura, como a cultura é classificada?",o:["Anual ou Perene","Própria ou Arrendada","Macro ou Micro","Soma ou Média"],e:"Na Cultura informa-se se é Anual ou Perene, a unidade de rendimento por hectare, espécie, família e equivalência em kg."},
 {d:2,m:"Cadastros",t:"mc",scr:"Elementos Climáticos",p:"Nos Elementos Climáticos, qual tipo de análise se usa para chuva e pluviosidade?",o:["Soma","Média","Máxima","Mínima"],e:"Para chuva (precipitação e pluviosidade) usa-se Soma. Para temperatura e umidade relativa do ar, Média."},
 {d:2,m:"Cadastros",t:"vf",scr:"Elementos Climáticos",p:"Para temperatura e umidade relativa do ar, o tipo de análise indicado é Média.",a:true,e:"Média é usada para temperatura e umidade; Soma é usada para chuva."},
 {d:1,m:"Cadastros",t:"mc",scr:"Fases da Lavoura",p:"O que é uma Fase da Lavoura no AgriX?",o:["Um agrupador de atividades, como preparo de solo, plantio, tratos culturais e colheita","Um tipo de solo","Uma classe toxicológica","Um turno de trabalho"],e:"A Fase da Lavoura agrupa atividades. As Operações Agrícolas são vinculadas às fases."},
 {d:2,m:"Cadastros",t:"mc",scr:"Fitossanidades",p:"Quais são os tipos de Fitossanidade?",o:["Praga, doenças, ervas daninhas e inimigos naturais","Herbicida, fungicida e inseticida","Aérea, terrestre e costal","Classe I a IV"],e:"Na Fitossanidade define-se o tipo (praga, doenças, ervas daninhas e inimigos naturais), a cultura e as fases do ciclo. Ex.: Ferrugem Asiática, Percevejo Marrom."},
 {d:2,m:"Cadastros",t:"mc",scr:"Grupo de Maturação",p:"O Grupo de Maturação é pré-requisito para quê?",o:["Gerar os dias médios de maturação e liberar o talhão para colheita","Calcular o frete","Emitir o receituário","Definir a cotação"],e:"O Grupo de Maturação complementa o cadastro de variedades e é pré-requisito para os dias médios de maturação e a liberação do talhão para colheita."},
 {d:3,m:"Cadastros",t:"vf",scr:"Indicadores de Avaliação de Cultura",p:"Os Indicadores de Avaliação de Cultura são usados apenas para melhoramento genético e avaliação do desenvolvimento nos estádios fenológicos.",a:true,e:"Esse cadastro é usado só para melhoramento genético de plantas e acompanhamento dos estádios fenológicos na lavoura."},
 {d:2,m:"Cadastros",t:"mc",scr:"Operações Agrícolas",p:"Quais são os tipos de Operação Agrícola?",o:["Geral, Plantio, Colheita, Replantio e Enxertia","Compra, Venda e Transferência","Soma e Média","Manual e Scanner"],e:"O Tipo da Operação Agrícola pode ser Geral, Plantio, Colheita, Replantio ou Enxertia."},
 {d:2,m:"Cadastros",t:"mc",scr:"Operações Agrícolas",p:"Ao cadastrar uma Operação Agrícola, ela é vinculada a qual cadastro?",o:["Fase da Lavoura","Tipo de Caminhão","Refeitório","Moeda"],e:"Cada Operação Agrícola é relacionada a uma Fase da Lavoura e a uma Unidade de Medida. Ela é usada em todos os apontamentos de campo e nos custos."},
 {d:3,m:"Cadastros",t:"mc",scr:"Operações Agrícolas",p:"Onde é usada a opção Colaborador Obrigatório da Operação Agrícola?",o:["Na R.T. (Recomendação Técnica)","No faturamento","Na cotação PTAX","No cadastro da balança"],e:"Marcar Colaborador Obrigatório faz o campo ser exigido na R.T. (Recomendação Técnica)."},
 {d:1,m:"Cadastros",t:"mc",scr:"Posto Meteorológico",p:"Quais dados de localização são informados no Posto Meteorológico?",o:["Altitude, latitude e longitude","CEP e município","Placa e número de eixos","Área em hectares"],e:"No Posto Meteorológico (pluviômetros e estações) informam-se descrição, altitude, latitude e longitude."},
 {d:1,m:"Cadastros",t:"mc",scr:"Responsável Técnico",p:"Quem é cadastrado em Responsável Técnico?",o:["Quem assina o Receituário Agronômico e as Recomendações Técnicas","O gestor da fazenda","O motorista do caminhão","O aprovador de compras"],e:"O Responsável Técnico assina o Receituário Agronômico e as Recomendações Técnicas. Informam-se endereço, registro profissional e CPF."},
 {d:1,m:"Cadastros",t:"mc",scr:"Safra",p:"Quais dados são informados no cadastro de Safra?",o:["Código, descrição, data inicial e data final","Cultura e variedade","Talhão e setor","Moeda e cotação"],e:"A Safra (ex.: Safra 22/23) tem código, descrição e datas inicial e final. Ela controla apontamentos, relatórios, custos e orçamento."},
 {d:2,m:"Cadastros",t:"mc",scr:"Refeitórios",p:"Como pode ser o Refeitório cadastrado?",o:["Fixo ou móvel, vinculado à fazenda","Somente fixo","Somente na sede administrativa","Vinculado a um talhão"],e:"O Refeitório pode ser fixo ou móvel (que se desloca entre lavouras) e é vinculado à fazenda. É usado no apontamento de refeições."},
 {d:2,m:"Cadastros",t:"mc",scr:"Serviço de Tarefeiros",p:"Para que serve o cadastro Serviço de Tarefeiros?",o:["Registrar atividades rotineiras feitas por tarefeiros, como capina manual e jardinagem","Contratar fretes","Cadastrar responsáveis técnicos","Registrar refeições"],e:"Nele informam-se descrição, safra, período de produção e as operações que os tarefeiros vão realizar."},
 {d:1,m:"Cadastros",t:"mc",scr:"Tipo de Aplicação",p:"Quais são exemplos de Tipos de Aplicação?",o:["Aérea, mecanizada (terrestre) e costal","Gotejamento e pivô central","Em linha e a lanço","Feromônio e luminosa"],e:"O Tipo de Aplicação identifica o manejo no apontamento de insumo: aérea, terrestre/mecanizada ou costal."},
 {d:2,m:"Cadastros",t:"mc",scr:"Tipo de Armadilha",p:"Quais medidas são informadas no Tipo de Armadilha?",o:["Espaçamento, altura ideal e área de abrangência","Peso e tara","Latitude e longitude","Dose e carência"],e:"Além da descrição e do tipo (ex.: feromônio, luminosa), informam-se espaçamento, altura ideal e área de abrangência, em metros."},
 {d:2,m:"Cadastros",t:"mc",scr:"Tipo de Caminhão",p:"Qual informação o Tipo de Caminhão pede, além da descrição?",o:["Volume máximo de carga","A placa","O motorista","O consumo de combustível"],e:"No Tipo de Caminhão (ex.: Caçamba, Bitrem 7 eixos) informa-se o volume máximo de carga e a descrição."},
 {d:2,m:"Cadastros",t:"vf",scr:"Tipo de Contrato",p:"O Tipo de Contrato serve apenas como informativo nos contratos de compra e de venda.",a:true,e:"Ele é informativo, inserido nos contratos conforme a modalidade. Se o parâmetro de subtipo estiver marcado, os subtipos também devem ser adicionados."},
 {d:2,m:"Cadastros",t:"mc",scr:"Tipo de Colheita",p:"No Tipo de Colheita, o que é vinculado além de informar se é Manual ou Mecanizado?",o:["A Operação Agrícola de colheita","O depósito","A safra","A balança"],e:"Vincula-se a Operação Agrícola de colheita, porque nem toda colheita tem esse nome. Ex.: Derriça (colheita manual do café)."},
 {d:1,m:"Cadastros",t:"mc",scr:"Tipo de Irrigação",p:"Quais são exemplos de Tipos de Irrigação?",o:["Gotejamento, pivô central, superfície e natural","Aérea e costal","Em linha e cova","Arenoso e argiloso"],e:"O Tipo de Irrigação indica como o talhão é irrigado: localizada (gotejamento), pivô central, superfície ou natural."},
 {d:1,m:"Cadastros",t:"mc",scr:"Turnos de Jornada de Trabalho",p:"Quais dados tem o Turno de Jornada de Trabalho?",o:["Descrição e horário de início e de término","Somente o nome do colaborador","Data da safra","Valor da hora"],e:"O turno (ex.: Matutino, Vespertino, Noturno) tem descrição e horários de início e término, e é usado nos apontamentos."},
 {d:2,m:"Cadastros",t:"mc",scr:"Unidade Receptora",p:"O que é vinculado na Unidade Receptora?",o:["O depósito, ligando o armazém físico ao depósito do sistema","A cultura","O talhão","O caminhão"],e:"A Unidade Receptora indica os depósitos usados na colheita, próprios ou de terceiros, vinculando o armazém físico ao depósito sistêmico."},
 {d:2,m:"Cadastros",t:"mc",scr:"Tipo de Embalagem",p:"No Tipo de Embalagem do Agrícola, o que é informado além da descrição?",o:["Capacidade (kg) e tara","Classe toxicológica","Princípio ativo","Altura ideal"],e:"Informam-se descrição (ex.: BIG BAG), capacidade em kg e a tara, se a tara da embalagem for controlada na pesagem."},
 {d:1,m:"Cadastros",t:"mc",scr:"Classe Toxicológica",p:"Qual é a cor da faixa da Classe I (Extremamente Tóxico)?",o:["Vermelha","Amarela","Azul","Verde"],e:"Classe I: vermelha. Classe II: amarela. Classe III: azul. Classe IV: verde."},
 {d:2,m:"Cadastros",t:"mc",scr:"Classe Toxicológica",p:"A Classe IV, de faixa verde, significa:",o:["Pouco Tóxico","Altamente Tóxico","Medianamente Tóxico","Extremamente Tóxico"],e:"I Extremamente Tóxico (vermelha), II Altamente Tóxico (amarela), III Medianamente Tóxico (azul), IV Pouco Tóxico (verde)."},
 {d:2,m:"Cadastros",t:"mc",scr:"Classe Toxicológica",p:"Qual classe toxicológica tem a faixa azul?",o:["Classe III – Medianamente Tóxico","Classe I – Extremamente Tóxico","Classe II – Altamente Tóxico","Classe IV – Pouco Tóxico"],e:"A faixa azul é da Classe III, Medianamente Tóxico."},
 {d:2,m:"Cadastros",t:"mc",scr:"Formulação",p:"Quais são exemplos de Formulação?",o:["SC, CE e WP","500 G/L e 450 G/L","Triazol e Estrobilurina","NPK"],e:"Formulação segue a bula (ex.: SC, CE, WP). 500 G/L é Concentração; Triazol é Grupo Químico; NPK é Grupo de Nutrientes."},
 {d:2,m:"Cadastros",t:"mc",scr:"Grupo Químico",p:"Quais são exemplos de Grupo Químico?",o:["Triazol, Estrobilurina e Organofosforado","SC, CE e WP","Glifosato e Difenoconazol","Nitrogênio e Fósforo"],e:"Grupo Químico, conforme a bula: Triazol, Estrobilurina, Organofosforado. Glifosato e Difenoconazol são Princípios Ativos."},
 {d:2,m:"Cadastros",t:"mc",scr:"Princípio Ativo",p:"Quais são exemplos de Princípio Ativo?",o:["Trifloxistrobina, Glifosato e Difenoconazol","Triazol e Estrobilurina","Líquido e Sólido","NPK"],e:"Registrar o princípio ativo dá o rastro completo do uso do insumo em campo e mostra a eficiência por princípio ativo."},
 {d:2,m:"Cadastros",t:"vf",scr:"Nutrientes",p:"No cadastro de Nutrientes é importante informar se o nutriente é Macronutriente ou Micronutriente.",a:true,e:"O Tipo do nutriente (Macro ou Micro) é informado junto da descrição. Ex.: Nitrogênio, Fósforo, Potássio."},
 {d:3,m:"Cadastros",t:"mc",cat:"caminho",scr:"Nutrientes",p:"A tela Nutrientes aparece em quais submenus de Agrícola > Cadastros Básicos?",o:["Insumos e Cadastros de Análises","Somente Insumos","Somente Cadastros de Análises","Locais de Produção e Configurações"],e:"Nutrientes aparece em Agrícola > Cadastros Básicos > Insumos e em Agrícola > Cadastros Básicos > Cadastros de Análises."},
 {d:3,m:"Cadastros",t:"mc",scr:"Insumos",p:"Para um insumo do tipo Semente, o que deve ser marcado no cadastro de Insumos?",o:["O parâmetro Semente","Efeito Residual","Imprimir no receituário","Incompatibilidade"],e:"Para insumo do tipo Semente é necessário marcar o parâmetro Semente."},
 {d:3,m:"Cadastros",t:"mc",scr:"Insumos",p:"Para defensivos, quais cadastros também precisam ser informados na tela de Insumos?",o:["Classe do Defensivo, Classe Toxicológica, Princípio Ativo e Unidade de Medida","Safra, Talhão e Setor","Moeda e Cotação","Refeitório e Turno"],e:"Para defensivos, além do item e do grupo, informam-se Classe do Defensivo, Classe Toxicológica, Princípio Ativo e Unidade de Medida, conforme a bula."},
 {d:3,m:"Cadastros",t:"mc",scr:"Insumos",p:"O que é informado na aba Dose por Cultura do cadastro de Insumos?",o:["Cultura, tipo de aplicação, fitossanidade, dose recomendada e se há efeito residual","Preço e moeda","Fornecedor e prazo","Peso e tara"],e:"Na Dose por Cultura informam-se, conforme a bula, as culturas atendidas, o tipo de aplicação, a fitossanidade, a dose e o efeito residual."},
 {d:3,m:"Cadastros",t:"vf",scr:"Insumos",p:"O campo Composição do cadastro de Insumos é preenchido para todos os tipos de insumo.",a:false,e:"A Composição só é preenchida para adubos, fertilizantes e corretivos de solo."},
 {d:2,m:"Cadastros",t:"mc",p:"Onde é aplicado o controle de Incompatibilidade de Insumos?",o:["No apontamento de Recomendação Técnica, impedindo que insumos incompatíveis sejam aplicados juntos","No pedido de compra","Na nota fiscal de entrada","No cadastro de Safra"],e:"Incompatibilidade de Insumos (Agrícola > Cadastros Básicos > Insumos) bloqueia, na Recomendação Técnica, a aplicação conjunta de insumos incompatíveis."},
 {d:1,m:"Cadastros",t:"mc",scr:"Grupo de Insumos",p:"Quais são exemplos de Grupo de Insumos?",o:["Corretivo de solo, adubos, defensivos agrícolas e sementes","Arenoso, médio e argiloso","Matutino e noturno","Própria e arrendada"],e:"O Grupo de Insumos separa os insumos usados na operação agrícola e permite relatórios consolidados de aplicação, valores e orçamento."},
 {d:2,m:"Cadastros",t:"mc",scr:"Textura de Solos",p:"Quais percentuais são informados na Textura de Solos?",o:["Argila, areia e silte","Nitrogênio, fósforo e potássio","Umidade e temperatura","Matéria orgânica e pH"],e:"Na Textura de Solos (ex.: arenoso, médio, argiloso) informam-se os percentuais de argila, areia e silte."},
 {d:2,m:"Cadastros",t:"mc",scr:"Grupo de Nutrientes",p:"Qual é o exemplo clássico de Grupo de Nutrientes?",o:["NPK","SC","Classe I","Latossolo"],e:"O Grupo de Nutrientes reúne os nutrientes de um adubo ou fertilizante, como NPK."},
 {d:1,m:"Cadastros",t:"mc",scr:"Classe de Fertilidade",p:"Quais são exemplos de Classe de Fertilidade?",o:["Alta, média e baixa","Classe I a IV","Anual e perene","Soma e média"],e:"A Classe de Fertilidade (alta, média, baixa) apoia o planejamento de safra por talhão, setor e fazenda."},
 {d:2,m:"Cadastros",t:"mc",scr:"Período de Produção",p:"O que é vinculado no Período de Produção?",o:["Safra, cultura e contabilização agrícola, além dos talhões com as variedades","Moeda e cotação","Caminhão e motorista","Somente a fazenda"],e:"O Período de Produção habilita as datas da cultura dentro da safra. Vinculam-se safra, cultura, contabilização e os talhões com suas variedades."},
 {d:3,m:"Cadastros",t:"mc",p:"Com o que o cadastro de Contabilização Agrícola relaciona os grupos de itens (EPI, uso e consumo, cantina)?",o:["Com a conta contábil correspondente no ERP","Com o depósito","Com o talhão","Com o fornecedor"],e:"A Contabilização relaciona cada grupo de itens com a conta contábil, definindo como será contabilizado no ERP, com entradas e saídas."},
 {d:2,m:"Cadastros",t:"mc",scr:"Classificação de Colheita",p:"Quando é usada a Classificação de Colheita?",o:["Quando o produto colhido é separado em tipos de itens que geram estoque, como melancia pequena e grande","Para registrar a chuva","Para cadastrar caminhões","Para definir turnos de trabalho"],e:"Na Classificação de Colheita informam-se a descrição, a variedade e os tipos de itens que serão colhidos e gerarão estoque."},
 {d:1,m:"Cadastros",t:"mc",scr:"Disposição Final de Embalagens",p:"Onde aparece o texto da Disposição Final de Embalagem?",o:["Na descrição do Insumo e na impressão do Receituário Agronômico","Na nota fiscal de venda","No pedido de compra","No relatório de chuva"],e:"A Disposição Final de Embalagem sai como texto no cadastro do insumo e no Receituário Agronômico (ex.: locais de entrega)."},
 {d:1,m:"Cadastros",t:"mc",scr:"Tipo de Despesas Agrícolas",p:"Quais são exemplos de Tipos de Despesas Agrícolas?",o:["IPVA, DPVAT, seguro privado e EPI","Adubos e sementes","Gotejamento e pivô","Matutino e noturno"],e:"São despesas administrativas que não se encaixam nas rotinas existentes, como impostos, taxas, seguros e custeio de cantina."},
 {d:2,m:"Cadastros",t:"mc",scr:"Tipo de Cultivo",p:"Quais são exemplos de Tipos de Cultivo?",o:["Plantio direto, convencional, mínimo, irrigado e sequeiro","Aérea, mecanizada e costal","Gotejamento e pivô central","Feromônio e ultravioleta"],e:"O Tipo de Cultivo indica a forma de conduzir o plantio. O Identificador é preenchido automaticamente ao salvar."},
 {d:1,m:"Cadastros",t:"mc",scr:"Tipo de Plantio",p:"Quais são exemplos de Tipos de Plantio?",o:["Em linha, a lanço e em cova","Pivô central e natural","Classe I a IV","Soma e média"],e:"O Tipo de Plantio indica como a cultura foi semeada no talhão: em linha, a lanço, cova, manual, aéreo."},
 {d:1,m:"Cadastros",t:"mc",scr:"Espaçamento",p:"Em qual unidade o Espaçamento é informado?",o:["Metros","Centímetros","Hectares","Polegadas"],e:"O Espaçamento é informado em metros (ex.: 0,45 m, 0,90 m)."},
 {d:2,m:"Cadastros",t:"mc",scr:"Ordem de Aplicação",p:"Qual é um exemplo de Ordem de Aplicação?",o:["1º Fungicida, 2º Herbicida, 1ª Colheita","Aérea e costal","Alta e baixa","SC e CE"],e:"A Ordem de Aplicação registra a sequência das aplicações de defensivos no cultivo."},
 {d:2,m:"Cadastros",t:"mc",scr:"Precauções Gerais",p:"Os cadastros Precauções Gerais e Prevenção e Primeiros Socorros são preenchidos de acordo com:",o:["A bula do insumo","O manual da balança","A tabela PTAX","O contrato de venda"],e:"Ambos seguem a bula do insumo e saem como texto no Receituário Agronômico."},
 {d:2,m:"Cadastros",t:"vf",p:"Em cadastros como Fases da Lavoura, Grupo de Maturação e Tipo de Cultivo, o Identificador é preenchido automaticamente ao salvar.",a:true,e:"Nesses cadastros basta informar a Descrição e salvar: o Identificador é gerado pelo sistema."}

const PREFIXES=["Administrativo > Estoque","Administrativo > Compras","Administrativo > Vendas","ACM > Cadastros","ACM > Contratos","ACM > Apontamentos"];
/* Famílias de menu dos módulos Pecuária e Cadastros Básicos (Agrícola) */
const FAMILY={
  "Pecuária":{pre:["Pecuária > Contratos","Pecuária > Cadastros Básicos","Pecuária > Apontamentos"], mob:"Aplicativo AgriX (Mobile)",
    dica:" No módulo Pecuária, os documentos comerciais (comissão, oportunidade, negociação e venda) ficam em Contratos, os cadastros de apoio (Lote de Recepção e GTA) em Cadastros Básicos e as operações de balança e de lotes para venda em Apontamentos. O manejo do dia a dia é feito no aplicativo mobile."},
  "Cadastros":{pre:["Configurações","Agrícola > Locais de Produção","Agrícola > Cadastros Básicos","Agrícola > Cadastros Básicos > Insumos","Agrícola > Cadastros Básicos > Cadastros de Análises"],
    dica:" As configurações iniciais (usuários, funções, moedas, aprovadores) ficam em Configurações; fazendas, setores e proprietários em Locais de Produção; e os cadastros agronômicos em Cadastros Básicos, com os submenus Insumos e Cadastros de Análises."}
};
SCREENS.forEach((s,i)=>{
  const F=FAMILY[s.m];
  if(F){
    if(s.mob){
      BANK.push({d:1, m:s.m, t:"mc", cat:"caminho", scr:s.n, p:"Onde é feito o registro de “"+s.n+"”?", o:[F.mob].concat(F.pre.map(p=>p+" > "+s.n)),
        e:s.n+" é feito no "+F.mob+", direto na fazenda."+F.dica});
      return;
    }
    if(!s.pq) return;
    const others=F.pre.filter(p=>p!==s.g);
    let wrong=others.slice(i%others.length).concat(others.slice(0,i%others.length)).slice(0,3);
    if(F.mob&&wrong.length<3) wrong=wrong.concat(["MOB"]);
    const d=s.m==="Pecuária"?2:(/Insumos|Análises|Configurações/.test(s.g)?2:1);
    BANK.push({d, m:s.m, t:"mc", cat:"caminho", scr:s.n, p:"Qual é o caminho no menu para chegar à tela “"+s.n+"”?", o:[s.path].concat(wrong.map(p=>p==="MOB"?F.mob+" > "+s.n:p+" > "+s.n)),
      e:"A tela "+s.n+" fica em "+s.path+"."+F.dica});
    return;
  }
  if(!s.pq) return;
  const acm=s.m==="ACM";
  const same=PREFIXES.filter(p=>p!==s.g&&(acm?p.startsWith("ACM"):p.startsWith("Administrativo")));
  const other=PREFIXES.filter(p=>acm?!p.startsWith("ACM"):p.startsWith("ACM"));
  const wrong=same.concat([other[i%other.length]]).slice(0,3);
  const d=acm?(/^(Operação|Tipo de|Liberação|Bloqueio|Programação|Recepção)/.test(s.n)?3:2):1;
  BANK.push({d, m:s.m, t:"mc", cat:"caminho", scr:s.n, p:"Qual é o caminho no menu para chegar à tela “"+s.n+"”?", o:[s.path].concat(wrong.map(p=>p+" > "+s.n)),
    e:"A tela "+s.n+" fica em "+s.path+"."+(acm?" No ACM, os cadastros de apoio ficam em Cadastros, os documentos comerciais em Contratos e as operações do dia a dia em Apontamentos.":" Cada módulo administrativo (Estoque, Compras e Vendas) tem as suas telas dentro do menu Administrativo.")});
});

/* ================= Utilidades ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmt(v){ if(v>=1000000) return "R$ 1 milhão"; if(v>=1000) return "R$ "+(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil"; return "R$ "+v.toLocaleString("pt-BR"); }
function nice(v){ const p=Math.pow(10,Math.floor(Math.log10(v))-1); return Math.round(v/p)*p; }
function makeLadder(n){ if(n===20) return [1000,2000,3000,4000,5000,10000,20000,30000,40000,50000,100000,150000,200000,250000,300000,400000,500000,600000,800000,1000000];
  const out=[]; for(let i=0;i<n;i++){ out.push(i===n-1?1000000:nice(1000*Math.pow(1000,i/(n-1)))); } return out; }
function prep(q){
  if(q.t==="vf") return {src:q, opts:["Verdadeiro","Falso"], c:q.a?0:1};
  const order=shuffle([0,1,2,3]); return {src:q, opts:order.map(i=>q.o[i]), c:order.indexOf(0)};
}
function interleave(list){ // equilibra módulos dentro de um nível
  const b={}; MODS.forEach(m=>b[m]=shuffle(list.filter(q=>q.m===m)));
  const out=[]; let left=true; while(left){ left=false; shuffle(MODS).forEach(m=>{ if(b[m].length){ out.push(b[m].shift()); left=true; } }); } return out;
}
/* Sorteia n perguntas dos módulos escolhidos: primeiro as inéditas, mantendo a mistura de dificuldades; só repete quando faltam inéditas. */
function pickQuestions(n, mods, seen){
  const pool=BANK.filter(q=>mods.includes(q.m)&&catOK(q)), U={}, V={};
  [1,2,3].forEach(d=>{ U[d]=interleave(pool.filter(q=>q.d===d&&!seen.has(q.id))); V[d]=interleave(pool.filter(q=>q.d===d&&seen.has(q.id))); });
  const want={1:Math.round(n*.35),3:Math.max(1,Math.round(n*.3))}; want[2]=n-want[1]-want[3];
  const take={1:[],2:[],3:[]};
  const grab=(d,k,src)=>{ while(k>0&&src[d].length){ take[d].push(src[d].shift()); k--; } return k; };
  let short=0;
  [3,1,2].forEach(d=>{ short+=grab(d,want[d],U); });
  [2,3,1].forEach(d=>{ short=grab(d,short,U); });
  [2,3,1].forEach(d=>{ short=grab(d,short,V); });
  return {list:take[1].concat(take[2],take[3]), rest:U[1].concat(U[2],U[3],V[1],V[2],V[3])};
}

/* Histórico por pessoa: perguntas já vistas e perguntas erradas (para a Revanche).
   Fica neste navegador (por nome) e, com login e acesso de Colaborador, também na conta. */
let cloudHist=null;
function histKey(){ return H.mode==="grupo"?"agrix-hist:grupo":"agrix-hist:"+(H.nome||"").trim().toLowerCase(); }
function getHist(){
  let h=loadJSON(histKey(),null);
  if(!h||!Array.isArray(h.vistas)){ h={vistas:loadJSON(H.mode==="grupo"?"agrix-seen:grupo":"agrix-seen:"+(H.nome||"").trim().toLowerCase(),[]), erradas:[]}; }
  if(!Array.isArray(h.erradas)) h.erradas=[];
  if(H.mode!=="grupo"&&cloudHist){ h.vistas=[...new Set(h.vistas.concat(cloudHist.vistas||[]))]; h.erradas=[...new Set(h.erradas.concat(cloudHist.erradas||[]))]; }
  const ok=new Set(BANK.map(q=>q.id)); h.vistas=h.vistas.filter(x=>ok.has(x)); h.erradas=h.erradas.filter(x=>ok.has(x));
  return h;
}
function putHist(h){
  store(histKey(), JSON.stringify(h));
  if(H.mode!=="grupo"){ cloudHist={vistas:h.vistas.slice(), erradas:h.erradas.slice()};
    if(db&&myId) db.collection("data/users/"+myId).doc("historico").set({vistas:h.vistas, erradas:h.erradas, atualizadoEm:new Date().toISOString()}).catch(()=>{}); }
}
function getSeen(){ return new Set(getHist().vistas); }
/* Registra o fim de uma partida: marca vistas e atualiza a lista de erradas */
function recordHistory(log, mods){
  const h=getHist(), s=new Set(h.vistas), err=new Set(h.erradas), ids=log.map(l=>l.id);

async function ensureProfile(u){

    await fetch(url,{method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({uid:u.uid, token})});

  }catch(e){}

  if(!FB_CONFIG||!window.firebase) return;

const TAB=Math.random().toString(36).slice(2,10);
const fbRoom={ join: async(name)=>{
  const uid=AUTH.user.uid, peerId=uid.slice(0,10)+"-"+TAB, col=fdb.collection("rooms").doc(name).collection("peers");

  const me=()=>({peer:peerId, by:uid, isMe:true, sameTab:true, kind:"viewer", guest:false, presence:Object.freeze(Object.assign({},mine)), updatedAt:Date.now()});
  const write=()=>col.doc(peerId).set({by:uid, host:!!mine.host, presence:mine, t:Date.now()});
  const fire=()=>{ const ps=list.concat([me()]); hs.forEach(h=>{ try{ h({peers:ps, joined:[], left:[], updated:[]}); }catch(e){} }); };
  await write();
  const bye=()=>{ try{ col.doc(peerId).delete(); }catch(e){} };

    presence: async(patch)=>{ mine=Object.assign({},mine,patch); Object.keys(mine).forEach(k=>{ if(mine[k]===null) delete mine[k]; }); fire(); await write(); },
    peers: ()=>list.concat([me()]),
    onPeers: (h)=>{ hs.push(h);
      if(!unsub) unsub=col.onSnapshot(s=>{ list=s.docs.filter(d=>d.id!==peerId).map(d=>{ const x=d.data()||{}; return {peer:d.id, by:x.by||null, isMe:x.by===uid, sameTab:false, kind:"viewer", guest:false, presence:Object.freeze(x.presence||{}), updatedAt:x.t||0}; }); fire(); }, ()=>{});

    leave: async()=>{ if(unsub) unsub(); unsub=null; hs=[]; window.removeEventListener("pagehide", bye); try{ await col.doc(peerId).delete(); }catch(e){} }

const PROG=[[57,60,64],[53,57,60],[55,59,62],[52,55,59]];
const PROG_LOBBY=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]];
function musicStart(level){
  musicStop(); if(!ac()) return;
  const c=SND.ctx, bpm=level===4?66:level===3?118:level===2?104:level===0?112:92, beat=60/bpm; let next=c.currentTime+.1, step=0;
  const bus=SND.mus;
  SND.loop=setInterval(()=>{
    while(next<c.currentTime+.4){
      const P=level===0?PROG_LOBBY:PROG, bar=Math.floor(step/8)%P.length, ch=P[bar], s=step%8;
      tone(N(ch[0]-24),next,beat*.45,{type:"triangle",vol:s%2?.10:.18,bus});
      if(s===0) ch.forEach(n=>tone(N(n),next,beat*7.6,{type:"sawtooth",lp:900,vol:.025,att:.4,hold:.7,bus}));
      const arp=[0,2,1,2,0,2,1,2][s]; tone(N(ch[arp]+12),next+beat*.5,beat*.35,{type:"sine",vol:.045,bus});
      if(s%2===1) noise(next,.04,{freq:8000,q:.6,vol:.025,ftype:"highpass",bus});
      if(s===7&&level===3) tone(N(ch[2]+24),next+beat*.75,beat*.2,{type:"sine",vol:.03,bus});
      if(level===4&&(s===0||s===1)) tone(N(28),next,beat*.4,{type:"sine",vol:.35,slide:N(24),bus}); // batida de coração
      if(level===0&&s%2===0) tone(N(ch[(s/2)%3]+24),next,beat*.3,{type:"triangle",vol:.04,bus});
      next+=beat*.5; step++;
    }
  },100);
}

/* where(q) devolve a tela {n, path, img} ligada à pergunta, ou null */
function where(q){
  if(q.scr) return scrByName(q.m,q.scr);
  if(/fluxo|sequência|quantas telas|ordem em que/i.test(q.p)) return null;
  const T=NEEDLES[q.m]; if(!T) return null;
  for(const txt of [q.p, q.e]){ const low=txt.toLowerCase(); for(const [tela,needles] of T){ if(needles.some(n=>low.includes(n.toLowerCase()))) return scrByName(q.m,tela); } }
  return null;
}

/* Ranking mensal: cada pessoa guarda o melhor resultado de cada mês em meses["AAAA-MM"] */
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function monthKey(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function prevMonthKey(){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return monthKey(d); }
function capFirst(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function monthName(k){ const [y,m]=k.split("-"); return MESES[+m-1]+" de "+y; }
function monthOf(r,k){ return ((r.meses||{})[k])||null; }
function showKey(r,k){ const s=(monthOf(r,k||monthKey())||{}).show||{}; return [s.acertos||0, s.premio||0]; }
function rankedFor(k){ return rankDocs.filter(r=>{ const m=monthOf(r,k); return m&&(m.show||m.treino); }).sort((a,b)=>{ const x=showKey(a,k), y=showKey(b,k); return y[0]-x[0]||y[1]-x[1]||((monthOf(b,k).treino||{}).pct||0)-((monthOf(a,k).treino||{}).pct||0); }); }
function medalIcons(list,max){ return (list||[]).filter(m=>MEDALS[m]).slice(0,max||6).map(m=>'<span title="'+esc(MEDALS[m].n+": "+MEDALS[m].d)+'">'+MEDALS[m].i+'</span>').join(""); }
const RANK_PRIZES=[["🥇","1º lugar","Café da manhã na Padaria Moinho"],["🥈","2º lugar","Um Day Off"]];
function prizesHTML(){ return '<div class="rprizes" aria-label="Prêmios do ranking">'+RANK_PRIZES.map(p=>'<div class="rprize"><span class="ri">'+p[0]+'</span><div><small>'+p[1]+'</small><b>'+p[2]+'</b></div></div>').join("")+'<p class="rrule">Ranking mensal: vale a classificação do Modo Show no mês, com mais acertos primeiro e, no empate, o maior prêmio. Todo dia 1º começa um ranking novo.</p></div>'; }
function rankHTML(){ return prizesHTML()+rankListHTML(); }

    rows.map((r,i)=>{ const mm=monthOf(r,mk), s=mm.show, t=mm.treino;

/* Campeão do mês passado + galeria dos campeões */
function championHTML(){
  const pk=prevMonthKey(), now=new Date(), next=new Date(now.getFullYear(), now.getMonth()+1, 1);
  let h='<p class="champ-tag">Campeão do mês passado</p>';
  if(rankState!=="ok"){ return h+'<p class="empty">'+(rankState==="carregando"?'Carregando…':'Entre com a sua conta Google para ver o campeão do mês.')+'</p>'; }
  const top=rankedFor(pk).filter(r=>monthOf(r,pk).show).slice(0,2);
  if(!top.length) h+='<div class="champ-empty"><span class="champ-trophy">🏆</span><p>Ainda não temos campeão. O primeiro será conhecido em <b>'+next.toLocaleDateString("pt-BR")+'</b>, com o fechamento do ranking de '+MESES[now.getMonth()]+'.</p></div>';
  else {
    const c=top[0], s=monthOf(c,pk).show;
    h+='<div class="champ-main"><span class="champ-trophy" aria-hidden="true">🏆</span><div><small>'+capFirst(monthName(pk))+'</small><b class="champ-name">'+esc(c.nome||"Sem nome")+'</b><span class="champ-score">'+s.acertos+'/'+s.n+' certas · '+fmt(s.premio||0)+'</span><span class="champ-prize">☕ Ganhou: Café da manhã na Padaria Moinho</span>'+(c.medalhas&&c.medalhas.length?'<span class="champ-medals">'+medalIcons(c.medalhas,8)+'</span>':'')+'</div></div>';
    if(top[1]){ const v=top[1], s2=monthOf(v,pk).show; h+='<div class="champ-vice"><span>🥈</span><div><b>'+esc(v.nome||"Sem nome")+'</b> <small>'+s2.acertos+'/'+s2.n+' certas · ganhou um Day Off 🌴</small></div></div>'; }
  }
  const months=[...new Set(rankDocs.flatMap(r=>Object.keys(r.meses||{})))].filter(k=>k<pk).sort().reverse().slice(0,6);
  const gal=months.map(k=>{ const w=rankedFor(k).filter(r=>monthOf(r,k).show)[0]; return w?'<li><span>'+capFirst(monthName(k))+'</span><b>🥇 '+esc(w.nome||"Sem nome")+'</b></li>':''; }).join("");
  if(gal) h+='<details class="champ-gal"><summary>Galeria dos campeões</summary><ul>'+gal+'</ul></details>';
  return h;
}

/* ================= Salvar resultado: ranking, medalhas e estatísticas do gestor ================= */
async function saveResult(premio, acertos, novas){
  const localKey="agrix-medals:"+(H.nome||"").trim().toLowerCase();
  const localMed=new Set(loadJSON(localKey,[])); novas.forEach(m=>localMed.add(m)); store(localKey, JSON.stringify([...localMed]));
  if(!db||!myId){ G.saveMsg="Resultado não salvo: entre com a sua conta Google para entrar no ranking."; return; }
  if(AUTH.status!=="aprovado"){ G.saveMsg="Seu acesso ainda está aguardando a aprovação do gestor. Este resultado não entrou no ranking."; return; }
  try{
    const ref=db.collection("ranking").doc(myId);
    const cur=await ref.get(); const d=cur.exists?(cur.data()||{}):{};
    const doc={nome:(H.nome||"Sem nome").slice(0,40), jogos:(d.jogos||0)+1, atualizadoEm:new Date().toISOString(), medalhas:[...new Set((d.medalhas||[]).concat([...localMed]))].filter(m=>MEDALS[m])};
    if(d.show) doc.show=d.show; if(d.treino) doc.treino=d.treino;
    if(G.mode==="show"){ const s=d.show||{acertos:-1,premio:-1}; if(acertos>s.acertos||(acertos===s.acertos&&premio>s.premio)) doc.show={premio, acertos, n:G.n}; }
    else if(G.mode==="treino"){ const pct=Math.round(acertos/G.n*100), t=d.treino||{pct:-1,n:0}; if(pct>t.pct||(pct===t.pct&&G.n>t.n)) doc.treino={pct, acertos, n:G.n}; }
    const mk=monthKey(); doc.meses=Object.assign({}, d.meses||{}); const mm=Object.assign({}, doc.meses[mk]||{});
    if(G.mode==="show"){ const s=mm.show||{acertos:-1,premio:-1}; if(acertos>s.acertos||(acertos===s.acertos&&premio>s.premio)) mm.show={premio, acertos, n:G.n}; }
    else if(G.mode==="treino"){ const pct=Math.round(acertos/G.n*100), t=mm.treino||{pct:-1,n:0}; if(pct>t.pct||(pct===t.pct&&G.n>t.n)) mm.treino={pct, acertos, n:G.n}; }
    mm.jogos=(mm.jogos||0)+1; doc.meses[mk]=mm;
    await ref.set(doc);
    // estatísticas detalhadas (só o dono e editores leem, no Painel do gestor)
    const sref=db.collection("stats").doc(myId); const sc=await sref.get(); const st=sc.exists?(sc.data()||{}):{};
    const mod=Object.assign({}, st.mod||{}), qs=Object.assign({}, st.q||{});
    G.log.forEach(l=>{ if(l.skip) return; const m=mod[l.m]||{ok:0,n:0}; mod[l.m]={ok:m.ok+(l.ok?1:0), n:m.n+1}; const x=qs[l.id]||{ok:0,n:0}; qs[l.id]={ok:x.ok+(l.ok?1:0), n:x.n+1}; });
    await sref.set({nome:doc.nome, jogos:(st.jogos||0)+1, ultimo:doc.atualizadoEm, ultimoModo:G.mode, mod, q:qs});
    G.saveMsg="Resultado salvo no ranking da equipe.";
  }catch(e){ G.saveMsg="Não foi possível salvar no ranking agora. Confira a internet e jogue de novo."; }
}
function computeMedals(){
  const got=new Set(loadJSON("agrix-medals:"+(H.nome||"").trim().toLowerCase(),[]));
  const mine=rankDocs.find(r=>r.id===myId); if(mine) (mine.medalhas||[]).forEach(m=>got.add(m));
  const acertos=G.log.filter(l=>l.ok).length, earn=[];
  earn.push("estreia");
  if(G.maxStreak>=5) earn.push("seq5"); if(G.maxStreak>=10) earn.push("seq10");
  if(G.mode==="show"&&acertos>=10&&!G.anyHelp) earn.push("semajuda");
  if(G.mode==="show"&&G.result.premio>=1000000) earn.push("milionario");
  if(G.mode==="treino"&&G.n>=10&&acertos===G.n) earn.push("gabarito");
  if(G.fast>=5) earn.push("relampago");
  if(G.mode==="revanche"&&G.revTotal>0&&G.recovered.size===G.revTotal) earn.push("revanche");
  if(G.mode==="treino"&&G.n>=10&&G.mods.length===1&&acertos/G.n>=.8) earn.push("mestre-"+G.mods[0]);
  return earn.filter(m=>!got.has(m));
}

const reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const FX={parts:[], raf:0};
function confetti(n, o){
  if(reduceMotion) return; o=o||{};
  const c=$("#fx"); if(!c) return; const W=c.width=innerWidth, Hh=c.height=innerHeight; const pal=["#81ceee","#5cbaea","#32a3dd","#2e8ccc","#ffffff","#f2c14e","#7ee2a4"];
  for(let i=0;i<n;i++){
    const burst=o.x!=null;
    FX.parts.push({x:burst?o.x:Math.random()*W, y:burst?o.y:-20-Math.random()*Hh*.4, vx:burst?(Math.random()-.5)*14:(Math.random()-.5)*2, vy:burst?-Math.random()*13-3:Math.random()*2+2,
      r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, s:o.money?1:Math.random()*.6+.6, money:o.money&&Math.random()<.55, col:pal[rnd(pal.length)], life:0});
  }
  if(!FX.raf) FX.raf=requestAnimationFrame(fxStep);
}
function fxStep(){
  const c=$("#fx"); if(!c){ FX.raf=0; return; } const x=c.getContext("2d"); x.clearRect(0,0,c.width,c.height);
  FX.parts=FX.parts.filter(p=>p.y<c.height+40&&p.life<600);
  FX.parts.forEach(p=>{ p.life++; p.vy+=.18; p.vx*=.99; p.x+=p.vx; p.y+=Math.min(p.vy,7); p.r+=p.vr;
    x.save(); x.translate(p.x,p.y); x.rotate(p.r);
    if(p.money){ x.fillStyle="#2f9e5f"; x.fillRect(-16,-8,32,16); x.fillStyle="#bff0cf"; x.font="bold 9px sans-serif"; x.textAlign="center"; x.textBaseline="middle"; x.fillText("R$",0,1); }
    else { x.fillStyle=p.col; x.fillRect(-5*p.s,-3*p.s,10*p.s,6*p.s); }
    x.restore(); });
  if(FX.parts.length) FX.raf=requestAnimationFrame(fxStep); else { FX.raf=0; x.clearRect(0,0,c.width,c.height); }
}
function burstFrom(el, n){ if(!el) return; const r=el.getBoundingClientRect(); confetti(n||40,{x:r.left+r.width/2, y:r.top+r.height/2}); }
function toast(html){ const t=document.createElement("div"); t.className="toast"; t.innerHTML=html; document.body.appendChild(t); setTimeout(()=>t.classList.add("out"),1900); setTimeout(()=>t.remove(),2400); }
function countdown(n, label){
  return new Promise(res=>{
    let k=n; const ov=document.createElement("div"); ov.className="countdown"; document.body.appendChild(ov);
    const step=()=>{ if(k===0){ ov.remove(); res(); return; } ov.innerHTML='<small>'+esc(label||"")+'</small><b>'+k+'</b>'; sfx.beep(k===1); k--; setTimeout(step,850); };
    step();
  });
}

/* ================= Jogo individual e em grupo ================= */
function newGame(){
  const grp=H.mode==="grupo", rev=H.mode==="revanche";
  let list, rest=[];
  if(rev){ list=shuffle(erradasPool()).slice(0,30); }
  else { const total=grp?H.players.length*H.per:H.n; const pk=pickQuestions(total, H.mods, getSeen()); list=pk.list; rest=pk.rest; }
  G={mode:H.mode, mods:H.mods.slice(), n:list.length, list, rest, idx:0, q:prep(list[0]), ladder:makeLadder(list.length), timer:H.timer, left:H.timer,
     players:grp?H.players.map((nm,i)=>({nome:nm||("Jogador "+(i+1)), cor:COLORS[i%COLORS.length], pts:0, ok:0, used:{cartas:false,placas:false,univ:false}})):null,
     pulosMax:list.length>=15?3:list.length>=10?2:1, used:{pular:0,cartas:false,placas:false,univ:false},
     gone:[], phase:"ask", chosen:null, log:[], saveMsg:"", streak:0, maxStreak:0, fast:0, anyHelp:false, enter:true,
     revTotal:rev?list.length:0, recovered:new Set(), retries:{}};
  S.screen="jogo"; sfx.intro();
  const hello=grp?"Bem-vindos ao Show do AgriX! Vamos começar com "+G.players[0].nome+".":rev?"Hora da revanche, "+H.nome+"! Vamos acertar as que ficaram para trás.":"Olá, "+H.nome+"! Bem-vindo ao Show do AgriX. Vamos começar!";
  LINE=hello; render(); window.scrollTo(0,0); say(hello);
  setTimeout(()=>{ if(S.screen==="jogo"&&G&&G.phase==="ask"&&G.idx===0) startQuestion(); }, 2200);
}
function curPlayer(){ return G.players?G.players[G.idx%G.players.length]:null; }
function lifeUsed(){ return G.players?curPlayer().used:G.used; }
function isLast(){ return G.idx===G.n-1; }
function isMillion(){ return G.mode==="show"&&isLast(); }
function questionLine(){
  const q=G.q, n=G.idx+1;
  let head;
  if(G.mode==="show") head=isMillion()?"Pergunta do milhão!":"Pergunta "+n+", valendo "+fmt(G.ladder[G.idx])+"!";
  else if(G.mode==="grupo") head=curPlayer().nome+", é com você! Pergunta "+DIFF[q.src.d].toLowerCase()+", vale "+PTS[q.src.d]+" pontos.";
  else head="Pergunta "+n+" de "+G.n+".";
  const spokenHead=G.mode==="show"?(isMillion()?"Atenção! Pergunta valendo um milhão de reais!":"Pergunta "+n+", valendo "+moneySpoken(G.ladder[G.idx])+"."):head;
  say(head, spokenHead);
}
function startQuestion(){ G.qStart=Date.now(); musicStart(isMillion()?4:G.q.src.d); startTimer(); questionLine(); }
function startTimer(){
  stopTimer(); if(!G.timer) return; G.left=G.timer; paintTimer();
  timerId=setInterval(()=>{ if($("#layer").innerHTML) return; G.left--; paintTimer(); if(G.left<=5&&G.left>0) sfx.tick(); if(G.left<=0){ stopTimer(); reveal(-1); } },1000);
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function paintTimer(){ const el=$(".timer"); if(!el||!G) return; el.classList.toggle("low",G.left<=5); el.querySelector(".fill").style.width=(G.left/G.timer*100)+"%"; el.querySelector("b").textContent=G.left+"s"; }
function stakes(){ const lv=G.idx, cur=lv?G.ladder[lv-1]:0; return {acertar:G.ladder[lv], parar:cur, errar:isLast()?0:(cur?nice(cur/2):0)}; }

function logAnswer(skip, msg){
  const q=G.q, ok=!skip&&G.chosen===q.c, p=curPlayer();
  G.log.push({m:q.src.m, p:q.src.p, e:q.src.e, ok, skip:!!skip, skipMsg:msg, sua:skip||G.chosen<0?"":q.opts[G.chosen], certa:q.opts[q.c], who:p?p.nome:null, cor:p?p.cor:null, id:q.src.id, w:where(q.src)});
  if(p&&!skip&&ok){ p.pts+=PTS[q.src.d]; p.ok++; }
  return ok;
}
function reveal(i){
  stopTimer(); musicStop();
  G.chosen=i; G.phase="lock"; render();
  const quick=G.mode==="treino"||G.mode==="revanche";
  const wait=quick?700:i<0?400:2400;
  if(i>=0&&!quick) sfx.roll(wait/1000);
  const elapsed=Date.now()-(G.qStart||Date.now());
  setTimeout(()=>{
    G.phase="done";
    const ok=logAnswer(false), q=G.q;
    if(ok){ G.streak++; G.maxStreak=Math.max(G.maxStreak,G.streak); if(G.timer&&elapsed<5000) G.fast++; if(G.mode==="revanche") G.recovered.add(q.src.id); }
    else { G.streak=0;
      if(G.mode==="revanche"){ const r=G.retries[q.src.id]||0; if(r<2){ G.retries[q.src.id]=r+1; G.list.push(q.src); G.n=G.list.length; } } }
    if(isMillion()&&ok){ render(); finish(G.ladder[G.idx],"Você ganhou o milhão!"); return; }
    render();
    if(ok){ sfx.right(); burstFrom($(".ans.right"), 50);
      const lines=G.mode==="show"?["Certa resposta! Você tem "+fmt(G.ladder[G.idx])+"!","Isso mesmo! Agora você tem "+fmt(G.ladder[G.idx])+"!","Acertou em cheio! "+fmt(G.ladder[G.idx])+" garantidos!"]
        :G.mode==="grupo"?["Certa resposta! Mais "+PTS[q.src.d]+" pontos para "+curPlayer().nome+"!","Isso aí, "+curPlayer().nome+"! Mandou bem!"]
        :["Certa resposta!","Isso mesmo!","Acertou em cheio!","Muito bem!"];
      const l=pickOne(lines); say(l, l.replace(/R\$ ([\d,.]+) mil/,"$1 mil reais").replace("R$ 1 milhão","um milhão de reais"));
      if([3,5,10,15].includes(G.streak)){ setTimeout(()=>{ sfx.streak(); toast('<b>🔥 '+G.streak+' seguidas!</b><span>Tá voando!</span>'); },700); }
    } else { sfx.wrong();
      say(i<0?"O tempo acabou!":pickOne(["Que pena, resposta errada.","Não foi dessa vez.","Ih, errou! Mas agora você aprendeu."]));
    }
    const fb=$(".feedback"); if(fb) fb.scrollIntoView({behavior:reduceMotion?"auto":"smooth", block:"nearest"});
  }, wait);
}
function alive(){ return G.q.opts.map((_,i)=>i).filter(i=>!G.gone.includes(i)); }
async function nextQuestion(q){
  G.q=prep(q); G.gone=[]; G.phase="ask"; G.chosen=null; G.enter=true;
  if(isMillion()){ G.phase="wait"; render(); musicStop(); say("Valendo um milhão!"); await countdown(3,"Valendo 1 milhão"); if(!G||S.screen!=="jogo") return; G.phase="ask"; G.enter=true; }
  render(); sfx.whoosh(); startQuestion();
}
function finish(premio, motivo){
  stopTimer(); musicStop();
  G.result={premio, acertos:G.log.filter(l=>l.ok).length, motivo};
  if(G.mode!=="grupo"||true) recordHistory(G.log, G.mods);
  S.screen="fim"; G.saveMsg="";
  G.newMedals=G.mode==="grupo"?[]:computeMedals();
  const acertos=G.result.acertos;
  if(G.mode==="show"&&premio>=1000000){ sfx.million(); confetti(220,{money:true}); say("Parabéns! Você é o novo milionário do AgriX!"); }
  else if(G.mode==="grupo"){ const top=G.players.slice().sort((a,b)=>b.pts-a.pts)[0]; sfx.end(); sfx.applause(null,3,1); confetti(160); say(top.nome+" venceu! Parabéns a todos!"); }
  else if(G.mode==="show"){ sfx.end(); if(premio>0) confetti(premio>=100000?140:70,{money:true}); say("Você leva "+fmt(premio)+"!", "Você leva "+moneySpoken(premio)+"."); }
  else { sfx.end(); const pct=Math.round(acertos/G.n*100); if(pct>=80) confetti(120); say(G.mode==="revanche"?"Você recuperou "+G.recovered.size+" de "+G.revTotal+" perguntas!":"Você acertou "+pct+"% das perguntas!"); }
  const nm=G.newMedals.slice();
  if(nm.length) setTimeout(()=>{ sfx.streak(); toast('<b>'+nm.map(m=>MEDALS[m].i).join(" ")+' Nova'+(nm.length>1?'s medalhas':' medalha')+'!</b><span>'+esc(nm.map(m=>MEDALS[m].n).join(", "))+'</span>'); },1500);
  render(); window.scrollTo(0,0);
  if(G.mode!=="grupo") saveResult(premio, acertos, G.newMedals).then(()=>{ const el=$(".save-msg"); if(el&&S.screen==="fim") el.textContent=G.saveMsg; });
}
