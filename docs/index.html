<title>Show do AgriX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: palco de auditório nas cores da logo AgriX — pergunta ao centro, escada de prêmios ou placar à direita, ajudas abaixo. Visual único (escuro) por escolha. */
:root{
  --stage:#061a33; --stage-2:#0a2a4e; --panel:#0e3866; --panel-hi:#15508f;
  --brand:#2e8ccc; --brand-2:#32a3dd; --sky:#5cbaea; --ice:#81ceee; --ice-ink:#04223d;
  --leaf:#2fbf72; --leaf-ink:#03230f; --wrong:#e9474d; --wrong-ink:#2e0405;
  --text:#eef6ff; --muted:#a3c0dc; --line:rgba(129,206,238,.20);
  --f-display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--stage);
  background-image:radial-gradient(1100px 520px at 50% -140px, rgba(50,163,221,.55) 0%, rgba(50,163,221,0) 70%), radial-gradient(700px 420px at 100% 100%, rgba(129,206,238,.10), rgba(129,206,238,0) 70%);
  background-attachment:fixed;
  color:var(--text); font-family:var(--f-body); font-size:16px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:18px 40px;
}
.wrap{max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:20px}
button{font:inherit; color:inherit; cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--ice); outline-offset:2px}

/* Cabeçalho */
.brand{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.logo{display:flex; align-items:center; gap:12px}
.logo img{width:46px; height:auto; display:block; filter:drop-shadow(0 4px 14px rgba(50,163,221,.45))}
.logo-text{font-family:var(--f-display); font-weight:800; font-size:23px; letter-spacing:.2px; line-height:1}
.logo-text span{color:var(--ice)}
.logo-sub{display:block; font-family:var(--f-body); font-weight:500; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-top:4px}
.sound{display:flex; gap:8px}
.sbtn{display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,.05); font-size:13px; font-weight:600}
.sbtn[aria-pressed="false"]{opacity:.5; text-decoration:line-through}
.sbtn:hover{border-color:var(--sky)}

/* Tela inicial */
.hero{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); gap:20px}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.card{position:relative; background:linear-gradient(180deg, var(--panel), var(--stage-2)); border:1px solid var(--line); border-radius:18px; padding:24px; min-width:0}
.card.setup{overflow:hidden}
.card.setup::after{content:""; position:absolute; right:-40px; top:-30px; width:240px; height:196px; background:var(--logo) no-repeat center/contain; opacity:.07; pointer-events:none}
h1{font-family:var(--f-display); font-weight:800; font-size:clamp(30px,5.6vw,52px); line-height:1.02; margin:0 0 10px; text-wrap:balance; position:relative}
h1 em{font-style:normal; color:var(--ice)}
h2{font-family:var(--f-display); font-weight:800; font-size:21px; margin:0 0 12px; text-wrap:balance}
.lead{color:var(--muted); margin:0 0 18px; max-width:60ch; position:relative}
.seg{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; padding:5px; border-radius:14px; background:rgba(0,0,0,.25); border:1px solid var(--line); margin-bottom:6px}
.seg button{border:none; background:transparent; border-radius:10px; padding:10px 8px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:2px}
.seg button small{font-weight:500; font-size:12px; color:var(--muted)}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg, var(--sky), var(--brand-2)); color:var(--ice-ink)}
.seg button[aria-pressed="true"] small{color:#0b3a5f}
.mode-desc{color:var(--muted); font-size:14px; margin:8px 0 18px; min-height:2.6em}
.field{display:grid; gap:8px; margin-bottom:16px}
.field > span{font-weight:600}
input[type=text]{width:100%; font:inherit; color:var(--text); background:rgba(0,0,0,.25); border:1px solid var(--line); border-radius:12px; padding:11px 14px}
input[type=text]::placeholder{color:var(--muted)}
.opts{display:flex; flex-wrap:wrap; gap:8px}
.opt{padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,.05); font-weight:600; font-variant-numeric:tabular-nums}
.opt:hover:not(:disabled){border-color:var(--sky)}
.opt[aria-pressed="true"]{background:var(--ice); color:var(--ice-ink); border-color:var(--ice)}
.opt:disabled{opacity:.3}
.players{display:grid; gap:8px}
.prow{display:grid; grid-template-columns:14px minmax(0,1fr) auto; gap:10px; align-items:center}
.dot{width:14px; height:14px; border-radius:50%}
.xbtn{border:1px solid var(--line); background:transparent; border-radius:10px; width:40px; height:40px; font-size:18px; color:var(--muted)}
.xbtn:hover:not(:disabled){border-color:var(--wrong); color:#ff9a9d}
.xbtn:disabled{opacity:.25}
.addp{justify-self:start; padding:8px 14px; border-radius:10px; border:1px dashed var(--sky); background:transparent; color:var(--ice); font-weight:600}
.addp:disabled{opacity:.35}
.go{width:100%; padding:15px; border-radius:14px; border:none; background:linear-gradient(180deg, var(--ice), var(--sky)); color:var(--ice-ink); font-family:var(--f-display); font-weight:800; font-size:20px; box-shadow:0 8px 24px rgba(50,163,221,.35)}
.go:hover{filter:brightness(1.06)}
.hint{font-size:13px; color:var(--muted); min-height:1.2em; margin:8px 0 0}
.hint.err{color:#ff9a9d}
.rules{margin:0; padding-left:18px; color:var(--muted); display:grid; gap:6px; font-size:15px}
.rules b{color:var(--text)}

/* Ranking */
.rank-list{list-style:none; margin:0; padding:0; display:grid; gap:6px}
.rank-row,.rank-head{display:grid; grid-template-columns:26px minmax(0,1fr) auto 52px; gap:10px; align-items:center}
.rank-row{padding:9px 12px; border-radius:10px; background:rgba(255,255,255,.04); font-variant-numeric:tabular-nums}
.rank-row.me{outline:1px solid var(--ice); background:rgba(129,206,238,.10)}
.rank-head{padding:0 12px 4px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.rank-pos{font-family:var(--f-display); font-weight:800; color:var(--ice)}
.rank-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600}
.rank-prize{font-weight:700; text-align:right}
.rank-prize small{display:block; font-weight:500; font-size:11px; color:var(--muted)}
.rank-tr{color:var(--muted); font-size:13px; text-align:right}
.empty{color:var(--muted); font-size:15px; padding:14px; border:1px dashed var(--line); border-radius:12px; margin:0}

/* Jogo */
.game{display:grid; grid-template-columns:minmax(0,1fr) 240px; gap:20px; align-items:start}
@media (max-width:880px){.game{grid-template-columns:minmax(0,1fr)} .side{display:none}}
.col{display:grid; gap:16px; min-width:0}
.topbar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.progress{font-size:14px; color:var(--muted)}
.progress b{color:var(--text)}
.turn{display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:14px; border:1px solid var(--line); background:rgba(0,0,0,.22)}
.turn .dot{width:18px; height:18px; box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.turn b{font-family:var(--f-display); font-size:20px}
.turn small{color:var(--muted); display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase}
.turn .pts{margin-left:auto; text-align:right; font-variant-numeric:tabular-nums}
.mini{display:none; gap:6px; flex-wrap:wrap}
@media (max-width:880px){.mini{display:flex}}
.mini span{font-size:13px; padding:4px 10px; border-radius:999px; border:1px solid var(--line); font-variant-numeric:tabular-nums}
.mini span.on{border-color:var(--ice); background:rgba(129,206,238,.12)}
.stakes{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.stake{border-radius:12px; padding:10px 12px; text-align:center; border:1px solid var(--line); background:rgba(0,0,0,.2)}
.stake small{display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.stake b{font-family:var(--f-display); font-size:clamp(15px,3.6vw,20px); font-variant-numeric:tabular-nums}
.stake.win{border-color:rgba(129,206,238,.6)} .stake.win b{color:var(--ice)}
.timer{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center}
.timer .track{height:8px; border-radius:999px; background:rgba(255,255,255,.10); overflow:hidden}
.timer .fill{height:100%; border-radius:999px; background:linear-gradient(90deg, var(--brand), var(--ice)); transition:width .25s linear}
.timer.low .fill{background:var(--wrong)}
.timer b{font-family:var(--f-display); font-size:20px; min-width:3ch; text-align:right; font-variant-numeric:tabular-nums}
.timer.low b{color:#ff9a9d}
.qbox{position:relative; border-radius:20px; padding:26px 24px 24px; background:linear-gradient(180deg, #13457c, #0d335e); border:2px solid rgba(129,206,238,.55); box-shadow:0 18px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08)}
.qmeta{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.chip{font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,.05)}
.chip.kind{border-color:rgba(129,206,238,.5); color:var(--ice)}
.qtext{font-family:var(--f-display); font-weight:600; font-size:clamp(19px,3.4vw,26px); line-height:1.25; margin:0; text-wrap:pretty}
.answers{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
@media (max-width:640px){.answers{grid-template-columns:minmax(0,1fr)}}
.ans{display:flex; align-items:center; gap:12px; text-align:left; padding:12px 16px 12px 12px; border-radius:999px; border:1.5px solid rgba(129,206,238,.30); background:linear-gradient(180deg, var(--panel-hi), var(--panel)); min-height:58px; transition:transform .12s, border-color .12s, background .2s}
.ans:hover:not(:disabled){border-color:var(--ice); transform:translateY(-1px)}
.ans .let{flex:none; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--ice); color:var(--ice-ink); font-family:var(--f-display); font-weight:800}
.ans .txt{min-width:0; font-weight:500}
.ans.gone{opacity:.22; text-decoration:line-through}
.ans.picked{border-color:var(--ice); background:linear-gradient(180deg, #2a87c9, #1a6aa6)}
.ans.right{border-color:var(--leaf); background:linear-gradient(180deg, #23914f, #166b39)}
.ans.right .let{background:#fff; color:var(--leaf-ink)}
.ans.wrong{border-color:var(--wrong); background:linear-gradient(180deg, #b8343a, #85202a)}
.ans.wrong .let{background:#fff; color:var(--wrong-ink)}
@media (prefers-reduced-motion:no-preference){ .ans.picked{animation:pulse .8s ease-in-out infinite} .ans.right{animation:flash .45s ease-in-out 3} }
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(129,206,238,.28)}}
@keyframes flash{50%{filter:brightness(1.45)}}
.lifelines{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.life{display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.06); font-weight:600; font-size:14px}
.life:hover:not(:disabled){border-color:var(--ice)}
.life:disabled{opacity:.32}
.life .ic{font-size:16px; line-height:1}
.life .n{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.stop{margin-left:auto; padding:10px 18px; border-radius:12px; border:1.5px solid var(--ice); background:transparent; color:var(--ice); font-weight:700}
.stop:hover:not(:disabled){background:rgba(129,206,238,.12)}
.stop:disabled{opacity:.32}
.feedback{border-radius:16px; padding:18px 20px; border:1px solid var(--line); background:rgba(0,0,0,.25); display:grid; gap:10px}
.feedback.ok{border-color:rgba(47,191,114,.6)} .feedback.bad{border-color:rgba(233,71,77,.6)}
.feedback h3{margin:0; font-family:var(--f-display); font-size:20px}
.feedback.ok h3{color:#7ee2a4} .feedback.bad h3{color:#ff9a9d}
.feedback p{margin:0; color:var(--muted); max-width:70ch}
.feedback p b{color:var(--text)}
.btn{justify-self:start; padding:12px 22px; border-radius:12px; border:none; background:var(--ice); color:var(--ice-ink); font-weight:700; font-size:16px}
.btn:hover{background:#a6def5}
.btn.ghost{background:transparent; color:var(--text); border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ice); background:transparent}

/* Lateral: escada e placar */
.side{position:sticky; top:calc(16px + env(safe-area-inset-top, 0px))}
.ladder{list-style:none; margin:0; padding:10px; border-radius:16px; border:1px solid var(--line); background:rgba(0,0,0,.22); display:flex; flex-direction:column-reverse; gap:2px; font-variant-numeric:tabular-nums; max-height:calc(100vh - 40px); overflow:auto}
.ladder li{display:flex; justify-content:space-between; gap:8px; padding:4px 10px; border-radius:8px; font-size:13.5px; color:var(--muted)}
.ladder li .lv{opacity:.7}
.ladder li.done{color:var(--text)}
.ladder li.now{background:var(--ice); color:var(--ice-ink); font-weight:800}
.ladder li.top{font-weight:700; color:var(--ice)}
.ladder li.top.now{color:var(--ice-ink)}
.board{list-style:none; margin:0; padding:12px; border-radius:16px; border:1px solid var(--line); background:rgba(0,0,0,.22); display:grid; gap:6px}
.board h3{margin:0 0 4px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
.board li{display:grid; grid-template-columns:12px minmax(0,1fr) auto; gap:8px; align-items:center; padding:7px 10px; border-radius:10px; font-variant-numeric:tabular-nums}
.board li.on{background:rgba(129,206,238,.14); outline:1px solid var(--ice)}
.board li .dot{width:12px; height:12px}
.board li span:nth-child(2){overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600}

/* Sobreposições */
.overlay{position:fixed; inset:0; z-index:20; background:rgba(2,10,24,.74); display:grid; place-items:center; padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.dialog{width:min(520px,100%); border-radius:20px; padding:24px; background:linear-gradient(180deg, var(--panel-hi), var(--stage-2)); border:2px solid rgba(129,206,238,.5); display:grid; gap:14px; max-height:100%; overflow:auto}
.dialog h3{margin:0; font-family:var(--f-display); font-size:24px; text-wrap:balance}
.dialog p{margin:0; color:var(--muted)}
.row{display:flex; gap:10px; flex-wrap:wrap}
.cards{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
.pcard{aspect-ratio:3/4; border-radius:12px; border:2px solid var(--ice); background:repeating-linear-gradient(45deg, #1a5a9a 0 8px, #0e3866 8px 16px); display:grid; place-items:center; font-family:var(--f-display); font-weight:800; font-size:28px; color:transparent; max-width:100%}
.pcard.open{background:#fff; color:var(--ice-ink)}
.pcard.mine{box-shadow:0 0 0 4px var(--sky)}
.bars{display:grid; grid-template-columns:repeat(var(--n),minmax(0,1fr)); gap:12px; align-items:end; height:180px; padding-top:8px}
.bar{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%}
.bar i{display:block; width:100%; border-radius:8px 8px 0 0; background:linear-gradient(180deg, var(--ice), var(--brand)); min-height:2px}
.bar small{font-weight:700; font-variant-numeric:tabular-nums}
.bar b{font-family:var(--f-display)}
.voices{display:grid; gap:8px; margin:0; padding:0; list-style:none}
.voices li{padding:10px 14px; border-radius:12px; background:rgba(0,0,0,.25)}
.voices li span{color:var(--muted); font-size:13px; display:block}

/* Resultado */
.result{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr); gap:20px; align-items:start}
@media (max-width:860px){.result{grid-template-columns:minmax(0,1fr)}}
.tag{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.big{font-family:var(--f-display); font-weight:800; font-size:clamp(40px,9vw,72px); line-height:1; color:var(--ice); margin:6px 0 10px; font-variant-numeric:tabular-nums}
.podium{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; align-items:end; margin:10px 0 18px}
.pod{display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; min-width:0}
.pod .nm{font-weight:700; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pod .pt{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.pod .blk{width:100%; border-radius:12px 12px 4px 4px; display:grid; place-items:center; font-family:var(--f-display); font-weight:800; font-size:28px; color:var(--ice-ink)}
.pod.p1 .blk{height:120px; background:linear-gradient(180deg, var(--ice), var(--sky))}
.pod.p2 .blk{height:88px; background:linear-gradient(180deg, var(--sky), var(--brand-2))}
.pod.p3 .blk{height:64px; background:linear-gradient(180deg, var(--brand-2), var(--brand))}
.table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; margin-bottom:8px}
.table th{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); text-align:left; font-weight:600; padding:6px 8px}
.table td{padding:8px; border-top:1px solid var(--line)}
.table td:not(:nth-child(2)), .table th:not(:nth-child(2)){text-align:right}
.score-mods{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:16px 0}
@media (max-width:520px){.score-mods{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sm{border-radius:12px; padding:10px 12px; background:rgba(0,0,0,.22); border:1px solid var(--line)}
.sm small{display:block; font-size:12px; color:var(--muted)}
.sm b{font-family:var(--f-display); font-size:20px; font-variant-numeric:tabular-nums}
.review{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.rv{border-radius:14px; padding:14px 16px; background:rgba(0,0,0,.22); border-left:4px solid var(--leaf)}
.rv.bad{border-left-color:var(--wrong)}
.rv.skip{border-left-color:var(--muted)}
.rv .q{font-weight:600; margin:6px 0}
.rv .a{font-size:14px; color:var(--muted); margin:0 0 4px}
.rv .a b{color:var(--text)}
.rv .e{font-size:14px; color:var(--muted); margin:0}
.save-msg{font-size:14px; color:var(--muted); margin:10px 0 0}
.foot{font-size:12.5px; color:var(--muted); text-align:center}
.seen{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; font-size:13.5px; color:var(--muted); margin:-4px 0 16px}
.linkbtn{border:none; background:none; padding:0; color:var(--ice); font-weight:600; font-size:13.5px; text-decoration:underline; text-underline-offset:3px}
[hidden]{display:none!important}
/* ---- Estrutura extra ---- */
.side-col{display:grid; gap:20px; min-width:0; align-content:start}
.seg{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:620px){.seg{grid-template-columns:repeat(3,minmax(0,1fr))}}
.btn.small{padding:6px 12px; font-size:13px}
.row.center{justify-content:center; align-items:center}
.dot.inl{display:inline-block; width:10px; height:10px; margin-right:8px; vertical-align:middle}
.go.alt{background:linear-gradient(180deg, #ffffff, var(--ice))}
.go:disabled{opacity:.4; cursor:not-allowed; box-shadow:none}
.streak{font-weight:700; font-size:14px; padding:4px 12px; border-radius:999px; background:rgba(255,160,60,.15); border:1px solid rgba(255,160,60,.5); color:#ffc58a}
.where{color:var(--ice)!important; font-size:14px}
.where-sm{color:var(--sky)!important}
.medals{display:inline-flex; gap:2px; margin-left:6px; font-size:13px; vertical-align:middle}
.medal-strip{display:flex; flex-wrap:wrap; gap:6px; font-size:22px; margin:14px 0 0}

/* ---- Apresentador ---- */
.presenter{display:flex; align-items:flex-end; gap:12px; min-width:0}
.mascot{flex:none; display:flex; flex-direction:column; align-items:center; gap:2px}
.mascot svg{display:block; filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.mascot-name{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ice)}
.bubble{position:relative; margin:0 0 18px; padding:12px 16px; border-radius:16px 16px 16px 4px; background:#fff; color:var(--ice-ink); font-weight:600; line-height:1.35; min-width:0; max-width:62ch; box-shadow:0 8px 20px rgba(0,0,0,.25)}
.bubble::before{content:""; position:absolute; left:-8px; bottom:0; border:8px solid transparent; border-right-color:#fff; border-bottom-color:#fff}
.presenter.compact .mascot svg{width:52px; height:52px}
.presenter.compact .bubble{font-size:15px; padding:9px 14px}
@media (prefers-reduced-motion:no-preference){
  .bubble.pop{animation:bubblePop .35s ease-out}
  .mascot.talk .mouth{animation:talk .16s ease-in-out infinite alternate; transform-origin:40px 55px}
  .mascot.talk svg{animation:bob .5s ease-in-out infinite alternate}
}
@keyframes bubblePop{0%{transform:scale(.92); opacity:.4}100%{transform:none; opacity:1}}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.5)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}

/* ---- Entrada em cena ---- */
@media (prefers-reduced-motion:no-preference){
  .enter .qbox{animation:qIn .55s cubic-bezier(.2,.9,.3,1.2) both}
  .enter .qbox::after{content:""; position:absolute; inset:0; border-radius:inherit; background:linear-gradient(105deg, transparent 35%, rgba(255,255,255,.28) 50%, transparent 65%); background-size:250% 100%; animation:sweep 1.1s .3s ease-out both; pointer-events:none}
  .enter .ans, .enter .kopt{animation:ansIn .45s calc(.55s + var(--i)*.28s) cubic-bezier(.2,.9,.3,1.1) both}
  .lboard li{animation:ansIn .4s calc(var(--i)*.15s) ease-out both}
}
@keyframes qIn{from{transform:scale(.85) translateY(10px); opacity:0}to{transform:none; opacity:1}}
@keyframes sweep{from{background-position:150% 0}to{background-position:-50% 0}}
@keyframes ansIn{from{transform:translateX(-24px); opacity:0}to{transform:none; opacity:1}}
.qbox.waiting{text-align:center; padding:40px}

/* ---- Pergunta do milhão ---- */
body.spot::before{content:""; position:fixed; inset:0; pointer-events:none; z-index:0; background:radial-gradient(520px 380px at 50% 32%, rgba(129,206,238,.18), rgba(0,0,0,.55) 70%)}
body.spot .wrap{position:relative; z-index:1}
.milhao .qbox{border-color:#fff; box-shadow:0 0 0 4px rgba(129,206,238,.35), 0 0 60px rgba(129,206,238,.45)}
.countdown{position:fixed; inset:0; z-index:40; display:grid; place-items:center; align-content:center; gap:8px; background:radial-gradient(circle at 50% 45%, rgba(21,80,143,.85), rgba(2,8,20,.95))}
.countdown small{font-family:var(--f-display); font-size:clamp(20px,4vw,32px); color:var(--ice); letter-spacing:.06em; text-transform:uppercase}
.countdown b{font-family:var(--f-display); font-size:clamp(120px,30vw,240px); line-height:1; color:#fff; text-shadow:0 0 40px rgba(129,206,238,.8)}
@media (prefers-reduced-motion:no-preference){ .countdown b{animation:zoom .85s ease-out} }
@keyframes zoom{from{transform:scale(1.8); opacity:0}to{transform:scale(1); opacity:1}}

/* ---- Ajudas animadas ---- */
.pcard{position:relative; aspect-ratio:3/4; border:none; padding:0; background:transparent; transform-style:preserve-3d; transition:transform .6s; max-width:100%}
.pcard .face{position:absolute; inset:0; border-radius:12px; display:grid; place-items:center; backface-visibility:hidden; -webkit-backface-visibility:hidden; font-family:var(--f-display); font-weight:800; font-size:30px}
.pcard .back{border:2px solid var(--ice); background:repeating-linear-gradient(45deg, #1a5a9a 0 8px, #0e3866 8px 16px)}
.pcard .front{background:#fff; color:var(--ice-ink); transform:rotateY(180deg); border:2px solid var(--ice)}
.pcard.open{transform:rotateY(180deg)}
.pcard.mine .front{box-shadow:0 0 0 4px var(--sky)}
.pcard:not(:disabled):hover{transform:translateY(-4px)}
.crowd{display:flex; flex-wrap:wrap; justify-content:center; gap:6px}
.crowd i{display:block; width:14px; height:22px; border-radius:7px 7px 3px 3px; background:var(--c)}
@media (prefers-reduced-motion:no-preference){ .crowd i{animation:raise .5s var(--d) ease-out both} }
@keyframes raise{from{transform:translateY(14px); opacity:0}to{transform:none; opacity:1}}
.bar i{height:0; transition:height .7s cubic-bezier(.2,.9,.3,1.1)}
.voices li{display:flex; gap:12px; align-items:flex-start}
.voices .av{flex:none; width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:var(--ice-ink); font-weight:800}
.voices .think{display:block; color:var(--muted); font-size:14px}
.voices .said{display:block}
@media (prefers-reduced-motion:no-preference){
  .voices li{animation:raise .35s var(--d) both}
  .voices .think{animation:gone 0s calc(var(--d) + 1s) forwards}
  .voices .said{opacity:0; animation:raise .35s calc(var(--d) + 1s) forwards}
}
@media (prefers-reduced-motion:reduce){ .voices .think{display:none} }
@keyframes gone{to{display:none; opacity:0; height:0}}

/* ---- Festa ---- */
#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:35}
.toast{position:fixed; z-index:45; left:50%; top:calc(16px + env(safe-area-inset-top, 0px)); transform:translateX(-50%); display:grid; gap:2px; text-align:center; padding:12px 22px; border-radius:16px; background:linear-gradient(180deg,#fff,#dff3fc); color:var(--ice-ink); box-shadow:0 12px 30px rgba(0,0,0,.35); max-width:calc(100% - 32px)}
.toast b{font-family:var(--f-display); font-size:20px}
.toast span{font-size:14px}
@media (prefers-reduced-motion:no-preference){ .toast{animation:toastIn .4s cubic-bezier(.2,.9,.3,1.3)} }
.toast.out{opacity:0; transition:opacity .4s}
@keyframes toastIn{from{transform:translate(-50%,-30px); opacity:0}to{transform:translateX(-50%); opacity:1}}
.cheque{position:relative; margin:4px 0 18px; padding:18px 22px; border-radius:14px; color:#16324f; background:linear-gradient(135deg,#f4fbff,#d7eefa); border:2px dashed #2e8ccc; box-shadow:0 14px 30px rgba(0,0,0,.3); display:grid; gap:10px; transform:rotate(-1.2deg)}
.ch-top,.ch-bottom{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:13px; font-weight:600; color:#3b5a7a}
.ch-top span:first-child{font-family:var(--f-display); font-weight:800; color:#2e8ccc; font-size:16px}
.ch-val{font-family:var(--f-display); font-weight:800; font-size:clamp(30px,6vw,46px); color:#0a2a4e; justify-self:end; padding:2px 14px; border:2px solid #2e8ccc; border-radius:10px; background:#fff}
.ch-line{font-size:15px}
.ch-sign{font-family:"Brush Script MT", cursive; font-size:24px; color:#0a2a4e; border-top:1px solid #8aa9c4; padding:0 24px}
.newmedals{margin:16px 0; padding:14px 16px; border-radius:14px; background:rgba(255,200,90,.08); border:1px solid rgba(255,200,90,.4)}
.newmedals h3{margin:0 0 8px; font-family:var(--f-display)}
.newmedals ul{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.newmedals li{display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:10px; align-items:center}
.newmedals .mi{grid-row:span 2; font-size:30px}
.newmedals small{color:var(--muted)}
.cert{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin:16px 0 0; padding:14px 16px; border-radius:14px; background:rgba(129,206,238,.10); border:1px solid rgba(129,206,238,.45); font-weight:600}
.board ol{list-style:none; margin:0; padding:0; display:grid; gap:6px}

/* ---- Ao vivo: telão ---- */
.live-split{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
@media (max-width:760px){.live-split{grid-template-columns:minmax(0,1fr)}}
.live-box{padding:16px; border-radius:16px; border:1px solid var(--line); background:rgba(0,0,0,.18); min-width:0}
.live-box h2{font-size:19px; margin-bottom:4px}
.codein{font-family:var(--f-display); font-size:28px!important; letter-spacing:.3em; text-align:center}
.live{display:grid; gap:18px}
.code-sm{font-family:var(--f-display); letter-spacing:.12em; color:var(--ice)}
.lobby{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:24px; align-items:center; padding:24px; border-radius:20px; background:linear-gradient(180deg,#13457c,#0d335e); border:2px solid rgba(129,206,238,.55)}
@media (max-width:700px){.lobby{grid-template-columns:minmax(0,1fr)}}
.bigcode{display:flex; gap:10px; margin:6px 0 14px}
.bigcode span{font-family:var(--f-display); font-weight:800; font-size:clamp(48px,9vw,96px); line-height:1; padding:10px 18px; border-radius:16px; background:#fff; color:var(--ice-ink)}
.steps{margin:0; padding-left:20px; color:var(--muted); display:grid; gap:4px}
.steps b{color:var(--text)}
.qr{display:grid; gap:6px; justify-items:center; text-align:center; color:var(--muted); font-size:13px}
.qr svg{width:min(240px,60vw); height:auto; background:#fff; border-radius:14px; padding:8px; display:block}
.pchips{display:flex; flex-wrap:wrap; gap:8px}
.pchip{padding:8px 14px; border-radius:999px; font-weight:700; background:var(--c); color:var(--ice-ink)}
@media (prefers-reduced-motion:no-preference){ .pchip{animation:qIn .4s cubic-bezier(.2,.9,.3,1.4)} }
.timer.big b{font-size:34px}
.kq .qtext{font-size:clamp(22px,3.6vw,34px)}
.kopts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
@media (max-width:600px){.kopts{grid-template-columns:minmax(0,1fr)}}
.kopt{position:relative; overflow:hidden; display:flex; align-items:center; gap:14px; padding:18px 20px; min-height:74px; border-radius:16px; background:var(--k); color:#fff; font-weight:700; font-size:clamp(16px,2.2vw,21px)}
.kopt .ksh{font-size:24px}
.kopt .txt{position:relative; z-index:1; min-width:0}
.kopt.dim{opacity:.35}
.kopt.right{outline:4px solid #fff; box-shadow:0 0 30px rgba(255,255,255,.4)}
.kopt .kcount{margin-left:auto; position:relative; z-index:1; font-family:var(--f-display); font-size:26px}
.kopt .kbar{position:absolute; left:0; bottom:0; height:6px; background:rgba(255,255,255,.75); transition:width .8s}
.ansc{font-weight:700; font-size:18px; color:var(--ice)}
.lboard{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.lboard li{display:grid; grid-template-columns:48px minmax(0,1fr) auto auto; gap:12px; align-items:center; padding:12px 16px; border-radius:12px; background:rgba(255,255,255,.06); font-size:20px; font-variant-numeric:tabular-nums}
.lboard li:first-child{background:rgba(129,206,238,.18); outline:1px solid var(--ice)}
.lboard .nm{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lboard .gain{color:#7ee2a4; font-weight:700; font-size:16px}

/* ---- Ao vivo: celular ---- */
.phone{display:grid; gap:14px; max-width:560px; margin:0 auto; width:100%}
.ph-top{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:14px; color:var(--muted); padding:10px 14px; border-radius:12px; background:rgba(0,0,0,.25)}
.ph-top b{color:var(--text)}
.ph-name{font-weight:700; color:var(--ice)}
.ph-q{padding:16px; border-radius:16px; background:linear-gradient(180deg,#13457c,#0d335e); border:1.5px solid rgba(129,206,238,.5)}
.ph-q p{margin:0; font-weight:600; font-size:17px}
.pad{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.pad.two{grid-template-columns:minmax(0,1fr)}
.padb{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:120px; padding:12px; border:none; border-radius:18px; background:var(--k); color:#fff; font-weight:700; font-size:15px; text-align:center; box-shadow:0 6px 0 rgba(0,0,0,.25)}
.padb .ksh{font-size:30px}
.padb:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.25)}
.ph-wait,.ph-res{display:grid; gap:8px; justify-items:center; text-align:center; padding:28px 18px; border-radius:18px; background:rgba(0,0,0,.22); border:1px solid var(--line)}
.ph-wait h2,.ph-res h2{margin:0; font-size:26px}
.ph-wait p,.ph-res p{margin:0; color:var(--muted)}
.ph-res .big{font-size:72px; margin:0}
.ph-res.ok{border-color:rgba(47,191,114,.7); background:rgba(47,191,114,.12)}
.ph-res.bad{border-color:rgba(233,71,77,.7); background:rgba(233,71,77,.12)}
.ph-res.bad .big{color:#ff9a9d}
.ph-res .gain{color:#7ee2a4; font-weight:800; font-size:22px}
.ph-exp{margin:0; font-size:14px; color:var(--muted)}
.pulse-dot{width:18px; height:18px; border-radius:50%; background:var(--ice)}
@media (prefers-reduced-motion:no-preference){ .pulse-dot{animation:pulse 1.2s ease-in-out infinite} }

/* ---- Painel do gestor ---- */
.panel{display:grid; gap:18px}
.tiles{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{padding:14px 16px; border-radius:14px; border:1px solid var(--line); background:rgba(0,0,0,.2)}
.tile small{display:block; color:var(--muted); font-size:12px; letter-spacing:.06em; text-transform:uppercase}
.tile b{font-family:var(--f-display); font-size:30px; font-variant-numeric:tabular-nums}
.ptable td,.ptable th{white-space:nowrap}
.heat{font-weight:700}
.heat.hi{color:#7ee2a4} .heat.mid{color:#f2c14e} .heat.lo{color:#ff9a9d} .heat.na{color:var(--muted)}
.worst{list-style:none; margin:0; padding:0; display:grid; gap:12px}
.worst li{display:grid; grid-template-columns:80px minmax(0,1fr); gap:12px; align-items:start}
.worst p{margin:4px 0}
.worst small{color:var(--muted)}
.wbar{height:10px; border-radius:999px; background:rgba(255,255,255,.1); overflow:hidden; margin-top:6px}
.wbar i{display:block; height:100%; background:var(--wrong)}
.sessions{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.sessions details{padding:10px 14px; border-radius:12px; background:rgba(0,0,0,.2); border:1px solid var(--line)}
.sessions summary{cursor:pointer}
.sq{color:var(--muted); font-size:14px; display:grid; gap:4px}
.sq b{color:var(--text)}
.hdr-btn{display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; border:1px solid var(--ice); background:rgba(129,206,238,.12); font-size:13px; font-weight:700}
.ptable td:first-child,.ptable th:first-child{text-align:left!important}
.ptable td:nth-child(2),.ptable th:nth-child(2){text-align:right}

/* ---- v5: área da pergunta maior ---- */
.wrap{max-width:1360px}
@media (min-width:881px){.game{grid-template-columns:minmax(0,1fr) 210px}}
.qbox{padding:34px 34px 30px; border-radius:24px}
.qtext{font-size:clamp(22px, 1.4vw + 14px, 40px); line-height:1.22}
.qmeta .chip{font-size:13px; padding:4px 12px}
.answers{gap:14px}
.ans{min-height:76px; padding:14px 22px 14px 14px; font-size:clamp(16px, .5vw + 13px, 21px)}
.ans .let{width:42px; height:42px; font-size:19px}
.stake{padding:8px 12px}
.ladder li{font-size:13px; padding:3px 10px}
.kq .qtext{font-size:clamp(24px, 2vw + 14px, 46px)}
.kopt{min-height:90px; font-size:clamp(18px, .8vw + 13px, 26px)}

/* ---- v5: apresentador sem rosto ---- */
.mascot img{display:block; width:40px; height:auto; filter:drop-shadow(0 4px 10px rgba(50,163,221,.5))}
.mascot-name{white-space:nowrap}
.presenter.compact .bubble{margin-bottom:6px}
@media (prefers-reduced-motion:no-preference){ .mascot.talk img{animation:bob .45s ease-in-out infinite alternate} }

/* ---- v5: imagem da tela junto da explicação ---- */
.feedback{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); align-items:start; gap:16px 22px}
.fb-text{display:grid; gap:10px; min-width:0}
@media (max-width:820px){ .feedback{grid-template-columns:minmax(0,1fr)} }
.feedback:not(:has(.shot)){grid-template-columns:minmax(0,1fr)}
.shot{margin:0; display:grid; gap:8px; min-width:0}
.shot figcaption{font-size:14px; color:var(--ice)}
.shot figcaption b{color:var(--text)}
.shotbtn{position:relative; display:block; padding:0; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff; cursor:zoom-in; max-width:100%}
.shotbtn img{display:block; width:100%; height:auto; max-height:320px; object-fit:contain; object-position:left top; background:#fff}
.shot.small .shotbtn{max-width:260px}
.shot.small .shotbtn img{max-height:150px}
.shot.small figcaption{font-size:13px}
.zoomhint{position:absolute; right:8px; bottom:8px; padding:3px 9px; border-radius:999px; background:rgba(4,34,61,.85); color:#fff; font-size:12px; font-weight:600}
.dialog.wide{width:min(1200px,100%)}
.zoomfig{margin:0; display:grid; gap:8px}
.zoomfig img{width:100%; height:auto; border-radius:10px; background:#fff}
.zoomfig figcaption{color:var(--ice); font-weight:600}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.ph-res + .ph-exp + .shot{justify-self:center}

/* ---- v6: diagnóstico do ao vivo ---- */
.lstatus{display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; margin:0 0 14px; padding:12px 14px; border-radius:12px; font-size:14px; border:1px solid var(--line); background:rgba(0,0,0,.2)}
.lstatus.good{border-color:rgba(47,191,114,.6); background:rgba(47,191,114,.10)}
.lstatus.bad{border-color:rgba(233,71,77,.6); background:rgba(233,71,77,.10)}
.lstatus small{flex-basis:100%; color:var(--muted)}
.conn{font-size:12px; font-weight:700; margin-right:10px}
.conn.on{color:#7ee2a4} .conn.off{color:#ffc58a}

/* ---- v7: prêmios do ranking ---- */
.rprizes{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:0 0 14px}
.rprize{display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:12px; background:linear-gradient(180deg, rgba(129,206,238,.16), rgba(129,206,238,.06)); border:1px solid rgba(129,206,238,.45); min-width:0}
.rprize .ri{font-size:26px; line-height:1}
.rprize small{display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ice)}
.rprize b{display:block; font-size:14px; line-height:1.25}
.rrule{grid-column:1 / -1; margin:2px 0 0; font-size:12px; color:var(--muted)}
.rank-row.top1{background:rgba(242,193,78,.12); outline:1px solid rgba(242,193,78,.6)}
.rank-row.top2{background:rgba(129,206,238,.10)}
.rank-row.top1 .rank-pos,.rank-row.top2 .rank-pos{font-size:20px}
.rtag{display:block; font-size:11.5px; font-weight:600; color:#f2c14e; white-space:normal}
.rank-row.top2 .rtag{color:var(--ice)}
@media (max-width:420px){.rprizes{grid-template-columns:minmax(0,1fr)}}

/* ---- v8: ranking mensal ---- */
.rmonth{display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 12px; align-items:baseline; margin:0 0 10px}
.rmonth b{font-family:var(--f-display); font-size:17px; text-transform:none}
.rmonth span{font-size:13px; color:var(--ice); font-weight:600}
.rprev{margin:0 0 10px; padding:8px 12px; border-radius:10px; background:rgba(242,193,78,.10); border:1px dashed rgba(242,193,78,.5); font-size:13.5px}

/* ---- v9: campeão do mês passado ---- */
.card.champ{background:radial-gradient(420px 220px at 85% 0%, rgba(242,193,78,.22), rgba(242,193,78,0) 70%), linear-gradient(180deg, var(--panel), var(--stage-2)); border:1.5px solid rgba(242,193,78,.6); overflow:hidden}
.champ-tag{margin:0 0 10px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:#f2c14e}
.champ-main{display:flex; gap:16px; align-items:center}
.champ-trophy{font-size:56px; line-height:1; filter:drop-shadow(0 6px 16px rgba(242,193,78,.45))}
@media (prefers-reduced-motion:no-preference){ .champ-trophy{animation:shine 2.8s ease-in-out infinite} }
@keyframes shine{50%{transform:rotate(-6deg) scale(1.06)}}
.champ-main > div{display:grid; gap:3px; min-width:0}
.champ-main small{color:var(--muted); font-size:13px}
.champ-name{font-family:var(--f-display); font-weight:800; font-size:clamp(24px,3vw,32px); line-height:1.1; overflow-wrap:anywhere}
.champ-score{font-size:14px; color:var(--ice); font-variant-numeric:tabular-nums}
.champ-prize{font-size:14px; font-weight:700; color:#f2c14e}
.champ-medals{display:flex; gap:3px; font-size:16px}
.champ-vice{display:flex; gap:10px; align-items:center; margin-top:14px; padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.05)}
.champ-vice > span{font-size:24px}
.champ-vice small{color:var(--muted)}
.champ-empty{display:flex; gap:14px; align-items:center}
.champ-empty .champ-trophy{opacity:.55; animation:none}
.champ-empty p{margin:0; color:var(--muted)}
.champ-empty b{color:var(--text)}
.champ-gal{margin-top:12px; font-size:14px}
.champ-gal summary{cursor:pointer; color:var(--ice); font-weight:600}
.champ-gal ul{list-style:none; margin:8px 0 0; padding:0; display:grid; gap:6px}
.champ-gal li{display:flex; justify-content:space-between; gap:10px; padding:6px 10px; border-radius:8px; background:rgba(255,255,255,.04)}
.champ-gal li span{color:var(--muted)}

/* ---- v10: retomar sala ---- */
.resume{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between; margin:0 0 16px; padding:14px 16px; border-radius:14px; background:rgba(129,206,238,.12); border:1.5px solid var(--ice)}

/* ---- GitHub: login Google e pessoas ---- */
#userbox{display:flex; align-items:center; gap:8px}
.gbtn{display:inline-flex; align-items:center; gap:10px; padding:9px 16px; border-radius:999px; border:none; background:#fff; color:#1f1f1f; font-weight:700; font-size:14px; box-shadow:0 4px 14px rgba(0,0,0,.25)}
.gbtn .g{display:grid; place-items:center; width:22px; height:22px; border-radius:50%; background:conic-gradient(#ea4335 0 25%, #fbbc05 0 50%, #34a853 0 75%, #4285f4 0); color:#fff; font-weight:800; font-size:13px}
.uchip{display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:14px}
.uchip img,.uav{width:32px; height:32px; border-radius:50%; object-fit:cover; background:var(--sky); color:var(--ice-ink); display:grid; place-items:center; font-weight:800}
.uchip small{display:block; font-size:11px; color:#ffc58a; font-weight:600}
.resume.warn{border-color:rgba(255,197,138,.7); background:rgba(255,197,138,.10)}
.playing{display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:12px; align-items:center; padding:10px 14px; border-radius:12px; background:rgba(0,0,0,.25); border:1px solid var(--line)}
.playing img{grid-row:span 2; width:40px; height:40px; border-radius:50%}
.playing small{color:var(--muted)}
.ulist{list-style:none; margin:10px 0 0; padding:0; display:grid; gap:8px}
.urow{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.04)}
.urow img,.urow .uav{width:36px; height:36px; border-radius:50%; object-fit:cover; background:var(--sky); color:var(--ice-ink); display:grid; place-items:center; font-weight:800}
.urow div{min-width:0} .urow b{display:block} .urow small{display:block; color:var(--muted); overflow:hidden; text-overflow:ellipsis}
@media (max-width:560px){.urow{grid-template-columns:auto minmax(0,1fr)} .urow .row{grid-column:1 / -1}}
.pill{display:inline-block; margin-left:8px; padding:2px 10px; border-radius:999px; background:#ffc58a; color:#3a2200; font-size:13px; vertical-align:middle}

.addg{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px}
.addg input{flex:1 1 240px; min-width:0; font:inherit; color:var(--text); background:rgba(0,0,0,.25); border:1px solid var(--line); border-radius:12px; padding:10px 14px}

/* ---- Tela de entrada (login) ---- */
body.gate .sound > *:not(#userbox), body.gate .foot{display:none!important}
body.gate #userbox{display:none}
.gate-wrap{min-height:calc(100vh - 140px); display:grid; place-items:center; padding-block:12px}
.gate-card{position:relative; width:min(460px,100%); text-align:center; display:grid; justify-items:center; gap:12px; padding:36px 28px 30px; border-radius:24px; background:radial-gradient(420px 240px at 50% 0%, rgba(129,206,238,.22), rgba(129,206,238,0) 70%), linear-gradient(180deg, var(--panel), var(--stage-2)); border:1.5px solid rgba(129,206,238,.45); box-shadow:0 24px 60px rgba(0,0,0,.4)}
.gate-logo{width:96px; height:auto; filter:drop-shadow(0 8px 22px rgba(50,163,221,.55))}
@media (prefers-reduced-motion:no-preference){ .gate-logo{animation:bob 1.6s ease-in-out infinite alternate} }
.gate-title{font-family:var(--f-display); font-weight:800; font-size:clamp(34px,8vw,48px); line-height:1; margin:4px 0 0}
.gate-title em{font-style:normal; color:var(--ice)}
.gate-sub{margin:0; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.gate-text{margin:6px 0 4px; color:var(--text); max-width:36ch}
.gbtn.big{padding:14px 26px; font-size:17px; gap:12px}

 // ---- Estoque ----
 {d:1,m:"Estoque",t:"mc",p:"Todo Depósito cadastrado no AgriX precisa estar vinculado a qual cadastro?",o:["Filial","Grupo Item","Código NCM","Unidade de Medida"],e:"Em Administrativo > Estoque > Depósito, o vínculo obrigatório é com a Filial. Depósito de envio direto ainda marca a opção “Não Controla Estoque”."},
 {d:1,m:"Estoque",t:"vf",p:"No Ajuste de Inventário, o saldo do item já é corrigido assim que o registro é salvo com status Aberto.",a:false,e:"O ajuste só é efetivado quando o status muda para Encerrado. Enquanto estiver Aberto, o saldo do sistema não muda."},
 {d:1,m:"Estoque",t:"vf",p:"O cadastro de Princípio de Ativos possui apenas um campo: Descrição.",a:true,e:"É um cadastro simples, com um único campo de Descrição. Use sempre a nomenclatura técnica oficial para evitar duplicidade."},
 {d:1,m:"Estoque",t:"mc",p:"No cadastro de Unidade de Medida, como é o campo Equivalência em Kg?",o:["Não é obrigatório, mas deve ser informado quando a unidade tiver essa equivalência","É obrigatório para todas as unidades","É calculado automaticamente pelo sistema","Só é usado em itens do tipo Serviço"],e:"Os campos são Descrição, Descrição Abreviada e Equivalência em Kg. A equivalência é opcional, mas deve ser preenchida sempre que existir."},
 {d:1,m:"Estoque",t:"mc",p:"Na Análise de Duração de Estoque, qual é o filtro principal da tela?",o:["Grupo de Item","Depósito","Fornecedor","Código NCM"],e:"A análise é feita por Grupo de Item, com a opção “Todos” para trazer itens de todos os grupos."},
 {d:1,m:"Estoque",t:"vf",p:"A tela Desbloqueio Lote só consegue liberar lotes que já foram bloqueados antes, por exemplo na Inspeção de Qualidade.",a:true,e:"A regra da tela é que existam lotes bloqueados para que a liberação seja feita."},
 {d:2,m:"Estoque",t:"mc",p:"Um Grupo Item chamado “COMBUSTÍVEIS” tem External Id “COMB”. Como fica o identificador dos itens criados nesse grupo?",o:["COMB0001, COMB0002, e assim por diante","0001COMB, 0002COMB, e assim por diante","COMBUSTÍVEIS-1, COMBUSTÍVEIS-2, e assim por diante","Precisa ser digitado manualmente em cada item"],e:"O External Id do grupo gera o identificador automático: os caracteres informados seguidos de um sequencial numérico. A configuração é opcional."},
 {d:2,m:"Estoque",t:"mc",p:"Quais são os três níveis de bloqueio disponíveis na Inspeção de Qualidade?",o:["Lote, Item e Depósito","Filial, Depósito e Grupo de Item","Item, NCM e Unidade de Medida","Lote, Safra e Contrato"],e:"Dá para bloquear um lote inteiro, um item inteiro ou o item só em um depósito específico."},
 {d:2,m:"Estoque",t:"mc",p:"O que acontece ao marcar “Receituário Agronômico” no cadastro de Item?",o:["Aparecem campos extras, como Classificação Toxicológica, Grupo Químico e Tabela MIP","O item passa a ser do tipo Serviço","O item fica bloqueado para venda","O sistema exige um Código NBS"],e:"Com Receituário Agronômico marcado, a tela exibe campos técnicos adicionais. Confira o preenchimento com o responsável técnico."},
 {d:2,m:"Estoque",t:"mc",p:"No cadastro de Item, quando o tipo é Serviço, qual código fiscal fica vinculado?",o:["Código NBS","Código NCM","CFOP","Código EAN"],e:"Produto se vincula ao Código NCM; Serviço se vincula ao Código NBS."},
 {d:3,m:"Estoque",t:"mc",p:"No Inventário de Estoque, analisando por Estoque Mínimo: Quantidade Atual 800 e Estoque Mínimo 1.000. O que mostra a coluna Análise?",o:["−200: o saldo está abaixo do mínimo, com risco de desabastecimento","+200: o saldo está acima do mínimo","1.800: a soma do saldo com o mínimo","0,8: o percentual de cobertura do estoque"],e:"Análise = Quantidade Atual − parâmetro escolhido. 800 − 1.000 = −200. Valor negativo indica saldo abaixo do parâmetro."},
 {d:3,m:"Estoque",t:"mc",p:"No cadastro de Código NCM, qual é o Prazo Legal da Garantia de um bem Durável?",o:["90 dias","30 dias","7 dias","180 dias"],e:"As opções são: Arrependimento (7 dias), Durável (90 dias) e Não Durável (30 dias)."},
 {d:3,m:"Estoque",t:"vf",p:"Os valores de Estoque Mínimo, Estoque Máximo e Ponto de Ressuprimento são definidos na própria tela de Inventário de Estoque.",a:false,e:"Esses valores vêm do cadastro do Item, na aba Depósito. O Inventário de Estoque só consulta e compara com o saldo atual."},
 {d:3,m:"Estoque",t:"mc",p:"Na Inspeção de Qualidade, qual nível de bloqueio o manual recomenda usar?",o:["O mais específico possível, para não paralisar o que não tem relação com o problema","Sempre o bloqueio do item inteiro, por segurança","Sempre o bloqueio do depósito inteiro","Tanto faz, o efeito é o mesmo"],e:"A recomendação é usar o bloqueio mais específico possível, para não prejudicar outros lotes, itens ou depósitos sem necessidade."},
 {d:2,m:"Estoque",t:"vf",p:"Pela tela Movimentação de Estoque, a transferência só pode ser feita entre depósitos da mesma filial.",a:true,e:"Essa é a regra de negócio da tela. Ela também mostra o histórico de entradas e saídas geradas por outras rotinas."},

 // ---- Compras ----
 {d:1,m:"Compras",t:"mc",p:"Qual tela marca o ponto de partida do processo de compras, registrando a necessidade interna antes de qualquer cotação?",o:["Solicitação de Compra","Pedido de Compra","Análise de Cotações","Importador XML Compra"],e:"A Solicitação de Compra registra a necessidade (item, quantidade, data necessária, centro de custo) e vai para a fila de aprovação e cotação."},
 {d:1,m:"Compras",t:"vf",p:"Para que um fornecedor receba o convite de cotação, o e-mail dele precisa estar preenchido no cadastro do fornecedor.",a:true,e:"O envio da cotação exige o e-mail do fornecedor no cadastro. O e-mail da empresa também precisa estar configurado nos parâmetros (acesso admin)."},
 {d:1,m:"Compras",t:"mc",p:"Qual tela importa automaticamente os dados de uma nota de compra feita fora do sistema?",o:["Importador XML Compra","Monitor NotaFiscal Compra","Pedido de Compra","Solicitação de Compra"],e:"O Importador XML lê o arquivo XML da NF-e e evita a digitação manual dos dados."},
 {d:1,m:"Compras",t:"vf",p:"Ao salvar a Nota Fiscal de Compra, são gerados títulos a pagar no financeiro.",a:true,e:"Os campos de Forma de Pagamento, Parcelas e Vencimento mostram que a nota gera títulos no Contas a Pagar."},
 {d:2,m:"Compras",t:"mc",p:"Na Análise de Cotações, ao marcar a caixa “Prazo de Pagto” e clicar em Analisar, o sistema prioriza qual proposta?",o:["A com prazo de pagamento mais longo ou mais parcelas","A de menor valor unitário","A com entrega mais rápida","A do fornecedor que respondeu primeiro"],e:"Cada caixa define uma prioridade: Valor Unitário (menor custo), Prazo de Pagto (prazo maior ou mais parcelas) e Data de Entrega (entrega mais rápida). A melhor proposta fica em verde."},
 {d:2,m:"Compras",t:"mc",p:"No Importador XML Compra, para que serve a aba De > Para?",o:["Ligar os produtos do XML do fornecedor aos itens cadastrados no AgriX","Escolher o fornecedor que vai receber a cotação","Definir as datas de vencimento das parcelas","Manifestar a nota na SEFAZ"],e:"Na aba De > Para o sistema compara a descrição do XML com o catálogo interno, para movimentar estoque e financeiro nos cadastros certos."},
 {d:2,m:"Compras",t:"vf",p:"Na tela Pedido de Compra, um usuário que é Aprovador Autorizado pode liberar o pedido sem abrir a tela Aprovação de Pedido de Compra.",a:true,e:"O manual traz essa observação: o Aprovador Autorizado pode “Liberar/Aprovar” direto no Pedido de Compra."},
 {d:2,m:"Compras",t:"mc",p:"Na Solicitação de Compra, para que serve o campo C/C?",o:["Direcionar o custo da compra para a unidade gerencial certa na contabilidade e no DRE","Informar a conta corrente do fornecedor","Definir a condição de cobrança","Registrar o código do comprador"],e:"C/C é o Centro de Custo: indica a qual unidade gerencial o custo daquela aquisição será alocado."},
 {d:2,m:"Compras",t:"mc",p:"Na tela Pedido de Compra, quando a aba Anexo fica disponível?",o:["Somente depois que o pedido é salvo","Antes de escolher o fornecedor","Só depois que a nota fiscal é emitida","Nunca, anexos ficam só na Solicitação"],e:"A aba Anexo permite vincular proposta, contrato ou cotação em PDF somente depois do pedido salvo."},
 {d:2,m:"Compras",t:"mc",p:"Qual sequência é usada para formalizar uma compra feita em contato direto com o fornecedor?",o:["Pedido de Compra → Aprovação de Pedido de Compra → Nota Fiscal de Compra","Solicitação → Análise de Cotações → Importador XML","Monitor NotaFiscal → Pedido de Compra → Solicitação","Importador XML → Aprovação de Solicitação → Pedido de Compra"],e:"Sem passar por cotação, o fluxo é Pedido de Compra, Aprovação de Pedido e Nota Fiscal de Compra."},
 {d:3,m:"Compras",t:"mc",p:"No Monitor NotaFiscal Compra, para que serve o botão Manifestar?",o:["Registrar na SEFAZ se a empresa reconhece a operação da nota","Importar o arquivo XML da nota para o sistema","Aprovar o pedido de compra vinculado à nota","Gerar as parcelas da nota no Contas a Pagar"],e:"Manifestar executa a Manifestação do Destinatário: Ciência da Emissão, Confirmação da Operação, Desconhecimento da Operação ou Operação não Realizada."},
 {d:3,m:"Compras",t:"vf",p:"Em uma compra de serviço, o depósito informado deve ser um depósito de envio direto configurado como “Não Controla Estoque”.",a:true,e:"Serviço não movimenta estoque, então usa depósito de envio direto marcado como “Não Controla Estoque”."},
 {d:3,m:"Compras",t:"mc",p:"No De > Para do Importador XML, o sistema não encontrou um dos itens da nota. O que é preciso fazer?",o:["Criar o cadastro do item para conseguir importar a nota","Importar assim mesmo, o item entra como serviço","Excluir a linha do XML","Trocar o Código NCM da nota"],e:"Quando o sistema não identifica o item no De > Para, é necessário cadastrá-lo para que a nota seja importada."},
 {d:3,m:"Compras",t:"mc",p:"O que acontece depois que o comprador escolhe a proposta na Análise de Cotações e clica em aprovar e enviar?",o:["O sistema gera automaticamente os Pedidos de Compra para os fornecedores escolhidos","O sistema emite a Nota Fiscal de Compra","A solicitação volta para o solicitante aprovar","Os fornecedores recebem um novo convite de cotação"],e:"Ao concluir a decisão, o sistema gera os Pedidos de Compra de forma automática."},

 // ---- Vendas ----
 {d:1,m:"Vendas",t:"vf",p:"A ordem em que as telas de Vendas aparecem no menu do sistema é a mesma ordem cronológica do processo de venda.",a:false,e:"O manual avisa que a ordem do menu não corresponde à ordem do processo. O fluxo real começa pela Tabela de Preço de Vendas."},
 {d:1,m:"Vendas",t:"mc",p:"Quais formas de recebimento o Pedido de Venda oferece?",o:["Pix, Boleto ou TED","Dinheiro, Cheque ou Cartão","Apenas Boleto","Pix ou Cartão de Crédito"],e:"As opções são Pix, Boleto (com o check “Emissão de Boleto”) ou TED."},
 {d:1,m:"Vendas",t:"mc",p:"Qual é o reflexo da Nota Fiscal de Venda no módulo Estoque?",o:["Baixa o saldo do depósito informado","Aumenta o saldo do depósito","Cria um novo lote do item","Nenhum, a venda só afeta o financeiro"],e:"A saída da mercadoria pela Nota Fiscal de Venda gera uma movimentação de saída no depósito informado."},
 {d:1,m:"Vendas",t:"vf",p:"Para usar Boleto no Pedido de Venda, é preciso marcar o check “Emissão de Boleto”.",a:true,e:"O manual indica: Boleto exige a marcação do check “Emissão de Boleto”."},
 {d:2,m:"Vendas",t:"mc",p:"Qual é o fluxo de Vendas mais realizado no AgriX?",o:["Tabela de Preço → Pedido de Venda → Aprovação → Nota Fiscal → Faturamento Recorrente","Pedido de Venda → Nota Fiscal → Aprovação → Tabela de Preço","Nota Fiscal → Pedido de Venda → Tabela de Preço → Aprovação","Aprovação → Pedido de Venda → Faturamento Recorrente → Nota Fiscal"],e:"Primeiro se define o preço, depois o pedido é registrado e aprovado, a nota é emitida e, para contratos periódicos, entra o Faturamento Recorrente."},
 {d:2,m:"Vendas",t:"mc",p:"Na Tabela de Preço de Vendas, o que acontece quando o método escolhido na grid é Markup?",o:["Habilita a coluna de percentual e o sistema soma a margem ao custo médio do item","Mantém o custo médio do item sem alteração","Habilita a coluna para digitar livremente o preço de venda","Aplica automaticamente o preço SPOT do mês"],e:"Markup forma o preço a partir do custo médio mais a margem. “Custo Médio” mantém o custo; “Preço de Venda” deixa o usuário digitar o valor."},
 {d:2,m:"Vendas",t:"mc",p:"Onde se gera o boleto de cobrança de uma venda?",o:["Na Nota Fiscal de Venda, aba LogBoleto","No Pedido de Venda, aba Produtos","Na Aprovação de Pedido de Venda","No Faturamento Recorrente"],e:"O quadro “Preciso fazer isso → Qual tela usar?” aponta a Nota Fiscal de Venda, aba LogBoleto."},
 {d:2,m:"Vendas",t:"mc",p:"Na Aprovação de Pedido de Venda, o que faz o botão Remover Linha?",o:["Tira o pedido da visualização sem aprová-lo","Cancela o pedido de venda","Exclui o pedido definitivamente","Reprova e devolve o pedido ao vendedor"],e:"Remover Linha só desconsidera a linha da visualização. Exemplo: o aprovador tem 5 pedidos e decide não aprovar um deles."},
 {d:2,m:"Vendas",t:"vf",p:"Depois de criada, a Tabela de Preço de Vendas precisa ser vinculada ao parceiro no cadastro Fornecedor/Cliente.",a:true,e:"O vínculo no cadastro do parceiro é o que faz a tabela valer na hora da cobrança."},
 {d:3,m:"Vendas",t:"vf",p:"Na tela Faturamento Recorrente, a cor amarela indica que a nota daquela competência já foi recebida e o título baixado no financeiro.",a:false,e:"Amarelo = Emissão Realizada. Verde = Nota Fiscal Recebida (baixa do título). Vermelho/Rosa = pedido cancelado."},
 {d:3,m:"Vendas",t:"mc",p:"Na Nota Fiscal de Venda, como funciona o botão Calcular Parcelas?",o:["É obrigatório e gera os títulos financeiros com vencimentos e valores","É opcional e só mostra uma simulação","Recalcula os impostos da nota","Divide a nota em várias notas menores"],e:"Calcular Parcelas é obrigatório: gera os títulos com seus vencimentos e valores."},
 {d:3,m:"Vendas",t:"mc",p:"No Pedido de Venda, para que serve o Modelo Documento “Invoice”?",o:["Vendas para clientes estrangeiros","Venda física de produtos","Cobranças sem tributação municipal ou estadual","Prestação de serviços"],e:"Produto = venda física; Invoice = clientes estrangeiros; Nota de Débito = sem tributação municipal/estadual; Serviço = serviços."},

 // ---- ACM ----
 {d:1,m:"ACM",t:"mc",p:"No ACM, sem qual informação não é possível criar um contrato de grãos?",o:["Safra","Moega","Rota","Tipo de Sinistro"],e:"O cadastro de Safra explica: não dá para criar um contrato de grãos sem dizer a qual safra ele pertence."},
 {d:1,m:"ACM",t:"mc",p:"No cadastro de Moega, o que é a moega?",o:["A estrutura onde o caminhão bascula os grãos para seguirem até os silos","A balança onde o caminhão é pesado","A portaria de entrada da unidade","O documento de entrada da carga"],e:"A moega é o “portão de entrada” físico: geralmente uma grade no chão onde o caminhão bascula os grãos."},
 {d:1,m:"ACM",t:"vf",p:"Um veículo marcado como “Veículo em Blacklist” fica proibido de entrar em qualquer unidade do grupo.",a:true,e:"Esse controle é usado após sinistros graves, fraudes em pesagem ou comportamento inadequado."},
 {d:1,m:"ACM",t:"mc",p:"No cadastro de Cultura, qual destes é um exemplo de cultura perene?",o:["Maçã","Soja","Aveia","Milho safrinha"],e:"Cultura perene tem ciclo longo, de anos ou décadas (ex.: maçã). Soja e aveia são não perenes."},
 {d:2,m:"ACM",t:"mc",p:"Em Itens de Checklist, qual tipo impede o caminhão de seguir para a pesagem ou descarga enquanto o item não estiver OK?",o:["Impeditivo","Sem Restrições","Aprovar com Restrições","Desclassificatório"],e:"Impeditivo é o bloqueio total. “Sem Restrições” só avisa; “Aprovar com Restrições” deixa descarregar, mas marca a carga com alerta."},
 {d:2,m:"ACM",t:"vf",p:"A Transferência de Titularidade registra a saída física do grão do armazém para outra unidade.",a:false,e:"Ela não registra movimento físico: o grão não sai do lugar, só muda de dono (venda entre produtores, pagamento de arrendamento etc.)."},
 {d:2,m:"ACM",t:"mc",p:"No cadastro de Armazém, o que significa o Tipo de Armazém “Participante”?",o:["O silo controla estoque, como silos próprios ou alugados com controle total","O armazém serve só de referência logística","O armazém pertence a um porto","O armazém só recebe insumos"],e:"Participante controla estoque. Não participante é só referência logística ou informativa, como terminais de terceiros."},
 {d:2,m:"ACM",t:"mc",p:"No Tipo de Embalagem, o que acontece quando “Desconta Tara” está marcado?",o:["O sistema subtrai a tara da embalagem do peso bruto da balança","O sistema ignora o peso da embalagem","O sistema cobra a embalagem do produtor","A tara do caminhão deixa de ser pesada"],e:"Marcado, o valor de Tara é descontado automaticamente do peso bruto. Desmarcado é comum no Granel."},
 {d:2,m:"ACM",t:"mc",p:"Na tela Visitante (portaria), qual é o campo mais importante?",o:["Placa","Motivo da Visita","Data/Hora Final","Filial"],e:"Pela placa o sistema busca se o veículo já tem histórico de visitas."},
 {d:2,m:"ACM",t:"vf",p:"Na recepção de um caminhão de terceiro, a Classificação de Carga deve ser feita antes do descarregamento.",a:true,e:"O manual orienta: sempre que o caminhão chega, a classificação é feita antes de descarregar."},
 {d:2,m:"ACM",t:"vf",p:"Um motorista marcado em Blacklist ainda consegue carregar em unidades de outras filiais.",a:false,e:"Com “Motorista em Blacklist” marcado, ele não consegue carregar em nenhuma unidade."},
 {d:2,m:"ACM",t:"mc",p:"Na tela Recepção, qual cor da legenda indica um veículo em bloqueio ou suspensão?",o:["Vermelho","Amarelo","Azul marinho","Vinho/Marrom"],e:"Vermelho = bloqueio ou suspensão. Amarelo = pendente, Azul marinho = fila de espera, Vinho/Marrom = concluído."},
 {d:3,m:"ACM",t:"mc",p:"Na Tabela de Análise, como funciona o desconto do tipo “Peso - Kg”?",o:["Abate os quilos excedentes do peso líquido da carga","Mantém o peso e aplica uma multa em reais sobre o valor a pagar","Classifica a carga pelo tamanho do grão na peneira","Bloqueia a carga até uma nova análise"],e:"Peso - Kg é o padrão para umidade e impureza. “Reais - R$” mantém o peso e aplica multa."},
 {d:3,m:"ACM",t:"mc",p:"Um contrato tem 100.000 kg. No Aditivo de Contrato, o usuário informa 20.000 kg. Qual será a Nova Quantidade?",o:["120.000 kg","20.000 kg","80.000 kg","100.000 kg, porque o aditivo só altera o preço"],e:"O Aditivo Contratual recebe a diferença, e o sistema soma original + aditivo. Isso também libera o excesso de carga na balança."},
 {d:3,m:"ACM",t:"mc",p:"No Romaneio de Entrada, o contrato aceita soja com até 14% de umidade e o classificador encontra 18%. Como o sistema calcula o desconto?",o:["Aplica o desconto sobre os 4% excedentes e abate os quilos do peso","Aplica o desconto sobre os 18% de umidade inteiros","Bloqueia a descarga até o grão ser secado","Não desconta nada, a umidade é só informativa"],e:"O desconto é calculado sobre o que passa do padrão (18% − 14% = 4%). O produtor é pago pelo Peso Líquido com Descontos."},
 {d:3,m:"ACM",t:"mc",p:"Na Operação de Contratos, o que faz o checkbox “Controlar saldo do parceiro”?",o:["Impede carregamentos ou entregas acima da quantidade do contrato","Exige autorização de um supervisor para cada embarque","Permite pesar fora da balança integrada","Bloqueia o parceiro no financeiro"],e:"Controlar saldo evita contratos “estourados”. Autorização de embarque é outro check (“Exige liberação p/ Embarque”)."},
 {d:3,m:"ACM",t:"mc",p:"Na Operação de Fixação, para que serve o campo Bushel?",o:["Converter sacas ou toneladas para a unidade usada na Bolsa de Chicago","Registrar o prêmio de exportação","Informar a cotação do dólar","Indicar se há derivativo financeiro vinculado"],e:"Bushel é a unidade internacional. O sistema converte para bater com os dados da CBOT."},
 {d:3,m:"ACM",t:"mc",p:"Na tela Viagem, como se chega ao valor líquido que o motorista ou a transportadora vai receber?",o:["Valor Total − Desconto","Valor Total + Comissão","Valor Total × Quantidade Transportada","Valor da mercadoria − Valor do frete"],e:"O campo Desconto abate adiantamentos de combustível, multas ou taxas (como a do CIOT) do Valor Total."},
 {d:3,m:"ACM",t:"mc",p:"Na Operação de Câmbio, o que significa a modalidade ACC?",o:["Adiantamento sobre Contrato de Câmbio","Acerto de Contas Consolidado","Adiantamento sobre Cambiais Entregues","Ajuste Cambial Corrente"],e:"ACC = Adiantamento sobre Contrato de Câmbio. ACE = Adiantamento sobre Cambiais Entregues. Também existe Câmbio Pronto."},
 {d:1,m:"ACM",t:"mc",p:"Para que serve o cadastro de Safra no ACM?",o:["Definir o período em que contratos, recebimentos e produtividade acontecem","Cadastrar as variedades de sementes","Registrar as análises de umidade","Definir o preço do grão no mês"],e:"A Safra é a janela de tempo das operações agrícolas, já que o ano civil raramente coincide com o ciclo das culturas."},
 {d:1,m:"ACM",t:"mc",p:"Qual tela faz o pré-cadastro de veículos e pessoas que entram na unidade, antes mesmo da balança?",o:["Visitante","Romaneio de Entrada","Classificação de Carga","Liberação de Programação"],e:"A tela Visitante (também chamada de Triagem ou Portaria) é o primeiro ponto de contato físico na unidade."},
 {d:1,m:"ACM",t:"vf",p:"O Romaneio de Entrada é o documento que registra a chegada física da mercadoria e oficializa a entrada no estoque.",a:true,e:"Nele se encontram os dados do contrato, do transporte, do peso e da qualidade da carga."},
 {d:1,m:"ACM",t:"mc",p:"Na tela Recepção, qual botão inicia o recebimento de mercadoria?",o:["Criar Romaneio Entrada","Criar Romaneio Saída","Alterar Status","Cadastrar Veículo"],e:"Criar Romaneio Entrada abre a tela para iniciar o recebimento. Criar Romaneio Saída é para a expedição."},
 {d:2,m:"ACM",t:"mc",p:"Na legenda de cores da Recepção, o que significa Verde Brilhante?",o:["Liberado pela classificação, pronto para operar","Pendente","Processo concluído","Veículo recusado ou não atendido"],e:"Verde Brilhante = liberado pela classificação. Amarelo = pendente, Vinho/Marrom = concluído, Azul Claro = não atendido."},
 {d:2,m:"ACM",t:"mc",p:"Em Itens de Checklist, qual tipo deixa o caminhão descarregar, mas marca a carga com alerta e costuma travar o pagamento até o documento ser entregue?",o:["Aprovar com Restrições","Impeditivo","Sem Restrições","Requerido"],e:"Aprovar com Restrições não para a fila de caminhões, mas garante que o produtor entregue o documento depois."},
 {d:2,m:"ACM",t:"mc",p:"Para que serve o cadastro de Grupo Financeiro?",o:["Controlar o crédito de vários parceiros sob um único limite global","Separar contas a pagar e a receber","Agrupar insumos por tipo","Definir a moeda dos contratos"],e:"O Limite Global é o crédito máximo que todos os parceiros do grupo podem consumir somados."},
 {d:2,m:"ACM",t:"mc",p:"No cadastro de Insumos, o que é o Código Mapa?",o:["O registro oficial do produto no Ministério da Agricultura","O código do produto em outro sistema","A localização do insumo no armazém","O código de barras da embalagem"],e:"O Código Mapa é como o “CPF” do produto no Brasil. O código em outro sistema é o Código Externo."},
 {d:2,m:"ACM",t:"mc",p:"No cadastro de Insumos, o que é o Período de Carência?",o:["O tempo entre a última aplicação e a colheita","O intervalo entre uma aplicação e outra","A validade do produto","O prazo de pagamento do insumo"],e:"A carência garante que o grão não tenha resíduos. O intervalo entre aplicações é outro campo: Intervalo de Apli. (Dias)."},
 {d:2,m:"ACM",t:"mc",p:"Na Liberação de Embarque e Desembarque, quando marcar “Transferência de Titularidade”?",o:["Quando a mercadoria não sai fisicamente, só muda de dono","Quando a carga vai para outra filial","Quando o caminhão é de terceiro","Quando o contrato foi renegociado"],e:"É a troca de “papel” entre produtores ou tradings dentro do mesmo silo."},
 {d:2,m:"ACM",t:"vf",p:"No cadastro de Motorista, marcar “Motorista Autônomo” muda a forma de calcular impostos como o INSS no frete.",a:true,e:"O checkbox indica que ele trabalha por conta própria, o que altera o cálculo dos impostos do frete."},
 {d:3,m:"ACM",t:"mc",p:"Na Operação de Transbordo, o que acontece quando “Permitir Trocar de Contrato” está desmarcado?",o:["O sistema trava o contrato original da carga","O operador pode trocar o contrato livremente","A carga fica bloqueada para expedição","O transbordo vira uma venda"],e:"Desmarcado, o contrato original fica travado e a rastreabilidade física e financeira não muda no meio do caminho."},
 {d:3,m:"ACM",t:"mc",p:"No Romaneio de Entrada, como são obtidos o Peso Bruto e o Peso Tara?",o:["Pelo botão Ler na balança integrada: bruto com o caminhão cheio, tara com ele vazio","Digitando os valores da nota do produtor","Pelo cadastro do veículo","Pela média dos últimos romaneios"],e:"O botão Ler busca o peso direto da balança. A tara cadastrada no veículo serve só como conferência."},
 {d:3,m:"ACM",t:"mc",p:"Na Declaração de Saldo Devedor, como é calculado o Saldo Devedor (kg)?",o:["Quantidade Contratada − Quantidade Entregue","Quantidade Entregue − Descontos","Quantidade Contratada + Aditivos","Valor do contrato ÷ preço do kg"],e:"O sistema subtrai automaticamente o entregue do contratado. A declaração exige aprovação de um gestor."},
 {d:3,m:"ACM",t:"mc",p:"Em Serviços Prestados, o que acontece quando “Cobrar peso líquido” está marcado?",o:["O serviço é cobrado só sobre o grão limpo, após descontar impureza e umidade","O serviço é cobrado sobre o peso bruto","O serviço é cobrado uma única vez","O serviço deixa de ser cobrado"],e:"Os três checks do rodapé (peso líquido, secagem e quebra técnica) definem como tratar impureza e umidade."},
 {d:3,m:"ACM",t:"mc",p:"Na Tabela de Preço do ACM, se não houver preço negociado para o mês, qual valor o sistema usa como referência?",o:["O Preço SPOT","O preço do mês anterior","O custo médio do item","Zero, até alguém digitar"],e:"Preço SPOT é o preço de mercado imediato, usado quando não há valor para o mês específico."},

 // ---- Estoque (ampliação) ----
 {d:1,m:"Estoque",t:"vf",p:"Todo Lote de Estoque precisa estar vinculado a um cadastro de Item já existente.",a:true,e:"É a primeira regra de negócio do Lote de Estoque."},
 {d:1,m:"Estoque",t:"mc",p:"Quais datas de rastreabilidade o Lote de Estoque permite registrar?",o:["Fabricação, Validade e Garantia","Compra, Entrega e Pagamento","Emissão, Vencimento e Baixa","Plantio, Colheita e Entrega"],e:"Além das três datas, o lote tem um código alfanumérico digitado livremente."},
 {d:1,m:"Estoque",t:"mc",p:"No cadastro de Depósito, o que fazer quando o depósito é de envio direto?",o:["Marcar a opção “Não Controla Estoque”","Deixar o depósito sem filial","Vincular o depósito a um fornecedor","Cadastrá-lo como um lote"],e:"Depósito de envio direto é marcado como “Não Controla Estoque”, o mesmo usado em compras e vendas de serviço."},
 {d:1,m:"Estoque",t:"mc",p:"O que o Código NCM classifica?",o:["As mercadorias, para fins fiscais (Nomenclatura Comum do Mercosul)","Os depósitos da empresa","Os serviços prestados","Os grupos de itens para relatórios"],e:"O NCM é a Nomenclatura Comum do Mercosul, usada para classificar fiscalmente as mercadorias."},
 {d:1,m:"Estoque",t:"vf",p:"A tela Movimentação de Estoque também mostra entradas e saídas geradas por outras rotinas, como a Ordem de Serviço da Oficina.",a:true,e:"Além das transferências, a tela serve de consulta do histórico de qualquer entrada ou saída do sistema."},
 {d:2,m:"Estoque",t:"mc",p:"Quais são os dois tipos de Ajuste de Inventário?",o:["Ajuste de quantidade em estoque e ajuste de custo médio","Entrada e saída","Transferência e devolução","Bloqueio e desbloqueio"],e:"O ajuste corrige a quantidade ou o custo médio de um item em um depósito."},
 {d:2,m:"Estoque",t:"vf",p:"Um mesmo registro de Ajuste de Inventário pode corrigir o item em vários depósitos de uma vez.",a:false,e:"O ajuste é sempre aplicado a um item específico em um depósito específico."},
 {d:2,m:"Estoque",t:"mc",p:"No cadastro de Código NCM, para que serve o campo Status (Ativo/Inativo)?",o:["Para filtros dentro do sistema","Para bloquear vendas do item","Para calcular o imposto","Para definir o prazo de garantia"],e:"O manual diz que o Status do NCM é usado em filtros dentro do sistema."},
 {d:2,m:"Estoque",t:"mc",p:"O cadastro de Grupo Item é obrigatório?",o:["Sim, na criação de itens, e também agrupa os itens em relatórios","Não, é opcional","Só para itens do tipo Serviço","Só para itens com Receituário Agronômico"],e:"Grupo Item é obrigatório no cadastro de item. O que é opcional é o External Id."},
 {d:2,m:"Estoque",t:"mc",p:"Como lançar o saldo inicial de um item recém-cadastrado?",o:["Com uma Movimentação de Entrada, pela tela Movimentação de Estoque","Digitando a quantidade na aba Depósito do item","Com um Ajuste de Custo Médio","Criando um Lote de Estoque"],e:"Para ter estoque é preciso uma movimentação de entrada: pela Movimentação de Estoque (saldo inicial) ou por apontamentos que geram entrada."},
 {d:2,m:"Estoque",t:"mc",p:"Na tela Desbloqueio Lote, como se localiza o lote bloqueado?",o:["Filtrando por período (Data Inicial e Data Final)","Pelo Código NCM","Pelo fornecedor","Pelo número do pedido de compra"],e:"O passo a passo começa filtrando pelo período e localizando o lote na tabela."},
 {d:3,m:"Estoque",t:"mc",p:"No Inventário de Estoque, cada linha da tabela de resultados é vinculada a quê?",o:["Item + Depósito","Item + Lote","Grupo de Item + Filial","Item + Fornecedor"],e:"O vínculo de cada linha é sempre Item + Depósito."},
 {d:3,m:"Estoque",t:"mc",p:"No Inventário de Estoque, o que a análise por Estoque Máximo ajuda a enxergar?",o:["Excesso de capital parado","Risco de faltar o item","A hora de comprar de novo","Lotes com validade vencida"],e:"Estoque Mínimo = risco de falta; Estoque Máximo = excesso de capital parado; Ponto de Ressuprimento = hora de comprar."},
 {d:3,m:"Estoque",t:"mc",p:"No Inventário de Estoque, o que indica a análise por Ponto de Ressuprimento?",o:["A hora de comprar novamente","O excesso de estoque","O custo médio ideal","O giro do estoque no ano"],e:"O Ponto de Ressuprimento sinaliza quando o saldo chegou ao nível de fazer nova compra."},
 {d:3,m:"Estoque",t:"mc",p:"Na Inspeção de Qualidade, quais filtros carregam a grid de itens e lotes?",o:["Grupo de Itens e/ou Item","Fornecedor e Nota Fiscal","Safra e Contrato","Filial e Centro de Custo"],e:"O passo a passo filtra por Grupo de Itens e/ou Item e depois carrega a grid."},
 {d:3,m:"Estoque",t:"mc",p:"O que o manual recomenda para evitar duplicidade em Unidade de Medida?",o:["Padronizar a nomenclatura antes de usar o sistema, sem cadastrar “Kg” e “KG” separados","Cadastrar uma unidade para cada fornecedor","Sempre informar a equivalência em litros","Usar apenas a descrição abreviada"],e:"Padronizar antes evita duplicidades como “Kg” e “KG”."},

 // ---- Compras (ampliação) ----
 {d:1,m:"Compras",t:"mc",p:"Quantas telas o manual lista dentro da área Compras?",o:["8","5","12","3"],e:"Solicitação, Aprovação de Solicitação e Geração de Cotação, Análise de Cotações, Pedido, Aprovação de Pedido, Importador XML, Nota Fiscal e Monitor NotaFiscal."},
 {d:1,m:"Compras",t:"mc",p:"Na Solicitação de Compra, o que informa o campo Data Necessária?",o:["O prazo limite para o item estar disponível na propriedade","A data em que a solicitação foi registrada","A data de pagamento ao fornecedor","A data em que o gestor aprovou"],e:"Data Necessária mostra a urgência. A data do registro é a Data da Compra."},
 {d:1,m:"Compras",t:"vf",p:"Na Solicitação de Compra, os campos Responsável pela Aprovação e Data da Aprovação são preenchidos automaticamente após a aprovação.",a:true,e:"Eles registram quem liberou o pedido e o horário exato, de forma automática."},
 {d:1,m:"Compras",t:"mc",p:"Na aba Itens Xml do Importador, o que aparece quando o produto não tem código de barras?",o:["SEM GTIN","0000000000000","O código NCM","Um campo vazio"],e:"O Código EAN mostra o GTIN do produto; sem registro, exibe SEM GTIN."},
 {d:2,m:"Compras",t:"mc",p:"O que é possível anexar na Solicitação de Compra?",o:["Orçamentos prévios, fotos da peça quebrada, laudos ou PDFs de referência","Apenas o XML da nota fiscal","Apenas o contrato assinado","Nada, anexos só existem no Pedido"],e:"A área Anexos ajuda o comprador a entender exatamente o que precisa ser comprado."},
 {d:2,m:"Compras",t:"mc",p:"Na Aprovação de Solicitação e Geração de Cotação, para que serve o checkbox Gerar Cotação?",o:["Marcar quais solicitações entram na mesma rodada de cotação","Enviar a solicitação de volta ao solicitante","Aprovar o pedido de compra","Gerar a nota fiscal"],e:"As solicitações marcadas são agrupadas em uma mesma rodada de cotação."},
 {d:2,m:"Compras",t:"mc",p:"Na aba Fornecedores da cotação, o Status de Envio aparece como “erro”. O que isso quer dizer?",o:["O convite não foi enviado para o e-mail do fornecedor","O fornecedor recusou a cotação","O prazo de retorno venceu","O preço ficou acima do esperado"],e:"Depois de salvar e clicar em aprovar e enviar, o status mostra “sucesso” se o e-mail foi enviado ou “erro” se não foi."},
 {d:2,m:"Compras",t:"mc",p:"Onde se acompanha os convites de cotação enviados, com respondidos, pendentes e data de expiração?",o:["No Dashboard de Cotações, na aba de dash Administrativo","No Monitor NotaFiscal Compra","Na tela Pedido de Compra","Na Solicitação de Compra"],e:"O dash de cotações fica no final da aba de dash Administrativo, no topo da base."},
 {d:2,m:"Compras",t:"mc",p:"Na tela Aprovação de Pedido de Compra, quantos pedidos podem ser aprovados de uma vez?",o:["Um ou mais, de uma única vez","Somente um por vez","No máximo cinco","Nenhum: a aprovação é feita só no pedido"],e:"A tela aprova um ou mais pedidos de uma vez, desde que o usuário seja aprovador autorizado."},
 {d:2,m:"Compras",t:"mc",p:"No Pedido de Compra, o que define o campo Cód. Tipo de Operação?",o:["A TES/CFOP da linha, que define a tributação do item","O tipo de pagamento","O depósito de destino","A moeda da compra"],e:"É a chave fiscal do item ou serviço (compra, remessa, bonificação)."},
 {d:2,m:"Compras",t:"mc",p:"Na Nota Fiscal de Compra, para que serve o campo Filial do Fornecedor?",o:["Garantir que a NF-e veio do CNPJ e da Inscrição Estadual certos do fornecedor","Indicar a filial da sua empresa que recebe","Definir o depósito de entrada","Escolher o comprador responsável"],e:"Um fornecedor (matriz) pode ter várias filiais; o campo confirma a unidade de origem correta."},
 {d:3,m:"Compras",t:"vf",p:"Na Aprovação de Solicitação e Geração de Cotação, o campo Centro de Custo é obrigatório para fazer a busca.",a:false,e:"O manual diz que o Centro de Custo não é obrigatório para a busca."},
 {d:3,m:"Compras",t:"mc",p:"No Pedido de Compra, o Modelo Documento “Nota de Débito” é usado para quê?",o:["Cobranças não sujeitas à tributação municipal ou estadual","Compra de fornecedores estrangeiros","Compra de serviços","Compra de mercadorias"],e:"Produto = mercadorias; Invoice = estrangeiros; Nota de Débito = sem tributação municipal/estadual; Serviço = serviços."},
